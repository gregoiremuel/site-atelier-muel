<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5d50">
<title>Le Pétale Sauvage : démonstration</title>
<style>
/* Espace boutique : mêmes couleurs et polices que le site (bleu de la devanture, blanc, Vollkorn + Source Sans 3). */
:root{
  --bleu:#46667f;--bleu-fonce:#2f4b61;--bleu-pale:#edf2f5;
  --encre:#1f2328;--gris:#5a6470;--trait:#d7dee4;--fond:#f6f8f9;--blanc:#fff;
  --paille:#efd58b;--ok:#2f6b45;--ok-pale:#e3f1e7;--alerte:#8a2c22;--alerte-pale:#fbecea;
  --titres:"Vollkorn",Georgia,serif;--texte:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --r:6px;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:400 1.0625rem/1.5 var(--texte)}
h1,h2,h3{font-family:var(--titres);font-weight:600;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--bleu-fonce)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:2px solid var(--bleu);background:var(--bleu);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}
.btn.sec{background:#fff;color:var(--bleu-fonce)}
.btn.sec:hover{background:var(--bleu-pale)}
.btn.discret{background:transparent;border-color:transparent;color:var(--bleu-fonce);padding:0 10px}
.btn.discret:hover{background:var(--bleu-pale)}
.btn.danger{background:#fff;border-color:#e2b8b2;color:var(--alerte)}
.btn.danger.confirmer{background:var(--alerte);border-color:var(--alerte);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.petit{min-height:36px;padding:0 12px;font-size:.9375rem}

/* Connexion */
.connexion{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.connexion form{width:100%;max-width:380px;background:#fff;border:1px solid var(--trait);border-radius:10px;padding:28px 24px;display:grid;gap:16px}
.connexion h1{font-size:1.625rem}
.connexion .sous{color:var(--gris);margin-top:-8px}
.mdp{display:flex;border:1px solid #b6c1ca;border-radius:var(--r);overflow:hidden;background:#fff}
.mdp input{flex:1;border:0;padding:12px;min-width:0}
.mdp input:focus{outline:none}
.mdp:focus-within{outline:2px solid var(--bleu);outline-offset:1px}
.mdp button{border:0;background:var(--bleu-pale);padding:0 12px;cursor:pointer;color:var(--bleu-fonce);font-weight:600;font-size:.9375rem}
.erreur{background:var(--alerte-pale);color:var(--alerte);border-radius:var(--r);padding:10px 12px}
.aide{color:var(--gris);font-size:.9375rem}

/* Barre du haut */
.haut{position:sticky;top:0;z-index:30;background:var(--bleu);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.haut-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.haut-titre{margin-right:auto;min-width:0}
.haut-titre b{display:block;font:600 1.25rem/1.15 var(--titres)}
.haut-titre span{font-size:.875rem;opacity:.85}
.haut .btn{border-color:rgba(255,255,255,.7);background:transparent;color:#fff;min-height:38px;padding:0 12px;font-size:.9375rem}
.haut .btn:hover{background:rgba(255,255,255,.14)}
.bandeau{background:var(--paille);color:var(--encre);text-align:center;font-size:.9375rem;padding:8px 16px}

/* Mise en page : éditeur + aperçu */
.cadre{max-width:1320px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:24px}
.editeur{display:grid;gap:12px;min-width:0;align-content:start}
.apercu-col{display:none}
@media (min-width:1080px){
  .cadre{grid-template-columns:minmax(0,1fr) 420px}
  .apercu-col{display:block;position:sticky;top:84px;height:calc(100svh - 104px)}
  .btn-apercu{display:none}
}
.apercu-col .tel-cadre{height:100%;border:1px solid var(--trait);border-radius:18px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.apercu-col .tel-cadre p{font-size:.8125rem;color:var(--gris);padding:8px 12px;border-bottom:1px solid var(--trait);background:var(--fond)}
.apercu-col iframe,.apercu-plein iframe{flex:1;width:100%;border:0;background:#fff}
.apercu-plein{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.apercu-plein .barre{display:flex;justify-content:space-between;align-items:center;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--trait)}

.intro-edit{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.intro-edit h1{font-size:1.5rem}

/* Panneaux */
details.pan{background:#fff;border:1px solid var(--trait);border-radius:10px}
details.pan>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:16px 18px}
details.pan>summary::-webkit-details-marker,details.item>summary::-webkit-details-marker{display:none}
details.pan>summary h2{font-size:1.3125rem}
details.pan>summary .resume{grid-column:1;color:var(--gris);font-size:.9375rem;min-width:0;overflow-wrap:anywhere}
details.pan>summary .chev{grid-row:1/span 2;grid-column:2}
.chev{width:30px;height:30px;border:1px solid var(--trait);border-radius:var(--r);display:grid;place-items:center}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.pan-corps{padding:0 18px 20px;display:grid;gap:16px;min-width:0}
.pastille{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8125rem;font-weight:600;background:var(--paille);color:var(--encre);margin-left:6px;vertical-align:2px}

/* Champs */
.champ{display:grid;gap:6px;min-width:0}
.champ>label,.champ>.lab{font-weight:600}
.champ .ex{font-weight:400;color:var(--gris);font-size:.9375rem}
.saisie{width:100%;min-height:46px;padding:10px 12px;border:1px solid #b6c1ca;border-radius:var(--r);background:#fff}
.saisie:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}
textarea.saisie{min-height:90px;resize:vertical;line-height:1.45}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;user-select:none}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .rail{width:46px;height:28px;border-radius:999px;background:#c5ced5;position:relative;transition:background .15s;flex:none}
.interrupteur .rail::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.interrupteur input:checked+.rail{background:var(--ok)}
.interrupteur input:checked+.rail::after{transform:translateX(18px)}
.interrupteur input:focus-visible+.rail{outline:2px solid var(--bleu);outline-offset:2px}

/* Photo */
.photo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.photo .vignette{width:96px;height:72px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;border:1px solid var(--trait)}
.photo .actions{display:flex;flex-wrap:wrap;gap:8px}
.photo input[type=file]{position:absolute;opacity:0;width:1px;height:1px}

/* Listes (fromages, plateaux…) */
.liste{display:grid;gap:8px}
details.item{border:1px solid var(--trait);border-radius:8px;background:#fff}
details.item[open]{border-color:var(--bleu)}
details.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px}
details.item>summary .mini{width:44px;height:44px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;flex:none}
details.item>summary .txt{flex:1;min-width:0}
details.item>summary::after{content:"";flex:none;width:8px;height:8px;margin-right:4px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.item[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.item>summary b{display:block;font:500 1.125rem/1.25 var(--titres);overflow-wrap:anywhere}
details.item>summary span.s{display:block;color:var(--gris);font-size:.9375rem;overflow-wrap:anywhere}
.item-corps{padding:4px 12px 14px;display:grid;gap:14px;border-top:1px solid var(--trait);padding-top:14px}
.item-outils{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.item-outils .ordre{display:flex;gap:6px}
.ajouter{justify-self:start}

/* Horaires */
.jours{display:grid;gap:0;border-top:1px solid var(--trait)}
.jour{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--trait)}
.jour .nomj{font-weight:600;padding-top:8px;text-transform:capitalize}
.plages{display:grid;gap:8px}
.plage{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.plage input{width:auto;min-width:118px;min-height:44px}
.plage span{color:var(--gris)}
.ferme{color:var(--gris);padding-top:8px}
@media (max-width:520px){.jour{grid-template-columns:minmax(0,1fr)}.jour .nomj{padding-top:0}}

/* Commandes reçues */
.cmds{display:grid;gap:10px}
.cmd{border:1px solid var(--trait);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.cmd.nouvelle{border-color:#d9b24a;background:#fffbef}
.cmd-tete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.cmd-tete b{font:600 1.125rem/1.25 var(--titres)}
.cmd dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.cmd dt{color:var(--gris)}
.cmd dd{margin:0;overflow-wrap:anywhere}
.statuts{display:flex;flex-wrap:wrap;gap:6px}
.statuts button{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:5px 12px;font-size:.875rem;cursor:pointer}
.statuts button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}
.etiquette{font-size:.8125rem;font-weight:600;border-radius:999px;padding:2px 10px}
.etiquette.nouvelle{background:var(--paille)}
.etiquette.confirmee{background:var(--bleu-pale);color:var(--bleu-fonce)}
.etiquette.retiree{background:var(--ok-pale);color:var(--ok)}
.etiquette.annulee{background:#eceef0;color:var(--gris)}
.vide{padding:16px;border:1px dashed var(--trait);border-radius:8px;color:var(--gris);text-align:center}

/* Barre d'enregistrement */
.barre-enr{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--trait);box-shadow:0 -4px 16px rgba(31,35,40,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barre-enr .in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.barre-enr .etat{margin-right:auto;font-weight:600}
.barre-enr .etat.modifie{color:#7a5a00}
.barre-enr .etat.ok{color:var(--ok)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--encre);color:#fff;border-radius:8px;padding:10px 16px;font-size:.9375rem;max-width:calc(100vw - 32px)}
@media (max-width:600px){.barre-enr .etat{flex-basis:100%;font-size:.875rem}.barre-enr .in .btn{flex:1 1 0;padding:4px 6px;min-width:0;white-space:normal;line-height:1.15;font-size:.9375rem;text-align:center}.haut-in .btn{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Vidéo de fond */
.video-champ{display:grid;gap:12px}
.video-apercu video{width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000;display:block}
.video-champ .saisie{margin-top:8px}

</style>
</head>

, css: "/*\n  Direction : les couleurs viennent de la boutique (devanture bleutée, murs clairs).\n  Un bleu, des neutres, une couleur paille réservée au message d'annonce.\n  Titres en Vollkorn, texte en Source Sans 3. Pas de capitales espacées, pas d'italique décoratif.\n*/\n:root{\n  --bleu:#46667f;\n  --bleu-fonce:#2f4b61;\n  --bleu-pale:#edf2f5;\n  --encre:#1f2328;\n  --gris:#5a6470;\n  --trait:#d7dee4;\n  --fond:#ffffff;\n  --paille:#efd58b;\n  --titres:\"Vollkorn\",Georgia,\"Times New Roman\",serif;\n  --texte:\"Source Sans 3\",\"Helvetica Neue\",Arial,sans-serif;\n  --wrap:1160px;\n  --gut:clamp(16px,4vw,36px);\n  --r:4px;\n  color-scheme:light;\n}\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;scroll-behavior:smooth}\nbody{margin:0;background:var(--fond);color:var(--encre);font:400 1.0625rem/1.65 var(--texte)}\nimg{display:block;max-width:100%}\na{color:var(--bleu-fonce)}\nh1,h2,h3{margin:0;font-family:var(--titres);font-weight:600;line-height:1.15;color:var(--encre)}\nh1,h2{font-weight:500;letter-spacing:-.005em}\np{margin:0}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}\n.skip{position:absolute;left:-9999px;top:0}\n.skip:focus{left:12px;top:12px;z-index:100;background:#fff;color:var(--encre);padding:10px 14px}\n:focus-visible{outline:2px solid var(--bleu);outline-offset:3px}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:2px solid var(--bleu);border-radius:var(--r);background:var(--bleu);color:#fff;font:600 1.0625rem/1 var(--texte);text-decoration:none;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap}\n.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}\n.btn-contour{background:transparent;color:var(--bleu-fonce)}\n.btn-contour:hover{background:var(--bleu-pale);color:var(--bleu-fonce)}\n.btn-blanc{background:#fff;border-color:#fff;color:var(--bleu-fonce)}\n.btn-blanc:hover{background:var(--bleu-pale);border-color:var(--bleu-pale)}\n.btn-clair{background:transparent;border-color:rgba(255,255,255,.85);color:#fff}\n.btn-clair:hover{background:rgba(255,255,255,.14);border-color:#fff}\n\n.maquette{background:#eef0f2;color:#444c55;font-size:.8125rem;line-height:1.4;padding:8px var(--gut);text-align:center}\n.annonce{background:var(--paille);color:var(--encre);text-align:center;padding:11px var(--gut);font-weight:600;font-size:1rem}\n\n/* En-tête posé sur la photo d'accueil */\n.top{position:absolute;top:0;left:0;right:0;z-index:3;color:#fff}\n.top .wrap{display:flex;align-items:center;gap:28px;min-height:84px}\n.nom{font:600 1.375rem/1.1 var(--titres);color:#fff;text-decoration:none;margin-right:auto;padding:12px 0}\n.nav{display:flex;gap:26px}\n.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:1rem;padding:6px 0;border-bottom:2px solid transparent}\n.nav a:hover{border-bottom-color:rgba(255,255,255,.7)}\n.top .tel{color:#fff;font-weight:600;text-decoration:none;border:2px solid rgba(255,255,255,.75);border-radius:var(--r);padding:9px 14px;white-space:nowrap}\n.top .tel:hover{background:rgba(255,255,255,.12)}\n.menu-btn{display:none;background:transparent;border:2px solid rgba(255,255,255,.75);border-radius:var(--r);color:#fff;font:600 1rem/1 var(--texte);padding:10px 14px;cursor:pointer}\n\n/* Accueil */\n.hero{position:relative;z-index:2;isolation:isolate;min-height:min(86svh,860px);display:flex;align-items:flex-end;color:#fff;background:var(--bleu-fonce)}\n.hero:not(:has(>img,>video)){min-height:0}\n.hero>img,.hero>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}\n.hero::after{content:\"\";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,26,32,.55) 0%,rgba(20,26,32,0) 26%,rgba(20,26,32,0) 42%,rgba(20,26,32,.76) 100%)}\n.hero-body{width:100%;padding-top:140px;padding-bottom:clamp(36px,6vw,72px)}\n.hero h1{color:#fff;font-size:clamp(2rem,4.2vw,3.25rem);max-width:18ch;line-height:1.1}\n.hero-body>p{max-width:52ch;margin:16px 0 0;font-size:1.0625rem;color:rgba(255,255,255,.93)}\n.hero .statut{margin-top:16px;font-weight:600}\n.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}\n[data-statut][hidden]{display:none}\n\n/* Sections */\n.sec{padding:clamp(64px,9vw,112px) 0}\n.alt{background:var(--bleu-pale)}\n.sec h2{font-size:clamp(1.625rem,2.7vw,2.125rem)}\n.sec .intro{max-width:56ch;margin-top:14px;color:var(--gris)}\n\n.about{display:grid;gap:40px}\n.about .ph-main{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);background:var(--bleu-pale)}\n.about .txt h2{margin-bottom:22px}\n.about .txt p{max-width:50ch;margin-bottom:1em}\n.about .ph-small{width:60%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);margin:32px 0 0 auto;background:var(--bleu-pale)}\n\n.ctr{display:grid;gap:44px}\n.sans-photo{max-width:860px}\n.ctr .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);background:var(--trait)}\n.famille{margin-top:28px}\n.famille+.famille{margin-top:8px}\nsummary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px}\nsummary::-webkit-details-marker{display:none}\nsummary::after{content:\"\";flex:none;width:9px;height:9px;margin-right:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s}\ndetails[open]>summary::after{transform:translateY(2px) rotate(-135deg)}\n.famille>summary{font:600 1.0625rem/1.3 var(--texte);color:var(--bleu-fonce);padding:14px 0 12px;border-bottom:2px solid var(--bleu)}\n.famille>summary small{font-weight:400;font-size:1rem;color:var(--gris);margin-left:6px}\n.faq{margin-top:28px;max-width:760px}\n.faq details{border-bottom:1px solid var(--trait)}\n.faq details:first-child{border-top:1px solid var(--trait)}\n.faq summary{font:500 1.125rem/1.4 var(--titres);padding:18px 0;color:var(--encre)}\n.faq summary:hover{color:var(--bleu-fonce)}\n.faq .rep{padding:0 0 20px;color:var(--gris);max-width:62ch}\n.faq .rep p+p{margin-top:.8em}\n.plus{margin-top:4px}\n.plus>summary{justify-content:flex-start;font-weight:600;color:var(--bleu-fonce);padding:16px 0}\n.plus>summary::after{margin-left:10px}\n.carte{list-style:none;margin:0;padding:0}\n.carte li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 20px;padding:14px 0;border-bottom:1px solid var(--trait)}\n.carte li.avec-photo{grid-template-columns:64px minmax(0,1fr) auto}\n.carte li.avec-photo img{grid-row:span 2;width:64px;height:64px;object-fit:cover;border-radius:var(--r);align-self:center}\n.carte .n{font:500 1.1875rem/1.3 var(--titres)}\n.carte .p{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}\n.carte .m{grid-column:1/-1;color:var(--gris);font-size:1rem}\n.carte li.avec-photo .m{grid-column:2/-1}\n\n.plateaux{position:relative;isolation:isolate;color:#fff;background:var(--bleu-fonce)}\n.plateaux>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}\n.plateaux::after{content:\"\";position:absolute;inset:0;z-index:-1;background:rgba(24,32,40,.66)}\n.hero:not(:has(>img,>video))::after,.plateaux:not(:has(>img))::after{display:none}\n.plateaux h2{color:#fff}\n.plateaux .grid{display:grid;gap:40px}\n.plateaux .intro{color:rgba(255,255,255,.9)}\n.pl{list-style:none;margin:0;padding:0}\n.pl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.3)}\n.pl li:first-child{border-top:1px solid rgba(255,255,255,.3)}\n.pl b{font:500 1.25rem/1.3 var(--titres)}\n.pl .p{font-weight:600;white-space:nowrap}\n.pl span:last-child{grid-column:1/-1;color:rgba(255,255,255,.86)}\n\n.presse-grid{display:grid;gap:40px}\n.avis{margin-top:16px;color:var(--gris)}\n.avis strong{color:var(--encre)}\n.articles{list-style:none;margin:0;padding:0}\n.articles li{border-bottom:1px solid var(--trait)}\n.articles li:first-child{border-top:1px solid var(--trait)}\n.articles a{display:block;padding:16px 0;text-decoration:none;color:var(--encre)}\n.articles .t{display:block;font:500 1.1875rem/1.3 var(--titres)}\n.articles .d{display:block;margin-top:2px;color:var(--gris);font-size:1rem}\n.articles a:hover .t{color:var(--bleu-fonce);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}\n\n.visit{display:grid;gap:48px}\n.hours{margin:28px 0 0}\n.hours div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--trait)}\n.hours div:first-child{border-top:1px solid var(--trait)}\n.hours dt{text-transform:capitalize}\n.hours dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}\n.hours .today{font-weight:600}\n.hours .today dt::after{content:\" (aujourd'hui)\";font-weight:400;color:var(--gris);text-transform:none}\n.hnote{margin-top:14px;color:var(--gris)}\n.visit .statut{margin-top:14px;font-weight:600;color:var(--bleu-fonce)}\n.infos{display:grid;gap:22px;align-content:start}\n.infos h3{font:600 1rem/1.3 var(--texte);color:var(--gris);margin-bottom:4px}\n.infos .gros{font:500 1.3125rem/1.3 var(--titres);color:var(--encre)}\n.infos a.gros{text-decoration:none}\n.infos .actions{margin-top:4px}\n.carte-box{position:relative;margin-top:56px;min-width:0;height:clamp(300px,36vw,440px);background:#fff;border:1px solid var(--trait);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}\n.carte-box p{color:var(--gris);font-size:.9375rem;margin-top:12px;max-width:44ch}\n.carte-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}\n\n/* Pied de page */\n.foot{background:var(--bleu-fonce);color:#dfe7ed;padding:64px 0 calc(36px + env(safe-area-inset-bottom,0px));font-size:1rem}\n.foot .nom{display:inline-block;padding:0}\n.foot-grid{display:grid;gap:32px;margin-top:36px}\n.foot h3{font:600 1rem/1.3 var(--texte);color:#fff;margin-bottom:8px}\n.foot ul{list-style:none;margin:0;padding:0}\n.foot li{margin-bottom:3px}\n.foot a{color:#fff}\n.legal{margin-top:52px;padding-top:20px;border-top:1px solid rgba(255,255,255,.18);display:flex;flex-wrap:wrap;gap:6px 24px;font-size:.875rem;color:#b9c6d0}\n.legal a{color:#dfe7ed}\n\n/* Menu mobile */\n.sheet{position:fixed;inset:0;z-index:60;background:var(--bleu);color:#fff;display:flex;flex-direction:column;padding:8px var(--gut) calc(24px + env(safe-area-inset-bottom,0px))}\n.sheet[hidden]{display:none}\n.sheet-top{display:flex;justify-content:space-between;align-items:center;min-height:64px}\n.sheet nav{display:flex;flex-direction:column;margin:auto 0}\n.sheet nav a{color:#fff;font:500 1.4375rem/1.2 var(--titres);text-decoration:none;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.22)}\n.sheet .actions .btn{flex:1}\n.bar{display:none}\nhtml.menu-ouvert{overflow:hidden}\n\n@media (min-width:900px){\n  .about{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center}\n  .ctr{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:72px;align-items:start}\n  .ctr .ph{position:sticky;top:28px;margin-top:6px}\n  .about.sans-photo,.ctr.sans-photo{grid-template-columns:minmax(0,1fr)}\n  .plateaux .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:end}\n  .presse-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px}\n  .visit{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px}\n  .foot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}\n}\n@media (max-width:960px){\n  .nav,.top .tel{display:none}\n  .menu-btn{display:inline-flex}\n}\n@media (max-width:720px){\n  body{font-size:1rem;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}\n  .top .wrap{min-height:72px}\n  .nom{font-size:1.25rem}\n  .hero{min-height:min(84svh,760px)}\n  .hero-body{padding-top:120px}\n  .hero .actions .btn{flex:1 1 140px}\n  .about .ph-small{width:72%}\n  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--trait);transition:transform .25s ease}\n  html.js .bar:not(.on){transform:translateY(110%)}\n}\n/* Commande de plateaux */\n.cmd{display:grid;gap:36px}\n.cmd-etapes{margin:22px 0 0;padding-left:1.3em;display:grid;gap:8px;max-width:44ch}\n.cmd-etapes li::marker{font-family:var(--titres);font-weight:600;color:var(--bleu)}\n.cmd-intro .hnote{max-width:44ch}\n.hnote a{white-space:nowrap}\n.cmd-form,.cmd-ok{background:#fff;border:1px solid var(--trait);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:grid;gap:18px}\n.cmd-form[hidden],.cmd-ok[hidden]{display:none}\n.cmd-form fieldset{border:0;margin:0;padding:0;min-width:0}\n.cmd-form legend{font-weight:600;padding:0;margin-bottom:10px}\n.choix-liste{display:grid;gap:10px}\n.choix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s,background-color .15s}\n.choix:hover{border-color:var(--bleu)}\n.choix input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--bleu)}\n.choix:has(input:checked){border-color:var(--bleu);background:var(--bleu-pale);box-shadow:inset 0 0 0 1px var(--bleu)}\n.choix-txt{display:grid;gap:3px;min-width:0}\n.choix-txt b{font:500 1.125rem/1.3 var(--titres)}\n.choix-txt span{color:var(--gris);font-size:1rem;line-height:1.45}\n.choix-txt em{font-style:normal;font-weight:600;font-size:.9375rem;color:var(--bleu-fonce)}\n.cmd-ligne{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}\n.champ-bloc{display:grid;gap:6px;min-width:0}\n.champ-bloc>label{font-weight:600;font-size:1rem}\n.fac{font-weight:400;color:var(--gris)}\n.saisie{width:100%;min-height:48px;padding:10px 12px;border:1px solid #b6c1ca;border-radius:var(--r);background:#fff;font:inherit;color:var(--encre)}\n.saisie:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}\n.saisie:disabled{background:var(--bleu-pale);color:var(--gris)}\ntextarea.saisie{min-height:96px;resize:vertical;line-height:1.45}\n.stepper{display:inline-flex;border:1px solid #b6c1ca;border-radius:var(--r);overflow:hidden;width:max-content}\n.stepper button{width:48px;min-height:48px;border:0;background:var(--bleu-pale);color:var(--bleu-fonce);font:600 1.375rem/1 var(--texte);cursor:pointer}\n.stepper button:hover{background:#dde7ee}\n.stepper input{width:64px;border:0;border-inline:1px solid #b6c1ca;text-align:center;font:600 1.125rem var(--texte);color:var(--encre);-moz-appearance:textfield;appearance:textfield}\n.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}\n.estimation{font-weight:600;color:var(--bleu-fonce);align-self:center}\n.estimation[hidden]{display:none}\n.cmd-info{color:var(--gris);font-size:1rem;margin-top:-8px}\n.cmd-erreur{background:#fbecea;color:#8a2c22;border-radius:var(--r);padding:12px 14px}\n.cmd-erreur[hidden]{display:none}\n.cmd-erreur a{color:inherit;font-weight:600}\n.cmd-envoyer{width:100%;min-height:54px;font-size:1.125rem}\n.cmd-envoyer:disabled{opacity:.7;cursor:progress}\n.cmd-rgpd{font-size:.875rem;color:var(--gris);margin-top:-6px}\n.piege{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}\n.cmd-ok{border-color:var(--bleu)}\n.cmd-ok h3{font-size:1.375rem}\n.cmd-ok p{color:var(--gris)}\n.recap{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:0;padding:14px 0;border-block:1px solid var(--trait)}\n.recap dt{color:var(--gris)}\n.recap dd{margin:0;min-width:0;overflow-wrap:anywhere}\n@media (min-width:900px){.cmd{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px;align-items:start}.cmd-intro{position:sticky;top:28px}}\n@media (max-width:480px){.recap{grid-template-columns:minmax(0,1fr)}.recap dd{margin-bottom:6px}}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}\n\n/* ---------- Variantes de mise en page (contenu.theme : accueil, titres, angles, offres_fond) ---------- */\n.angles-droits{--r:0px}\n.titres-filet .sec h2::before{content:\"\";display:block;width:44px;height:3px;background:var(--bleu);margin-bottom:18px}\n.titres-filet .plateaux h2::before{background:rgba(255,255,255,.85)}\n\n/* Accueil « partage » : texte sur la couleur de la boutique, photo à côté */\n.hero.hero-partage{display:block;min-height:0;background:var(--bleu-fonce)}\n.hero.hero-partage::after,.hero.hero-sobre::after{display:none}\n.hero-partage .top,.hero-sobre .top{position:static}\n.hero-grille{display:grid;gap:32px;padding-bottom:clamp(40px,6vw,80px)}\n.hero-partage .hero-body{padding:clamp(8px,3vw,32px) 0 0}\n.hero-photo{position:relative}\n.hero-photo img,.hero-photo video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:var(--bleu)}\n\n/* Accueil « sobre » : fond clair, sans grande photo */\n.hero.hero-sobre{display:block;min-height:0;background:var(--bleu-pale);color:var(--encre);border-bottom:1px solid var(--trait)}\n.hero-sobre .nom,.hero-sobre .nav a{color:var(--bleu-fonce)}\n.hero-sobre .nav a:hover{border-bottom-color:var(--bleu)}\n.hero-sobre .top .tel,.hero-sobre .menu-btn{border-color:var(--bleu);color:var(--bleu-fonce)}\n.hero-sobre .top .tel:hover{background:#fff}\n.hero-sobre h1{color:var(--encre)}\n.hero-sobre .hero-body{padding-top:clamp(28px,6vw,72px)}\n.hero-sobre .hero-body>p{color:var(--encre)}\n.hero-sobre .statut{color:var(--bleu-fonce)}\n\n/* Offres sur fond clair, photo dans la colonne */\n.offres-clair .grid{display:grid;gap:40px}\n.offres-clair .pl li{border-bottom-color:var(--trait)}\n.offres-clair .pl li:first-child{border-top-color:var(--trait)}\n.offres-clair .pl span:last-child{color:var(--gris)}\n.offres-clair .ph-offre{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);margin-top = 'Envoyer la demande';\n            if (reussi) fini('Demande envoyée', CMD.confirmation);\n            else montrerErreur('L’envoi n’a pas abouti. Appelez la boutique au ' + telBoutique + secours + '.');\n          });\n        });\n        return;\n      }\n      if (CMD.email) {\n        location.href = 'mailto:' + CMD.email + '?subject=' + encodeURIComponent(sujet) + '&body=' + encodeURIComponent(texte);\n        fini('Dernière étape', 'Votre messagerie s’ouvre avec la demande déjà rédigée : envoyez-la pour la transmettre à la boutique.');\n        return;\n      }\n      montrerErreur('Les demandes en ligne ne sont pas encore ouvertes. Appelez la boutique au ' + telBoutique + '.');\n    };\n    /* bouton simple (pas « submit ») : fonctionne aussi dans les aperçus qui bloquent les formulaires */\n    envoyer.addEventListener('click', envoyerDemande);\n    cf.addEventListener('submit', envoyerDemande);\n  }\n})();\n" };</script>
<script type="module">
/* Les trois jeux de polices proposés. Choisi dans contenu.theme.polices. Fichiers dans public/fonts. */
const POLICES = {
  classique: {
    description: 'Titres à empattements chaleureux (Vollkorn), texte net (Source Sans 3). Fromager, caviste, épicerie fine, librairie.',

    fichiers: [['Vollkorn', 500, 'vollkorn-latin-500-normal.woff2'], ['Vollkorn', 600, 'vollkorn-latin-600-normal.woff2'], ['Source Sans 3', 400, 'source-sans-3-latin-400-normal.woff2'], ['Source Sans 3', 600, 'source-sans-3-latin-600-normal.woff2']],
  },

    texte: '"Source Sans 3","Helvetica Neue",Arial,sans-serif',
    fichiers: [['Bitter', 500, 'bitter-latin-500-normal.woff2'], ['Bitter', 600, 'bitter-latin-600-normal.woff2'], ['Source Sans 3', 400, 'source-sans-3-latin-400-normal.woff2'], ['Source Sans 3', 600, 'source-sans-3-latin-600-normal.woff2']],
  },
  net: {

    texte: '"Libre Franklin","Helvetica Neue",Arial,sans-serif',
    fichiers: [['Libre Franklin', 400, 'libre-franklin-latin-400-normal.woff2'], ['Libre Franklin', 600, 'libre-franklin-latin-600-normal.woff2']],
  },
};

/* CSS des polices : url(f) donne l'adresse d'un fichier ("/fonts/x.woff2" ou "data:…"). */
function cssPolices(nom, url) {
  const P = POLICES[nom] || POLICES.classique;
  const faces = P.fichiers.map(([f, w, fichier]) => `@font-face{font-family:"${f}";font-style:normal;font-weight:${w};font-display:swap;src:url(${url(fichier)}) format("woff2")}`).join('\n');

}

/*
  Moteur de rendu, identique pour toutes les boutiques.
  Tout ce qui est propre à une boutique vient du contenu : textes, listes, horaires,
  vocabulaire du métier (contenu.metier), couleurs et polices (contenu.theme), parties affichées (contenu.sections).

*/

const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const SEMAINE = [1, 2, 3, 4, 5, 6, 0];
const EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paras = (s) => String(s || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
  .map((p) => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('\n');
const telHref = (t) => 'tel:' + String(t || '').replace(/[^\d+]/g, '').replace(/^0/, '+33');

const fmt = (m) => Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '');
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

const prixNombre = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.').replace(/[^\d.]/g, '')); return isFinite(n) && n > 0 ? n : null; };
const couleur = (c, d) => (/^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : d);

/* Vocabulaire du métier, avec des valeurs par défaut neutres */
function voc(C) {
  const M = C.metier || {}, P = M.produits || {}, O = M.offres || {}, D = M.demande || {};

  const type = ['retrait', 'devis', 'lien'].includes(D.type) ? D.type : 'retrait';

    demande: {
      type, rubrique: D.rubrique || 'Demandes reçues',
      quantite: type === 'retrait' ? (D.quantite || '') : '', unite: D.unite || '', parUnite: D.par_unite || '',
      date: D.date || (type === 'devis' ? 'Date souhaitée' : 'Jour du retrait'),
      precisions: D.precisions || (type === 'devis' ? 'Décrivez votre demande' : 'Précisions'),
      exemple: D.exemple || '', lien: D.lien || '', lienTexte: D.lien_texte || 'Réserver en ligne',
      nav: D.nav || (type === 'devis' ? 'Demander un devis' : 'Commander'),

}
const affiche = (C, k) => !(C.sections && C.sections[k] === false);

/* Mise en page choisie pour la boutique (contenu.theme) : quelques variantes testées, la première valeur sert par défaut */
const STYLES = { accueil: ['photo', 'partage', 'sobre'], titres: ['simple', 'filet'], angles: ['doux', 'droits'], offres_fond: ['photo', 'clair'] };
const ORDRE_PARTIES = ['boutique', 'produits', 'offres', 'presse', 'questions'];
function styleSite(C) {
  const T = C.theme || {};
  const choix = (k) => (STYLES[k].includes(T[k]) ? T[k] : STYLES[k][0]);
  const o = Array.isArray(T.ordre) ? T.ordre.filter((k, i, a) => ORDRE_PARTIES.includes(k) && a.indexOf(k) === i) : [];
  return { accueil: choix('accueil'), titres: choix('titres'), angles: choix('angles'), offres: choix('offres_fond'), ordre: [...o, ...ORDRE_PARTIES.filter((k) => !o.includes(k))] };
}

/* Horaires : { lundi: [["09:00","13:00"], …], … } -> minutes par jour (0 = dimanche) */
function horaires(C) {
  const H = {}, TXT = {};
  JOURS.forEach((j, d) => {
    const plages = ((C.horaires || {})[j] || [])
      .map((p) => [enMinutes(p && p[0]), enMinutes(p && p[1])])
      .filter((p) => p[0] != null && p[1] != null && p[0] < p[1])
      .sort((a, b) => a[0] - b[0]);
    H[d] = plages;
    TXT[d] = plages.length ? plages.map((s) => fmt(s[0]) + '–' + fmt(s[1])).join(' et ') : 'Fermé';
  });

}
function resumeHoraires(TXT) {
  const groupes = [];
  SEMAINE.forEach((d) => {
    const g = groupes[groupes.length - 1];
    if (g && g.txt === TXT[d]) g.fin = d; else groupes.push({ debut: d, fin: d, txt: TXT[d] });
  });
  return groupes.map((g) => {
    const n = SEMAINE.indexOf(g.fin) - SEMAINE.indexOf(g.debut) + 1;
    const jours = n === 1 ? cap(JOURS[g.debut]) : n === 2 ? `${cap(JOURS[g.debut])} et ${JOURS[g.fin]}` : `Du ${JOURS[g.debut]} au ${JOURS[g.fin]}`;
    return `<li>${esc(jours)} : ${esc(g.txt === 'Fermé' ? 'fermé' : g.txt)}</li>`;
  }).join('\n');
}

function src(p, largeur) {
  if (!p) return '';
  p = String(p).trim();
  if (/^https:\/\/images\.unsplash\.com\//.test(p)) return p.split('?')[0] + `?auto=format&fit=crop&w=${largeur}&q=70`;

}
/* Vidéo de fond (accueil) : fichier envoyé depuis l'espace de modification, lien https .mp4/.webm, ou fichier du site */
const videoSrc = (v) => { v = String(v || '').trim(); return /^(https:\/\/\S+\.(mp4|webm)(\?\S*)?|\/videos\/[a-z0-9-]+|\/assets\/\S+\.(mp4|webm)|data:video\/(mp4|webm);base64,\S+)$/i.test(v) ? v : ''; };
const ICO_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>';
function videoFond(v, poster, cls) {

}

/* Couleurs et polices de la boutique (variables CSS de site.css et admin.css) */
function cssTheme(C, url) {

}
const favicon = (C) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="5" fill="${couleur((C.theme || {}).couleur, '#46667f')}"/><text x="16" y="23" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#ffffff" text-anchor="middle">${esc(cap(((C.boutique || {}).nom || 'B').replace(/^(la |le |les |l')/i, '')).charAt(0))}</text></svg>`);

/*
  o = { maquette, urlPolice: (fichier) => url, css | cssHref, js | jsHref, lienMentions, lienAdmin, apiCommande, calme (aperçu de l'espace boutique : sans animations) }

function tete(C, o, titre, description) {

function rendreSite(C, o = {}) {
  const V = voc(C), B = C.boutique || {}, T = C.textes || {}, A = C.avis || {}, K = C.commandes || {};

  const offres = affiche(C, 'offres') ? (C.offres || []).filter((x) => x && x.nom) : [];

  const nom = B.nom || 'Boutique';

  const D = V.demande;

  const formulaire = demandeActive && D.type !== 'lien';
  const CMD = formulaire ? {

    email: K.email || '', cle: K.cle_web3forms || '', api: o.apiCommande || '',

  } : null;
  const donneesJs = `var H=${JSON.stringify(H)},INCONNUS=[],CMD=${JSON.stringify(CMD).replace(/</g, '\\u003c')};`;

    ? `<div class="maquette" role="note">Site d’exemple : commerce imaginaire, créé par Grégoire Muel pour montrer l’espace de modification. Rien n’est publié, vos essais restent dans ce navigateur.</div>` : '';

  const ligneProduit = (f) => {
    const meta = [f.origine, f.detail].filter(Boolean).map(esc).join('. ');
    const photo = f.photo ? img(f.photo, 240, 'vignette') : '';
    return `<li${photo ? ' class="avec-photo"' : ''}>${photo}<span class="n">${esc(f.nom)}</span><span class="p">${esc(f.prix || '')}</span>${meta ? `<span class="m">${meta}</span>` : ''}</li>`;

/* Espace boutique. Fonctionne avec le serveur (mode normal) ou seul dans un fichier (mode démonstration). */

const DEMO = window.ESPACE_DEMO || null;
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs, ...enfants) => {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  enfants.flat(Infinity).forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
};
const copie = (o) => JSON.parse(JSON.stringify(o));

const vraiApi = {
  async charger() {
    const r = await fetch('/api/contenu', { credentials: 'same-origin' });
    if (r.status === 401) return null;
    const j = await r.json();
    if (!j.ok) throw new Error(j.erreur || 'Erreur');
    return j;
  },
  async connexion(mdp) {
    const r = await fetch('/api/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ motdepasse: mdp }) });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.erreur || 'Connexion impossible.');
  },
  async deconnexion() { await fetch('/api/deconnexion', { method: 'POST' }); },
  async enregistrer(C) {
    const r = await fetch('/api/contenu', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(C) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw Object.assign(new Error(j.erreur), { session: true });
    if (!j.ok) throw new Error(j.erreur || 'Enregistrement impossible.');
  },
  async annuler() {
    const r = await fetch('/api/annuler', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.erreur || 'Impossible de revenir en arrière.');
    return j.contenu;
  },
  async video(fichier) {
    const r = await fetch('/api/video', { method: 'POST', headers: { 'Content-Type': fichier.type }, body: fichier });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.erreur || 'Envoi de la vidéo impossible.');
    return j.url;
  },
  async photo(blob) {
    const r = await fetch('/api/photo', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.erreur || 'Envoi de la photo impossible.');
    return j.url;
  },
  async commandes() {
    const r = await fetch('/api/commandes');
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.erreur || 'Commandes indisponibles.');
    return j.commandes;
  },
  async statut(id, statut) {
    const r = await fetch('/api/commandes/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ statut }) });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.erreur || 'Modification impossible.');
  },
};

/* Petite mémoire du navigateur. Si le navigateur la refuse (aperçu protégé, navigation privée),
   on garde tout en mémoire le temps de la visite : la démonstration fonctionne quand même. */
const memoire = {};
/* La mémoire du navigateur est-elle utilisable ? (non dans l'aperçu de l'app Claude) */
const stockageOk = (() => { try { localStorage.setItem('espace-test', '1'); localStorage.removeItem('espace-test'); return true; } catch (e) { return false; } })();
/* Démonstration : les images déjà dans le fichier ne sont pas recopiées dans la mémoire du navigateur (place limitée à quelques Mo) */
const imagesDemo = [], indexDemo = new Map();
if (DEMO) JSON.stringify(DEMO.contenu, (k, x) => { if (typeof x === 'string' && x.length > 2000 && x.startsWith('data:') && !indexDemo.has(x)) { indexDemo.set(x, imagesDemo.length); imagesDemo.push(x); } return x; });
const versTexte = (v) => JSON.stringify(v, (k, x) => (typeof x === 'string' && indexDemo.has(x) ? '@image-demo:' + indexDemo.get(x) : x));
const depuisTexte = (t) => JSON.parse(t, (k, x) => (typeof x === 'string' && x.startsWith('@image-demo:') ? imagesDemo[+x.slice(12)] || '' : x));
/* Chaque démonstration a sa propre mémoire : tous les fichiers ouverts depuis l'ordinateur partagent la même mémoire du navigateur,
   la clé dépend donc du site et de sa version (une nouvelle démonstration repart toujours de zéro). */
const empreinte = (t) => { let h = 5381; for (let i = 0; i < t.length; i += 7) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36) + t.length.toString(36); };
const PREFIXE = DEMO ? 'demo-' + empreinte(JSON.stringify(DEMO.contenu)) + '-' : 'espace-';
if (DEMO) { try { Object.keys(localStorage).filter((k) => k.startsWith('espace-demo-')).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* rien */ } }
function remettreAZero() {
  Object.keys(memoire).forEach((k) => { if (k.startsWith(PREFIXE)) delete memoire[k]; });
  try { Object.keys(localStorage).filter((k) => k.startsWith(PREFIXE)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* rien */ }
}
const memo = {
  persiste: true,
  lire(k, d) {
    const c = PREFIXE + k;
    if (c in memoire) return depuisTexte(memoire[c]);
    try { const v = localStorage.getItem(c); return v ? depuisTexte(v) : d; } catch (e) { return d; }
  },
  ecrire(k, v) {
    const c = PREFIXE + k, s = versTexte(v);
    let ok = true;
    try { localStorage.setItem(c, s); } catch (e) { ok = false; }
    if (ok || DEMO) memoire[c] = s;
    if (DEMO && k === 'contenu') memo.persiste = ok;
    return ok || !!DEMO;
  },
};
const demoApi = {
  async charger() { return memo.lire('connecte', false) ? { contenu: memo.lire('contenu', copie(DEMO.contenu)), maquette: true } : null; },
  async connexion() { memo.ecrire('connecte', true); },
  async deconnexion() { memo.ecrire('connecte', false); },
  async enregistrer(C) {
    const avant = memo.lire('contenu', copie(DEMO.contenu));
    if (!memo.ecrire('contenu', C)) throw new Error('Mémoire du téléphone pleine : retirez une photo.');
    /* « Revenir en arrière » de la démonstration : gardé pendant la visite, pour laisser la place au contenu */
    memoire[PREFIXE + 'precedent'] = versTexte(avant);
    try { localStorage.removeItem(PREFIXE + 'precedent'); } catch (e) { /* rien */ }
  },
  async annuler() { const p = memo.lire('precedent', null); if (!p) throw new Error('Aucune version précédente.'); memo.ecrire('contenu', p); return p; },
  async photo(blob) { return await new Promise((ok) => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(blob); }); },
  async video(fichier) { return await new Promise((ok) => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(fichier); }); },
  async commandes() {
    const V = voc(E.C || DEMO.contenu), o = (E.C || DEMO.contenu).offres || [], D = V.demande;
    const ex = (id, h, statut, nom, n, quand, txt) => {
      const lignes = [[cap(V.offres.singulier), (o[0] && o[0].nom) || cap(V.offres.singulier)]];
      if (D.quantite && n) lignes.push([D.quantite, String(n)]);
      lignes.push([D.date, quand], [D.precisions, txt], ['Nom', nom], ['Téléphone', '06 00 00 00 0' + id.slice(-1)]);
      return { id, recue: new Date(Date.now() - h * 3600e3).toISOString(), statut, nom, quantite: D.quantite ? n : null, lignes };
    };
    return memo.lire('commandes', [
      ex('ex1', 1, 'nouvelle', 'Exemple : Mme Martin', 8, 'samedi 19 décembre 2026, 10h30', D.exemple ? D.exemple.replace(/^Ex\. : /, '') : 'Rien de particulier'),
      ex('ex2', 26, 'confirmee', 'Exemple : M. Durand', 6, 'vendredi 18 décembre 2026, 18h', 'Rien de particulier'),
    ]);
  },
  async statut(id, statut) { const l = await demoApi.commandes(); l.forEach((c) => { if (c.id === id) c.statut = statut; }); memo.ecrire('commandes', l); },
};

async function reduire(fichier, maxCote, qualite) {
  const url = URL.createObjectURL(fichier);
  try {
    const im = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('Photo illisible : essayez une autre.')); i.src = url; });
    const r = Math.min(1, maxCote / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * r); cv.height = Math.round(im.naturalHeight * r);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', qualite));
  } finally { URL.revokeObjectURL(url); }
}

let PANNEAUX = [];

/* ---------- Démonstration en un seul fichier : le site d'abord, puis l'espace boutique ---------- */
function vueSiteDemo() {
  let v = document.getElementById('demo-site');
  if (!v) {
    v = el('div', { id: 'demo-site', class: 'apercu-plein' },
      el('div', { class: 'barre' }, el('b', { text: 'Le site' }),
        el('button', { type: 'button', class: 'btn petit', text: 'Essayer l’espace boutique', onclick: () => { v.hidden = true; document.body.style.overflow = ''; } })),
      el('iframe', { title: 'Le site' }));
    document.body.append(v);
  }
  /* le site tel qu'il est « en ligne » dans la démonstration : la dernière version enregistrée */
  v.querySelector('iframe').srcdoc = rendreSite(memo.lire('contenu', copie(DEMO.contenu)), { maquette: true, urlPolice: (f) => DEMO.polices[f] || '', css: DEMO.css, js: DEMO.js, lienMentions: '#', apiCommande: '' });
  v.hidden = false; document.body.style.overflow = 'hidden';
}
let siteMontre = false;

/* ---------- Aperçu en direct ---------- */
let cadres = [];
function rendreApercu() {
  const o = DEMO
    ? { maquette: true, urlPolice: (f) => DEMO.polices[f] || '', css: DEMO.css, js: DEMO.js, lienMentions: '#', apiCommande: '', calme: true }
    : { maquette: E.maquette, cssHref: '/assets/site.css', jsHref: '/assets/site.js', lienMentions: '#', apiCommande: '', calme: true };
  const page = rendreSite(E.C, o);
  cadres.forEach((f) => {
    let y = 0; try { y = f.contentWindow.scrollY; } catch (e) { /* rien */ }
    f.onload = () => { try { f.contentWindow.scrollTo(0, y); } catch (e) { /* rien */ } };
    f.srcdoc = page;
  });
}
let minuteur;
function changement() {
  majBarre(); majResumes();
  clearTimeout(minuteur); minuteur = setTimeout(rendreApercu, 450);
}
function majResumes() { PANNEAUX.forEach((p) => { const r = document.getElementById('res-' + p.id); if (r) r.textContent = p.resume(); }); }

/* ---------- Barre d'enregistrement ---------- */
let barre, etatBarre, bEnr, bAnn;
function majBarre() {
  const m = modifie();
  etatBarre.textContent = m ? 'Modifications non enregistrées' : 'Tout est enregistré';
  etatBarre.className = 'etat ' + (m ? 'modifie' : 'ok');
  bEnr.disabled = !m; bAnn.textContent = m ? 'Annuler' : 'Revenir en arrière'; bAnn.title = m ? 'Annuler les modifications non enregistrées' : 'Rétablir la version enregistrée juste avant';
}
async function enregistrer() {
  bEnr.disabled = true; bEnr.textContent = 'Enregistrement…';
  try {
    await api.enregistrer(E.C);
    E.base = JSON.stringify(E.C);
    toast(DEMO ? (memo.persiste ? 'Enregistré (démonstration : dans ce navigateur seulement).' : stockageOk ? 'Enregistré pour cette visite seulement : la mémoire du navigateur est pleine. Retirez des photos pour que ça reste.' : 'Enregistré pour cette visite seulement : cet aperçu ne garde rien après fermeture. Ouvrez le fichier dans un navigateur pour garder vos essais.') : 'Enregistré. Le site est à jour d’ici une minute.');
  } catch (x) {
    if (x.session) { toast('Session expirée : reconnectez-vous, vos modifications sont gardées.'); memo.ecrire('brouillon', E.C); ecranConnexion(x.message); return; }
    toast(x.message);
  }
  bEnr.textContent = 'Enregistrer'; majBarre();
}
async function annuler() {
  if (modifie()) { E.C = JSON.parse(E.base); dessinerEditeur(); rendreApercu(); toast('Modifications annulées.'); return; }
  if (!bAnn.classList.contains('confirmer')) { bAnn.classList.add('confirmer'); bAnn.textContent = 'Confirmer'; setTimeout(() => { bAnn.classList.remove('confirmer'); majBarre(); }, 4000); return; }
  bAnn.classList.remove('confirmer');
  try { E.C = await api.annuler(); E.base = JSON.stringify(E.C); dessinerEditeur(); rendreApercu(); toast('Version précédente rétablie.'); } catch (x) { toast(x.message); }
  majBarre();
}

/* ---------- Écran principal ---------- */
let editeur;
function dessinerEditeur() {
  editeur.replaceChildren(
    el('section', { class: 'intro-edit' },
      el('h1', { text: 'Bonjour' }),
      el('p', { class: 'aide', text: 'Touchez une rubrique pour la modifier, puis « Enregistrer » en bas de l’écran. L’aperçu montre le résultat avant d’enregistrer.' })),
    ...PANNEAUX.map((p) => {
      const d = el('details', { class: 'pan', id: 'pan-' + p.id, open: E.ouverts.has(p.id) },
        el('summary', {}, el('h2', { text: p.titre }), el('span', { class: 'resume', id: 'res-' + p.id, text: p.resume() }), el('span', { class: 'chev', 'aria-hidden': 'true' })));
      let rempli = false;
      const remplir = () => { if (rempli) return; rempli = true; d.append(el('div', { class: 'pan-corps' }, p.corps())); };
      if (d.open) remplir();
      d.addEventListener('toggle', () => { if (d.open) { remplir(); E.ouverts.add(p.id); } else E.ouverts.delete(p.id); });
      return d;
    }));
}

function ecranPrincipal() {
  racine.replaceChildren();
  const nom = E.C.boutique.nom || 'Votre boutique';
  document.title = nom + ' : espace boutique';
  PANNEAUX = panneaux();
  appliquerTheme(E.C);
  const plein = el('div', { class: 'apercu-plein', hidden: true },
    el('div', { class: 'barre' }, el('b', { text: 'Aperçu' }), el('button', { type: 'button', class: 'btn sec petit', text: 'Fermer l’aperçu', onclick: () => { plein.hidden = true; document.body.style.overflow = ''; } })),
    el('iframe', { title: 'Aperçu du site', sandbox: 'allow-scripts allow-same-origin allow-popups' }));
  editeur = el('div', { class: 'editeur' });
  const colonne = el('aside', { class: 'apercu-col', 'aria-label': 'Aperçu du site' },
    el('div', { class: 'tel-cadre' }, el('p', { text: 'Aperçu, tel que sur un téléphone' }), el('iframe', { title: 'Aperçu du site', sandbox: 'allow-scripts allow-same-origin allow-popups' })));
  cadres = [colonne.querySelector('iframe'), plein.querySelector('iframe')];

  etatBarre = el('span', { class: 'etat' });
  bEnr = el('button', { type: 'button', class: 'btn', text: 'Enregistrer', onclick: enregistrer });
  bAnn = el('button', { type: 'button', class: 'btn danger', onclick: annuler });
  barre = el('div', { class: 'barre-enr' }, el('div', { class: 'in' }, etatBarre,
    el('button', { type: 'button', class: 'btn sec btn-apercu', text: 'Aperçu', onclick: () => { plein.hidden = false; document.body.style.overflow = 'hidden'; rendreApercu(); } }),
    bAnn, bEnr));

  racine.append(
    el('header', { class: 'haut' }, el('div', { class: 'haut-in' },
      el('div', { class: 'haut-titre' }, el('b', { text: nom }), el('span', { text: 'Espace boutique' })),
      el('a', { class: 'btn', href: DEMO ? '#' : '/', target: DEMO ? null : '_blank', rel: 'noopener', text: 'Voir le site', onclick: DEMO ? (e) => { e.preventDefault(); plein.hidden = false; rendreApercu(); } : null }),
      el('button', { type: 'button', class: 'btn', text: 'Se déconnecter', onclick: async () => { if (modifie() && !confirm2()) return; await api.deconnexion(); ecranConnexion(); } }))),
    DEMO ? el('p', { class: 'bandeau', text: 'Démonstration : vos essais restent sur ce téléphone, rien n’est publié.' })
      : (E.maquette ? el('p', { class: 'bandeau', text: 'Le site est encore en mode proposition : les commandes ne sont pas envoyées.' }) : null),
    el('div', { class: 'cadre' }, editeur, colonne), barre, plein);
  dessinerEditeur(); majBarre(); rendreApercu();
  api.commandes().then((L) => { E.nouvelles = L.filter((c) => c.statut === 'nouvelle').length; majResumes(); }).catch(() => {});
}
let avertiDeco = false;
function confirm2() { if (avertiDeco) return true; avertiDeco = true; toast('Des modifications ne sont pas enregistrées. Touchez encore « Se déconnecter » pour les abandonner.'); return false; }

function normaliser(C) {
  C.boutique = C.boutique || {}; C.textes = C.textes || {}; C.commandes = C.commandes || {}; C.annonce = C.annonce || {};
  C.sections = Object.assign({ boutique: true, produits: true, offres: true, presse: true, questions: true }, C.sections || {});
  ['produits', 'offres', 'questions', 'presse'].forEach((k) => { if (!Array.isArray(C[k])) C[k] = []; });
  return C;
}
function appliquerTheme(C) {
  let st = document.getElementById('theme-boutique');
  if (!st) { st = el('style', { id: 'theme-boutique' }); document.head.append(st); }
  st.textContent = cssTheme(C, DEMO ? (f) => DEMO.polices[f] || '' : (f) => '/fonts/' + f);
  const meta = document.querySelector('meta[name=theme-color]'); if (meta && C.theme && C.theme.couleur) meta.setAttribute('content', C.theme.couleur);
  const icone = document.querySelector('link[rel=icon]'); if (icone && C.boutique && C.boutique.nom) icone.setAttribute('href', favicon(C));
}
async function demarrer() {
  try {
    const r = await api.charger();
    if (!r) { ecranConnexion(); return; }
    const brouillon = memo.lire('brouillon', null);
    E.C = normaliser(r.contenu); E.base = JSON.stringify(E.C); E.maquette = !!r.maquette;
    if (brouillon && !DEMO) { E.C = normaliser(brouillon); memo.ecrire('brouillon', null); toast('Vos modifications non enregistrées ont été récupérées.'); }
    ecranPrincipal();
  } catch (x) {
    racine.replaceChildren(el('main', { class: 'connexion' }, el('div', { class: 'erreur', text: 'Impossible de charger l’espace boutique : ' + x.message + ' Vérifiez la connexion internet et rechargez la page.' })));
  } finally {
    /* démonstration : on montre d'abord le site, une seule fois */
    if (DEMO && DEMO.siteDabord && !siteMontre) { siteMontre = true; vueSiteDemo(); }
  }
}

window.addEventListener('beforeunload', (e) => { if (E.C && modifie()) { e.preventDefault(); e.returnValue = ''; } });
demarrer();
