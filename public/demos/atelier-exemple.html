<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6b4a2e">
<title>Atelier du Merrain : démonstration</title>
<style>
/* Espace boutique : mêmes couleurs et polices que le site (bleu de la devanture, blanc, Vollkorn + Source Sans 3). */
:root{
  --bleu:#46667f;--bleu-fonce:#2f4b61;--bleu-pale:#edf2f5;
  --encre:#1f2328;--gris:#5a6470;--trait:#d7dee4;--fond:#f6f8f9;--blanc:#fff;
  --paille:#efd58b;--ok:#2f6b45;--ok-pale:#e3f1e7;--alerte:#8a2c22;--alerte-pale:#fbecea;
  --titres:"Vollkorn",Georgia,serif;--texte:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --r:6px;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:400 1.0625rem/1.5 var(--texte)}
h1,h2,h3{font-family:var(--titres);font-weight:600;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--bleu-fonce)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:2px solid var(--bleu);background:var(--bleu);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}
.btn.sec{background:#fff;color:var(--bleu-fonce)}
.btn.sec:hover{background:var(--bleu-pale)}
.btn.discret{background:transparent;border-color:transparent;color:var(--bleu-fonce);padding:0 10px}
.btn.discret:hover{background:var(--bleu-pale)}
.btn.danger{background:#fff;border-color:#e2b8b2;color:var(--alerte)}
.btn.danger.confirmer{background:var(--alerte);border-color:var(--alerte);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.petit{min-height:36px;padding:0 12px;font-size:.9375rem}

/* Connexion */
.connexion{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.connexion form{width:100%;max-width:380px;background:#fff;border:1px solid var(--trait);border-radius:10px;padding:28px 24px;display:grid;gap:16px}
.connexion h1{font-size:1.625rem}
.connexion .sous{color:var(--gris);margin-top:-8px}
.mdp{display:flex;border:1px solid #b6c1ca;border-radius:var(--r);overflow:hidden;background:#fff}
.mdp input{flex:1;border:0;padding:12px;min-width:0}
.mdp input:focus{outline:none}
.mdp:focus-within{outline:2px solid var(--bleu);outline-offset:1px}
.mdp button{border:0;background:var(--bleu-pale);padding:0 12px;cursor:pointer;color:var(--bleu-fonce);font-weight:600;font-size:.9375rem}
.erreur{background:var(--alerte-pale);color:var(--alerte);border-radius:var(--r);padding:10px 12px}
.aide{color:var(--gris);font-size:.9375rem}

/* Barre du haut */
.haut{position:sticky;top:0;z-index:30;background:var(--bleu);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.haut-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.haut-titre{margin-right:auto;min-width:0}
.haut-titre b{display:block;font:600 1.25rem/1.15 var(--titres)}
.haut-titre span{font-size:.875rem;opacity:.85}
.haut .btn{border-color:rgba(255,255,255,.7);background:transparent;color:#fff;min-height:38px;padding:0 12px;font-size:.9375rem}
.haut .btn:hover{background:rgba(255,255,255,.14)}
.bandeau{background:var(--paille);color:var(--encre);text-align:center;font-size:.9375rem;padding:8px 16px}

/* Mise en page : éditeur + aperçu */
.cadre{max-width:1320px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:24px}
.editeur{display:grid;gap:12px;min-width:0;align-content:start}
.apercu-col{display:none}
@media (min-width:1080px){
  .cadre{grid-template-columns:minmax(0,1fr) 420px}
  .apercu-col{display:block;position:sticky;top:84px;height:calc(100svh - 104px)}
  .btn-apercu{display:none}
}
.apercu-col .tel-cadre{height:100%;border:1px solid var(--trait);border-radius:18px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.apercu-col .tel-cadre p{font-size:.8125rem;color:var(--gris);padding:8px 12px;border-bottom:1px solid var(--trait);background:var(--fond)}
.apercu-col iframe,.apercu-plein iframe{flex:1;width:100%;border:0;background:#fff}
.apercu-plein{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.apercu-plein .barre{display:flex;justify-content:space-between;align-items:center;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--trait)}

.intro-edit{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.intro-edit h1{font-size:1.5rem}

/* Panneaux */
details.pan{background:#fff;border:1px solid var(--trait);border-radius:10px}
details.pan>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:16px 18px}
details.pan>summary::-webkit-details-marker,details.item>summary::-webkit-details-marker{display:none}
details.pan>summary h2{font-size:1.3125rem}
details.pan>summary .resume{grid-column:1;color:var(--gris);font-size:.9375rem;min-width:0;overflow-wrap:anywhere}
details.pan>summary .chev{grid-row:1/span 2;grid-column:2}
.chev{width:30px;height:30px;border:1px solid var(--trait);border-radius:var(--r);display:grid;place-items:center}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.pan-corps{padding:0 18px 20px;display:grid;gap:16px;min-width:0}
.pastille{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8125rem;font-weight:600;background:var(--paille);color:var(--encre);margin-left:6px;vertical-align:2px}

/* Champs */
.champ{display:grid;gap:6px;min-width:0}
.champ>label,.champ>.lab{font-weight:600}
.champ .ex{font-weight:400;color:var(--gris);font-size:.9375rem}
.saisie{width:100%;min-height:46px;padding:10px 12px;border:1px solid #b6c1ca;border-radius:var(--r);background:#fff}
.saisie:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}
textarea.saisie{min-height:90px;resize:vertical;line-height:1.45}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;user-select:none}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .rail{width:46px;height:28px;border-radius:999px;background:#c5ced5;position:relative;transition:background .15s;flex:none}
.interrupteur .rail::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.interrupteur input:checked+.rail{background:var(--ok)}
.interrupteur input:checked+.rail::after{transform:translateX(18px)}
.interrupteur input:focus-visible+.rail{outline:2px solid var(--bleu);outline-offset:2px}

/* Photo */
.photo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.photo .vignette{width:96px;height:72px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;border:1px solid var(--trait)}
.photo .actions{display:flex;flex-wrap:wrap;gap:8px}
.photo input[type=file]{position:absolute;opacity:0;width:1px;height:1px}

/* Listes (fromages, plateaux…) */
.liste{display:grid;gap:8px}
details.item{border:1px solid var(--trait);border-radius:8px;background:#fff}
details.item[open]{border-color:var(--bleu)}
details.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px}
details.item>summary .mini{width:44px;height:44px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;flex:none}
details.item>summary .txt{flex:1;min-width:0}
details.item>summary::after{content:"";flex:none;width:8px;height:8px;margin-right:4px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.item[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.item>summary b{display:block;font:500 1.125rem/1.25 var(--titres);overflow-wrap:anywhere}
details.item>summary span.s{display:block;color:var(--gris);font-size:.9375rem;overflow-wrap:anywhere}
.item-corps{padding:4px 12px 14px;display:grid;gap:14px;border-top:1px solid var(--trait);padding-top:14px}
.item-outils{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.item-outils .ordre{display:flex;gap:6px}
.ajouter{justify-self:start}

/* Horaires */
.jours{display:grid;gap:0;border-top:1px solid var(--trait)}
.jour{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--trait)}
.jour .nomj{font-weight:600;padding-top:8px;text-transform:capitalize}
.plages{display:grid;gap:8px}
.plage{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.plage input{width:auto;min-width:118px;min-height:44px}
.plage span{color:var(--gris)}
.ferme{color:var(--gris);padding-top:8px}
@media (max-width:520px){.jour{grid-template-columns:minmax(0,1fr)}.jour .nomj{padding-top:0}}

/* Commandes reçues */
.cmds{display:grid;gap:10px}
.cmd{border:1px solid var(--trait);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.cmd.nouvelle{border-color:#d9b24a;background:#fffbef}
.cmd-tete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.cmd-tete b{font:600 1.125rem/1.25 var(--titres)}
.cmd dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.cmd dt{color:var(--gris)}
.cmd dd{margin:0;overflow-wrap:anywhere}
.statuts{display:flex;flex-wrap:wrap;gap:6px}
.statuts button{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:5px 12px;font-size:.875rem;cursor:pointer}
.statuts button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}
.etiquette{font-size:.8125rem;font-weight:600;border-radius:999px;padding:2px 10px}
.etiquette.nouvelle{background:var(--paille)}
.etiquette.confirmee{background:var(--bleu-pale);color:var(--bleu-fonce)}
.etiquette.retiree{background:var(--ok-pale);color:var(--ok)}
.etiquette.annulee{background:#eceef0;color:var(--gris)}
.vide{padding:16px;border:1px dashed var(--trait);border-radius:8px;color:var(--gris);text-align:center}

/* Barre d'enregistrement */
.barre-enr{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--trait);box-shadow:0 -4px 16px rgba(31,35,40,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barre-enr .in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.barre-enr .etat{margin-right:auto;font-weight:600}
.barre-enr .etat.modifie{color:#7a5a00}
.barre-enr .etat.ok{color:var(--ok)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--encre);color:#fff;border-radius:8px;padding:10px 16px;font-size:.9375rem;max-width:calc(100vw - 32px)}
@media (max-width:600px){.barre-enr .etat{flex-basis:100%;font-size:.875rem}.barre-enr .in .btn{flex:1 1 0;padding:4px 6px;min-width:0;white-space:normal;line-height:1.15;font-size:.9375rem;text-align:center}.haut-in .btn{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Vidéo de fond */
.video-champ{display:grid;gap:12px}
.video-apercu video{width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000;display:block}
.video-champ .saisie{margin-top:8px}

</style>
</head>

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}\nbody{margin:0;background:var(--fond);color:var(--encre);font:400 1.0625rem/1.65 var(--texte)}\nimg{display:block;max-width:100%}\na{color:var(--bleu-fonce)}\nh1,h2,h3{margin:0;font-family:var(--titres);font-weight:600;line-height:1.15;color:var(--encre)}\nh1,h2{font-weight:500;letter-spacing:-.005em}\np{margin:0}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}\n.skip{position:absolute;left:-9999px;top:0}\n.skip:focus{left:12px;top:12px;z-index:100;background:#fff;color:var(--encre);padding:10px 14px}\n:focus-visible{outline:2px solid var(--bleu);outline-offset:3px}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:2px solid var(--bleu);border-radius:var(--r);background:var(--bleu);color:#fff;font:600 1.0625rem/1 var(--texte);text-decoration:none;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap}\n.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}\n.btn-contour{background:transparent;color:var(--bleu-fonce)}\n.btn-contour:hover{background:var(--bleu-pale);color:var(--bleu-fonce)}\n.btn-blanc{background:#fff;border-color:#fff;color:var(--bleu-fonce)}\n.btn-blanc:hover{background:var(--bleu-pale);border-color:var(--bleu-pale)}\n.btn-clair{background:transparent;border-color:rgba(255,255,255,.85);color:#fff}\n.btn-clair:hover{background:rgba(255,255,255,.14);border-color:#fff}\n\n.maquette{background:#eef0f2;color:#444c55;font-size:.8125rem;line-height:1.4;padding:8px var(--gut);text-align:center}\n.annonce{background:var(--paille);color:var(--encre);text-align:center;padding:11px var(--gut);font-weight:600;font-size:1rem}\n\n/* En-tête posé sur la photo d'accueil */\n.top{position:absolute;top:0;left:0;right:0;z-index:3;color:#fff}\n.top .wrap{display:flex;align-items:center;gap:28px;min-height:84px}\n.nom{font:600 1.375rem/1.1 var(--titres);color:#fff;text-decoration:none;margin-right:auto;padding:12px 0}\n.nav{display:flex;gap:26px}\n.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:1rem;padding:6px 0;border-bottom:2px solid transparent}\n.nav a:hover{border-bottom-color:rgba(255,255,255,.7)}\n.top .tel{color:#fff;font-weight:600;text-decoration:none;border:2px solid rgba(255,255,255,.75);border-radius:var(--r);padding:9px 14px;white-space:nowrap}\n.top .tel:hover{background:rgba(255,255,255,.12)}\n.menu-btn{display:none;background:transparent;border:2px solid rgba(255,255,255,.75);border-radius:var(--r);color:#fff;font:600 1rem/1 var(--texte);padding:10px 14px;cursor:pointer}\n\n/* Accueil */\n.hero{position:relative;z-index:2;isolation:isolate;min-height:min(86svh,860px);display:flex;align-items:flex-end;color:#fff;background:var(--bleu-fonce)}\n.hero:not(:has(>img,>video)){min-height:0}\n.hero>img,.hero>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}\n.hero::after{content:\"\";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,26,32,.55) 0%,rgba(20,26,32,0) 26%,rgba(20,26,32,0) 42%,rgba(20,26,32,.76) 100%)}\n.hero-body{width:100%;padding-top:140px;padding-bottom:clamp(36px,6vw,72px)}\n.hero h1{color:#fff;font-size:clamp(2rem,4.2vw,3.25rem);max-width:18ch;line-height:1.1}\n.hero-body>p{max-width:52ch;margin:16px 0 0;font-size:1.0625rem;color:rgba(255,255,255,.93)}\n.hero .statut{margin-top:16px;font-weight:600}\n.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}\n[data-statut][hidden]{display:none}\n\n/* Sections */\n.sec{padding:clamp(64px,9vw,112px) 0}\n.alt{background:var(--bleu-pale)}\n.sec h2{font-size:clamp(1.625rem,2.7vw,2.125rem)}\n.sec .intro{max-width:56ch;margin-top:14px;color:var(--gris)}\n\n.about{display:grid;gap:40px}\n.about .ph-main{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);background:var(--bleu-pale)}\n.about .txt h2{margin-bottom:22px}\n.about .txt p{max-width:50ch;margin-bottom:1em}\n.about .ph-small{width:6 -weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}\n.carte .m{grid-column:1/-1;color:var(--gris);font-size:1rem}\n.carte li.avec-photo .m{grid-column:2/-1}\n\n.plateaux{position:relative;isolation:isolate;color:#fff;background:var(--bleu-fonce)}\n.plateaux>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}\n.plateaux::after{content:\"\";position:absolute;inset:0;z-index:-1;background:rgba(24,32,40,.66)}\n.hero:not(:has(>img,>video))::after,.plateaux:not(:has(>img))::after{display:none}\n.plateaux h2{color:#fff}\n.plateaux .grid{display:grid;gap:40px}\n.plateaux .intro{color:rgba(255,255,255,.9)}\n.pl{list-style:none;margin:0;padding:0}\n.pl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.3)}\n.pl li:first-child{border-top:1px solid rgba(255,255,255,.3)}\n.pl b{font:500 1.25rem/1.3 var(--titres)}\n.pl .p{font-weight:600;white-space:nowrap}\n.pl span:last-child{grid-column:1/-1;color:rgba(255,255,255,.86)}\n\n.presse-grid{display:grid;gap:40px}\n.avis{margin-top:16px;color:var(--gris)}\n.avis strong{color:var(--encre)}\n.articles{list-style:none;margin:0;padding:0}\n.articles li{border-bottom:1px solid var(--trait)}\n.articles li:first-child{border-top:1px solid var(--trait)}\n.articles a{display:block;padding:16px 0;text-decoration:none;color:var(--encre)}\n.articles .t{display:block;font:500 1.1875rem/1.3 var(--titres)}\n.articles .d{display:block;margin-top:2px;color:var(--gris);font-size:1rem}\n.articles a:hover .t{color:var(--bleu-fonce);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}\n\n.visit{display:grid;gap:48px}\n.hours{margin:28px 0 0}\n.hours div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--trait)}\n.hours div:first-child{border-top:1px solid var(--trait)}\n.hours dt{text-transform:capitalize}\n.hours dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}\n.hours .today{font-weight:600}\n.hours .today dt::after{content:\" (aujourd'hui)\";font-weight:400;color:var(--gris);text-transform:none}\n.hnote{margin-top:14px;color:var(--gris)}\n.visit .statut{margin-top:14px;font-weight:600;color:var(--bleu-fonce)}\n.infos{display:grid;gap:22px;align-content:start}\n.infos h3{font:600 1rem/1.3 var(--texte);color:var(--gris);margin-bottom:4px}\n.infos .gros{font:500 1.3125rem/1.3 var(--titres);color:var(--encre)}\n.infos a.gros{text-decoration:none}\n.infos .actions{margin-top:4px}\n.carte-box{position:relative;margin-top:56px;min-width:0;height:clamp(300px,36vw,440px);background:#fff;border:1px solid var(--trait);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}\n.carte-box p{color:var(--gris);font-size:.9375rem;margin-top:12px;max-width:44ch}\n.carte-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}\n\n/* Pied de page */\n.foot{background:var(--bleu-fonce);color:#dfe7ed;padding:64px 0 calc(36px + env(safe-area-inset-bottom,0px));font-size:1rem}\n.foot .nom{display:inline-block;padding:0}\n.foot-grid{display:grid;gap:32px;margin-top:36px}\n.foot h3{font:600 1rem/1.3 var(--texte);color:#fff;margin-bottom:8px}\n.foot ul{list-style:none;margin:0;padding:0}\n.foot li{margin-bottom:3px}\n.foot a{color:#fff}\n.legal{margin-top:52px;padding-top:20px;border-top:1px solid rgba(255,255,255,.18);display:flex;flex-wrap:wrap;gap:6px 24px;font-size:.875rem;color:#b9c6d0}\n.legal a{color:#dfe7ed}\n\n/* Menu mobile */\n.sheet{position:fixed;inset:0;z-index:60;background:var(--bleu);color:#fff;display:flex;flex-direction:column;padding:8px var(--gut) calc(24px + env(safe-area-inset-bottom,0px))}\n.sheet[hidden]{display:none}\n.sheet-top{display:flex;justify-content:space-between;align-items:center;min-height:64px}\n.sheet nav{display:flex;flex-direction:column;margin:auto 0}\n.sheet nav a{color:#fff;font:500 1.4375rem/1.2 var(--titres);text-decoration:none;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.22)}\n.sheet .actions .btn{flex:1}\n.bar{display:none}\nhtml.menu-ouvert{overflow:hidden}\n\n@media (min-width:900px){\n  .about{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center}\n  .ctr{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:72px;align-items:start}\n  .ctr .ph{position:sticky;top:28px;margin-top:6px}\n  .about.sans-photo,.ctr.sans-photo{grid-template-columns:minmax(0,1fr)}\n  .plateaux .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:end}\n  .presse-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px}\n  .visit{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px}\n  .foot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}\n}\n@media (max-width:960px){\n  .nav,.top .tel{display:none}\n  .menu-btn{display:inline-flex}\n}\n@media (max-width:720px){\n  body{font-size:1rem;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}\n  .top .wrap{min-height:72px}\n  .nom{font-size:1.25rem}\n  .hero{min-height:min(84svh,760px)}\n  .hero-body{padding-top:120px}\n  .hero .actions .btn{flex:1 1 140px}\n  .about .ph-small{width:72%}\n  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--trait);transition:transform .25s ease}\n  html.js .bar:not(.on){transform:translateY(110%)}\n}\n/* Commande de plateaux */\n.cmd{display:grid;gap:36px}\n.cmd-etapes{margin:22px 0 0;padding-left:1.3em;display:grid;gap:8px;max-width:44ch}\n.cmd-etapes li::marker{font-family:var(--titres);font-weight:600;color:var(--bleu)}\n.cmd-intro .hnote{max-width:44ch}\n.hnote a{white-space:nowrap}\n.cmd-form,.cmd-ok{background:#fff;border:1px solid var(--trait);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:grid;gap:18px}\n.cmd-form[hidden],.cmd-ok[hidden]{display:none}\n.cmd-f /* Horaires : { lundi: [["09:00","13:00"], …], … } -> minutes par jour (0 = dimanche) */

    voc: { offre: cap(V.offres.singulier), quantite: D.quantite, unite: D.unite, date: D.date, precisions: D.precisions, devis: D.type === 'devis' },
  } : null;
  const donneesJs = `var H=${JSON.stringify(H)},INCONNUS=[],CMD=${JSON.stringify(CMD).replace(/</g, '\\u003c')};`;
  const scripts = o.js != null ? `<script>\n${donneesJs}\n${o.js}\n<\/script>` : `<script>${donneesJs}<\/script>\n<script src="${o.jsHref || '/assets/site.js'}" defer><\/script>`;

  const bandeauMaquette = o.maquette
    ? `<div class="maquette" role="note">Site d’exemple : atelier imaginaire, créé par Grégoire Muel pour montrer l’espace de modification. Rien n’est publié, vos essais restent dans ce navigateur.</div>` : '';
  const annonce = C.annonce && C.annonce.afficher && C.annonce.texte ? `<div class="annonce" role="status">${esc(C.annonce.texte)}</div>` : '';

  const ST = styleSite(C);
  const navDe = { boutique: avecBoutique ? ['#boutique', V.navBoutique] : null, produits: produits.length ? ['#produits', V.produits.nav] : null, offres: offres.length ? ['#offres', V.offres.nav] : null };
  const liensNav = [
    ...ST.ordre.flatMap((k) => (k === 'offres' ? [navDe.offres, formulaire ? ['#demande', D.nav] : null] : [navDe[k] || null])),
    ['#horaires', 'Horaires et accès'],
  ].filter(Boolean).map(([h, t]) => `<a href="${h}">${esc(t)}</a>`).join('');

  const ligneProduit = (f) => {
    const meta = [f.origine, f.detail].filter(Boolean).map(esc).join('. ');
    const photo = f.photo ? img(f.photo, 240, 'vignette') : '';
    return `<li${photo ? ' class="avec-photo"' : ''}>${photo}<span class="n">${esc(f.nom)}</span><span class="p">${esc(f.prix || '')}</span>${meta ? `<span class="m">${meta}</span>` : ''}</li>`;
  };
  const listeProduits = () => {
    const P = V.produits;
    if (!P.famille || !P.familles.length) return `<ul class="carte">\n          ${produits.map(ligneProduit).join('\n          ')}\n        </ul>`;
    const g = new Map(), titres = new Map(P.familles.map((f) => [f[0], f[1] || f[0]]));
    produits.forEach((f) => { const k = titres.has(f.famille) ? f.famille : '__autres'; if (!g.has(k)) g.set(k, []); g.get(k).push(f); });
    return [...P.familles.map((f) => f[0]), '__autres'].filter((k) => g.has(k)).map((k, i) => {
      const n = g.get(k).length;
      return `<details class="famille"${i === 0 ? ' open' : ''}>
          <summary><span>${esc(k === '__autres' ? P.autres : titres.get(k))}<small>${n} ${n > 1 ? esc(P.pluriel) : esc(P.singulier)}</small></span></summary>
          <ul class="carte">
            ${g.get(k).map(ligneProduit).join('\n            ')}
          </ul>
        </details>`;
    }).join('\n        ');
  };
  const prixOffre = (p) => {
    const pu = prixNombre(p.prix_unite);
    return p.prix ? esc(p.prix) : pu && D.parUnite ? (pu % 1 ? pu.toFixed(2) : String(pu)).replace('.', ',') + ' € ' + esc(D.parUnite) : '';
  };
  const ligneOffre = (p) => `<li><b>${esc(p.nom)}</b><span class="p">${prixOffre(p)}</span>${p.description ? `<span>${esc(p.description)}</span>` : ''}</li>`;
  const ligneArticle = (a) => {
    const sous = [a.source, a.date ? String(a.date).charAt(0).toLowerCase() + String(a.date).slice(1) : ''].filter(Boolean).join(', ');
    return `<li><a href="${esc(a.lien)}" target="_blank" rel="noopener"><span class="t">${esc(a.titre)}</span>${sous ? `<span class="d">${esc(sous)}</span>` : ''}</a></li>`;
  };
  const articles = () => {
    const visibles = presse.slice(0, 2), autres = presse.slice(2);
    let h = `<ul class="articles">\n        ${visibles.map(ligneArticle).join('\n        ')}\n      </ul>`;
    if (autres.length) h += `\n      <details class="plus"><summary>Articles plus anciens (${autres.length})</summary><ul class="articles">${autres.map(ligneArticle).join('')}</ul></details>`;
    return h;
  };
  const ligneQuestion = (q) => `<details><summary>${esc(q.question)}</summary><div class="rep">${paras(q.reponse)}</div></details>`;
  const ligneHoraire = (d) => `<div data-jour="${d}"><dt>${JOURS[d]}</dt><dd>${esc(TXT[d])}</dd></div>`;
  const avis = A.note ? `<p class="avis">Note Google : <strong>${esc(A.note)} sur 5</strong>, ${esc(A.nombre)} avis${A.date ? ' (relevé le ' + esc(A.date) + ')' : ''}.${A.lien ? ` <a href="${esc(A.lien)}" target="_blank" rel="noopener">Lire les avis</a>` : ''}</p>` : '';

  const sectionDemande = () => {
    const min = Math.max(1, +K.quantite_min || 1), max = Math.max(min, +K.quantite_max || 40);
    const parDefaut = Math.min(Math.max(6, min), max), delai = Math.round(+K.delai_heures || 0);
    const devis = D.type === 'devis';
    const choix = offres.map((p, i) => {
      const prix = prixOffre(p) || (devis ? 'Prix sur devis' : 'Prix selon la composition');
      return `<label class="choix"><input type="radio" name="offre" value="${i}"${i === 0 ? ' checked' : ''}><span class="choix-txt"><b>${esc(p.nom)}</b>${p.description ? `<span>${esc(p.description)}</span>` : ''}<em>${prix}</em></span></label>`;
    }).join('\n            ');
    const quantite = D.quantite ? `
          <div class="cmd-ligne">
            <div class="champ-bloc">
              <label for="cmd-pers">${esc(D.quantite)}</label>
              <div class="stepper"><button type="button" data-pas="-1" aria-label="Un de moins">−</button><input id="cmd-pers" name="quantite" type="number" inputmode="numeric" min="${min}" max="${max}" value="${parDefaut}"><button type="button" data-pas="1" aria-label="Un de plus">+</button></div>
            </div>
            <p class="estimation" id="cmd-estim" aria-live="polite" hidden></p>
          </div>` : '';
    const quand = devis
      ? `<div class="champ-bloc"><label for="cmd-date">${esc(D.date)} <span class="fac">(facultatif)</span></label><input class="saisie" id="cmd-date" name="date" type="date"></div>`
      : `<div class="cmd-ligne">
            <div class="champ-bloc"><label for="cmd-date">${esc(D.date)}</label><input class="saisie" id="cmd-date" name="date" type="date" required></div>
            <div class="champ-bloc"><label for="cmd-heure">Heure</label><select class="saisie" id="cmd-heure" name="heure" required></select></div>
          </div>
          <p class="cmd-info" id="cmd-jour" aria-live="polite"></p>`;
    return `
  <section class="sec${fond('demande')}" id="demande">
    <div class="wrap cmd">
      <div class="cmd-intro">
        <h2>${esc(K.titre || V.offres.bouton)}</h2>
        ${K.intro ? `<p class="intro">${esc(K.intro)}</p>` : ''}
        <ol class="cmd-etapes">
          <li>${devis ? `Choisissez le type de ${esc(V.offres.singulier)} et décrivez votre demande.` : `Choisissez ${V.offres.e ? 'une' : 'un'} ${esc(V.offres.singulier)}${D.quantite ? ' et indiquez : ' + esc(D.quantite.toLowerCase()) : ''}.`}</li>
          <li>${devis ? 'Indiquez la date qui vous arrange.' : `Indiquez le jour et l'heure du retrait${delai ? `, au moins ${delai}\u00a0h à l'avance` : ''}.`}</li>
          <li>La boutique vous rappelle pour confirmer.</li>
        </ol>
        ${K.paiement ? `<p class="hnote">${esc(K.paiement)}</p>` : ''}
        <p class="hnote">Pour une demande urgente, appelez le <a href="${tel}">${esc(B.telephone)}</a>.</p>
      </div>
      <div class="cmd-zone">
        <form class="cmd-form" id="cmd-form" novalidate>
          <fieldset>
            <legend>${esc(cap(V.offres.singulier))}</legend>
            <div class="choix-liste">
            ${choix}
            </div>
          </fieldset>${quantite}
          ${quand}
          <div class="champ-bloc"><label for="cmd-msg">${esc(D.precisions)}${devis ? '' : ' <span class="fac">(facultatif)</span>'}</label><textarea class="saisie" id="cmd-msg" name="message" rows="${devis ? 5 : 3}"${D.exemple ? ` placeholder="${esc(D.exemple)}"` : ''}${devis ? ' required' : ''}></textarea></div>
          <div class="cmd-ligne">
            <div class="champ-bloc"><label for="cmd-nom">Nom</label><input class="saisie" id="cmd-nom" name="nom" type="text" autocomplete="name" required></div>
            <div class="champ-bloc"><label for="cmd-tel">Téléphone</label><input class="saisie" id="cmd-tel" name="telephone" type="tel" autocomplete="tel" inputmode="tel" required></div>
          </div>
          <div class="champ-bloc"><label for="cmd-mail">E-mail <span class="fac">(facultatif)</span></label><input class="saisie" id="cmd-mail" name="email" type="email" autocomplete="email"></div>
          <input type="checkbox" name="botcheck" class="piege" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="cmd-erreur" id="cmd-erreur" role="alert" hidden></p>
          <button class="btn cmd-envoyer" type="button">Envoyer la demande</button>
          <p class="cmd-rgpd">Vos coordonnées servent uniquement à traiter cette demande.</p>
        </form>
        <div class="cmd-ok" id="cmd-ok" tabindex="-1" hidden></div>
      </div>
    </div>
  </section>`;
  };

  const offresPhoto = ST.offres === 'photo';
  const bOffre = offresPhoto ? ['btn btn-blanc', 'btn btn-clair'] : ['btn', 'btn btn-contour'];
  const boutonsOffres = () => {
    if (demandeActive && D.type === 'lien') return `<a class="${bOffre[0]}" href="${esc(D.lien)}" target="_blank" rel="noopener">${esc(D.lienTexte)}</a><a class="${bOffre[1]}" href="${tel}">Appeler</a>`;
    if (formulaire) return `<a class="${bOffre[0]}" href="#demande">${esc(V.offres.bouton)}</a><a class="${bOffre[1]}" href="${tel}">Appeler</a>`;
    return `<a class="${bOffre[0]}" href="${tel}">Appeler la boutique</a>`;
  };

  /* Parties affichées, dans l'ordre choisi ; la demande suit toujours les offres, les horaires ferment la page */
  const avecPresse = !!(presse.length || (avis && affiche(C, 'presse')));
  const visibles = { boutique: !!avecBoutique, produits: produits.length > 0, offres: offres.length > 0, presse: avecPresse, questions: questions.length > 0 };
  const suite = [];
  ST.ordre.forEach((k) => { if (visibles[k]) { suite.push(k); if (k === 'offres' && formulaire) suite.push('demande'); } });
  suite.push('horaires');
  /* Fonds alternés (blanc, pâle) ; une partie à photo de fond compte comme une partie */
  const pales = new Set();
  suite.forEach((k, i) => { if (i % 2 && !(k === 'offres' && offresPhoto)) pales.add(k); });
  const fond = (id) => (pales.has(id) ? ' alt' : '');

  const accueil = () => {
    const sobre = ST.accueil === 'sobre';
    const haut = `<div class="top"><div class="wrap">
    <a class="nom" href="#contenu">${esc(nom)}</a>
    <nav class="nav" aria-label="Menu principal">${liensNav}</nav>
    <a class="tel" href="${tel}">${esc(B.telephone)}</a>
    <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </div></div>`;
    const texte = (cls) => `<div class="${cls}">
    <h1>${esc(T.titre || nom)}</h1>
    ${T.intro ? `<p>${esc(T.intro)}</p>` : ''}
    <p class="statut" data-statut hidden><span></span></p>
    <div class="actions">
      <a class="${sobre ? 'btn' : 'btn btn-blanc'}" href="${tel}">Appeler la boutique</a>
      <a class="${sobre ? 'btn btn-contour' : 'btn btn-clair'}" href="${itineraire}" target="_blank" rel="noopener">Itinéraire</a>
    </div>
  </div>`;
    if (ST.accueil === 'partage') {
      const vid = T.fond_video !== false ? videoSrc(T.video_accueil) : '';
      const photo = vid ? `<div class="hero-photo">${videoFond(vid, src(T.photo_accueil, 1400), 'ph-accueil')}</div>` : (src(T.photo_accueil, 10) ? `<div class="hero-photo">${img(T.photo_accueil, 1400, 'ph-accueil', true)}</div>` : '');
      return `<header class="hero hero-partage">
  ${haut}
  <div class="wrap hero-grille${photo ? '' : ' sans-photo'}">
  ${texte('hero-body')}
  ${photo}
  </div>
</header>`;
    }
    if (sobre) return `<header class="hero hero-sobre">
  ${haut}
  ${texte('wrap hero-body')}
</header>`;
    const vidFond = T.fond_video !== false ? videoSrc(T.video_accueil) : '';
    return `<header class="hero">
  ${vidFond ? videoFond(vidFond, src(T.photo_accueil, 2200), 'fond') : img(T.photo_accueil, 2200, 'fond', true)}
  ${haut}
  ${texte('wrap hero-body')}
</header>`;
  };

  const parties = {
    boutique: () => `
  <section class="sec${fond('boutique')}" id="boutique">
    <div class="wrap about${src(T.boutique_photo_1, 10) ? '' : ' sans-photo'}">
      ${src(T.boutique_photo_1, 10) ? `<div>${img(T.boutique_photo_1, 1400, 'ph-main')}</div>` : ''}
      <div class="txt">
        <h2>${esc(T.boutique_titre || V.navBoutique)}</h2>
        ${paras(T.boutique_texte)}
        ${img(T.boutique_photo_2, 1000, 'ph-small')}
      </div>
    </div>
  </section>`,
    produits: () => `
  <section class="sec${fond('produits')}" id="produits">
    <div class="wrap ctr${src(T.produits_photo, 10) ? '' : ' sans-photo'}">
      <div>
        <h2>${esc(T.produits_titre || V.produits.rubrique)}</h2>
        ${T.produits_intro ? `<p class="intro">${esc(T.produits_intro)}</p>` : ''}
        ${listeProduits()}
      </div>
      ${img(T.produits_photo, 1000, 'ph')}
    </div>
  </section>`,
    offres: () => `
  <section class="sec ${offresPhoto ? 'plateaux' : 'offres-clair' + fond('offres')}" id="offres">
    ${offresPhoto ? img(T.offres_photo, 2000, 'fond') : ''}
    <div class="wrap grid">
      <div>
        <h2>${esc(T.offres_titre || V.offres.rubrique)}</h2>
        ${T.offres_texte ? `<p class="intro">${esc(T.offres_texte)}</p>` : ''}
        <div class="actions">${boutonsOffres()}</div>
        ${offresPhoto ? '' : img(T.offres_photo, 1200, 'ph-offre')}
      </div>
      <ul class="pl">
        ${offres.map(ligneOffre).join('\n        ')}
      </ul>
    </div>
  </section>`,
    presse: () => `
  <section class="sec${fond('presse')}" id="presse">
    <div class="wrap presse-grid">
      <div>
        <h2>Ils en parlent</h2>
        ${avis}
      </div>
      <div>
      ${presse.length ? articles() : ''}
      </div>
    </div>
  </section>`,
    questions: () => `
  <section class="sec${fond('questions')}" id="questions">
    <div class="wrap">
      <h2>Questions pratiques</h2>
      <div class="faq">
        ${questions.map(ligneQuestion).join('\n        ')}
      </div>
    </div>
  </section>`,
  };

  const jsonld = {
    '@context': 'https://schema.org', '@type': V.typeSchema, name: nom, description: T.description_google || '', telephone: B.telephone,
    address: { '@type': 'PostalAddress', streetAddress: B.adresse, postalCode: (B.ville || '').split(' ')[0], addressLocality: (B.ville || '').split(' ').slice(1).join(' '), addressCountry: 'FR' },
    openingHoursSpecification: [],
  };
  const R = C.reglages || {};
  if (Array.isArray(R.geo) && R.geo.length === 2) jsonld.geo = { '@type': 'GeoCoordinates', latitude: R.geo[0], longitude: R.geo[1] };
  if (R.url) jsonld.url = R.url;
  JOURS.forEach((j, d) => H[d].forEach((s) => jsonld.openingHoursSpecification.push({ '@type': 'OpeningHoursSpecification', dayOfWeek: EN[d], opens: hhmm(s[0]), closes: hhmm(s[1]) })));

  return `${tete(C, o, `${nom}, ${V.titrePage}`, T.description_google || '')}
<body class="accueil-${ST.accueil} titres-${ST.titres} angles-${ST.angles}${o.calme ? ' calme' : ''}">
<a class="skip" href="#contenu">Aller au contenu</a>
${bandeauMaquette}
${annonce}
${accueil()}

<main id="contenu">
${suite.filter((k) => k !== 'demande' && k !== 'horaires').map((k) => parties[k]() + (k === 'offres' && formulaire ? sectionDemande() : '')).join('\n')}

  <section class="sec${fond('horaires')}" id="horaires">
    <div class="wrap">
      <div class="visit">
        <div>
          <h2>Horaires et accès</h2>
          <dl class="hours">
            ${SEMAINE.map(ligneHoraire).join('\n            ')}
          </dl>
          <p class="statut" data-statut hidden><span></span></p>
          ${C.horaires_note ? `<p class="hnote">${esc(C.horaires_note)}</p>` : ''}
        </div>
        <div class="infos">
          <div><h3>Adresse</h3><p class="gros">${esc(B.adresse)}<br>${esc(B.ville)}</p></div>
          ${B.acces ? `<div><h3>Accès</h3><p>${esc(B.acces)}</p></div>` : ''}
          <div><h3>Téléphone</h3><a class="gros" href="${tel}">${esc(B.telephone)}</a></div>
          ${B.email ? `<div><h3>E-mail</h3><a href="mailto:${esc(B.email)}">${esc(B.email)}</a></div>` : ''}
          <div class="actions"><a class="btn" href="${itineraire}" target="_blank" rel="noopener">Itinéraire</a></div>
        </div>
      </div>
      <div class="carte-box">
        <div>
          <button class="btn btn-contour" id="plan-btn" type="button" data-src="${esc(planSrc)}">Afficher le plan</button>
          <p>Le plan est fourni par Google Maps. Il ne se charge que si vous cliquez.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <a class="nom" href="#contenu">${esc(nom)}</a>
    <div class="foot-grid">
      <div><h3>Adresse</h3><p>${esc(B.adresse)}<br>${esc(B.ville)}${B.quartier ? '<br>' + esc(B.quartier) : ''}</p></div>
      <div><h3>Horaires</h3><ul>${resumeHoraires(TXT)}</ul></div>
      <div><h3>Contact</h3><ul>
        <li><a href="${tel}">${esc(B.telephone)}</a></li>
        ${B.email ? `<li><a href="mailto:${esc(B.email)}">${esc(B.email)}</a></li>` : ''}
        ${B.instagram ? `<li><a href="${esc(B.instagram)}" target="_blank" rel="noopener">Instagram</a></li>` : ''}
      </ul></div>
    </div>
    <div class="legal">
      <a href="${lienMentions}">Mentions légales</a>
      ${o.lienAdmin ? `<a href="${o.lienAdmin}">Espace boutique</a>` : ''}
      <span>© ${new Date().getFullYear()} ${esc(nom)}</span>
      ${C.credits_photos ? `<span>${esc(C.credits_photos)}</span>` : ''}
    </div>
  </div>
</footer>

<div class="sheet" id="menu" hidden>
  <div class="sheet-top">
    <span class="nom">${esc(nom)}</span>
    <button class="menu-btn" type="button" data-fermer style="display:inline-flex">Fermer</button>
  </div>
  <nav aria-label="Menu">${liensNav}</nav>
  <div class="actions"><a class="btn btn-blanc" href="${tel}">Appeler</a><a class="btn btn-clair" href="${itineraire}" target="_blank" rel="noopener">Itinéraire</a></div>
</div>

<nav class="bar" aria-label="Actions rapides">
  <a class="btn" href="${tel}">Appeler</a>
  <a class="btn btn-contour" href="${itineraire}" target="_blank" rel="noopener">Itinéraire</a>
</nav>

<script type="application/ld+json">${JSON.stringify(jsonld).replace(/</g, '\\u003c')}<\/script>
${scripts}
</body>
</html>
`;
}

function rendreMentions(C, o = {}) {
  const B = C.boutique || {}, M = C.mentions || {};
  const nom = B.nom || 'Boutique';
  const k = (v) => (v ? esc(v) : '<em>à compléter</em>');
  const demandes = C.commandes && C.commandes.actif && voc(C).demande.type !== 'lien';
  return `${tete(C, o, 'Mentions légales, ' + nom, 'Mentions légales du site de ' + nom)}
<body>
<main class="sec"><div class="wrap" style="max-width:760px">
  <p><a href="/">← Retour au site</a></p>
  <h1 style="font-size:2.25rem;margin:28px 0 36px">Mentions légales</h1>
  <h2 style="font-size:1.125rem;margin:28px 0 10px">Éditeur du site</h2>
  <p>${k(M.raison_sociale)}<br>${esc(B.adresse)}, ${esc(B.ville)}<br>Téléphone : ${esc(B.telephone)}<br>SIRET : ${k(M.siret)}<br>Directeur de la publication : ${k(M.directeur_publication)}${M.email_contact ? '<br>Contact : ' + esc(M.email_contact) : ''}</p>
  <h2 style="font-size:1.125rem;margin:28px 0 10px">Hébergement</h2>
  <p>Cloudflare, Inc., 101 Townsend St., San Francisco, CA 94107, États-Unis.</p>
  <h2 style="font-size:1.125rem;margin:28px 0 10px">Données personnelles et cookies</h2>
  <p>Ce site ne dépose pas de cookie de mesure d'audience ni de publicité. Le plan Google Maps n'est chargé que si vous cliquez sur « Afficher le plan » ; Google peut alors déposer ses propres cookies.</p>
  ${demandes ? `<p style="margin-top:12px">Le formulaire de demande transmet vos nom, téléphone, e-mail et message à la boutique. Ils sont conservés 180 jours au plus et servent uniquement à traiter votre demande${C.commandes.cle_web3forms ? ", l'e-mail de notification passant par le service Web3Forms" : ''}. Vous pouvez demander leur suppression à la boutique.</p>` : ''}
  <h2 style="font-size:1.125rem;margin:28px 0 10px">Photos</h2>
  <p>${esc(C.credits_photos || 'Photos : ' + nom)}</p>

</body>
</html>
`;

/* Espace boutique. Fonctionne avec le serveur (mode normal) ou seul dans un fichier (mode démonstration). */

const DEMO = window.ESPACE_DEMO || null;

const el = (tag, attrs, ...enfants) => {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  enfants.flat(Infinity).forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
};

/* Petite mémoire du navigateur. Si le navigateur la refuse (aperçu protégé, navigation privée),
   on garde tout en mémoire le temps de la visite : la démonstration fonctionne quand même. */
const memoire = {};
/* La mémoire du navigateur est-elle utilisable ? (non dans l'aperçu de l'app Claude) */
const stockageOk = (() => { try { localStorage.setItem('espace-test', '1'); localStorage.removeItem('espace-test'); return true; } catch (e) { return false; } })();
/* Démonstration : les images déjà dans le fichier ne sont pas recopiées dans la mémoire du navigateur (place limitée à quelques Mo) */
const imagesDemo = [], indexDemo = new Map();
if (DEMO) JSON.stringify(DEMO.contenu, (k, x) => { if (typeof x === 'string' && x.length > 2000 && x.startsWith('data:') && !indexDemo.has(x)) { indexDemo.set(x, imagesDemo.length); imagesDemo.push(x); } return x; });
const versTexte = (v) => JSON.stringify(v, (k, x) => (typeof x === 'string' && indexDemo.has(x) ? '@image-demo:' + indexDemo.get(x) : x));
const depuisTexte = (t) => JSON.parse(t, (k, x) => (typeof x === 'string' && x.startsWith('@image-demo:') ? imagesDemo[+x.slice(12)] || '' : x));
/* Chaque démonstration a sa propre mémoire : tous les fichiers ouverts depuis l'ordinateur partagent la même mémoire du navigateur,
   la clé dépend donc du site et de sa version (une nouvelle démonstration repart toujours de zéro). */
const empreinte = (t) => { let h = 5381; for (let i = 0; i < t.length; i += 7) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36) + t.length.toString(36); };
const PREFIXE = DEMO ? 'demo-' + empreinte(JSON.stringify(DEMO.contenu)) + '-' : 'espace-';
if (DEMO) { try { Object.keys(localStorage).filter((k) => k.startsWith('espace-demo-')).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* rien */ } }
function remettreAZero() {
  Object.keys(memoire).forEach((k) => { if (k.startsWith(PREFIXE)) delete memoire[k]; });
  try { Object.keys(localStorage).filter((k) => k.startsWith(PREFIXE)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* rien */ }
}
const memo = {
  persiste: true,
  lire(k, d) {
    const c = PREFIXE + k;
    if (c in memoire) return depuisTexte(memoire[c]);
    try { const v = localStorage.getItem(c); return v ? depuisTexte(v) : d; } catch (e) { return d; }
  },
  ecrire(k, v) {
    const c = PREFIXE + k, s = versTexte(v);
    let ok = true;
    try { localStorage.setItem(c, s); } catch (e) { ok = false; }
    if (ok || DEMO) memoire[c] = s;
    if (DEMO && k === 'contenu') memo.persiste = ok;
    return ok || !!DEMO;
  },
};
const demoApi = {
  async charger() { return memo.lire('connecte', false) ? { contenu: memo.lire('contenu', copie(DEMO.contenu)), maquette: true } : null; },
  async connexion() { memo.ecrire('connecte', true); },
  async deconnexion() { memo.ecrire('connecte', false); },
  async enregistrer(C) {
    const avant = memo.lire('contenu', copie(DEMO.contenu));
    if (!memo.ecrire('contenu', C)) throw new Error('Mémoire du téléphone pleine : retirez une photo.');
    /* « Revenir en arrière » de la démonstration : gardé pendant la visite, pour laisser la place au contenu */
    memoire[PREFIXE + 'precedent'] = versTexte(avant);
    try { localStorage.removeItem(PREFIXE + 'precedent'); } catch (e) { /* rien */ }
  },
  async annuler() { const p = memo.lire('precedent', null); if (!p) throw new Error('Aucune version précédente.'); memo.ecrire('contenu', p); return p; },
  async photo(blob) { return await new Promise((ok) => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(blob); }); },

  async commandes() {

    const ex = (id, h, statut, nom, n, quand, txt) => {
      const lignes = [[cap(V.offres.singulier), (o[0] && o[0].nom) || cap(V.offres.singulier)]];
      if (D.quantite && n) lignes.push([D.quantite, String(n)]);

      return { id, recue: new Date(Date.now() - h * 3600e3).toISOString(), statut, nom, quantite: D.quantite ? n : null, lignes };
    };
    return memo.lire('commandes', [
      ex('ex1', 1, 'nouvelle', 'Exemple : Mme Martin', 8, 'samedi 19 décembre 2026, 10h30', D.exemple ? D.exemple.replace(/^Ex\. : /, '') : 'Rien de particulier'),
      ex('ex2', 26, 'confirmee', 'Exemple : M. Durand', 6, 'vendredi 18 décembre 2026, 18h', 'Rien de particulier'),
    ]);
  },
  async statut(id, statut) { const l = await demoApi.commandes(); l.forEach((c) => { if (c.id === id) c.statut = statut; }); memo.ecrire('commandes', l); },
};

function lire(obj, chemin) { return chemin.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function ecrire(obj, chemin, v) { const ks = chemin.split('.'); const der = ks.pop(); let o = obj; ks.forEach((k) => { if (o[k] == null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }); o[der] = v; }

  return el('div', { class: 'champ' }, lab, el('input', { id, class: 'saisie', type: def.type || 'text', inputmode: def.mode, placeholder: def.ph || '', value: val || '', oninput: (e) => maj(e.target.value) }));

async function reduire(fichier, maxCote, qualite) {
  const url = URL.createObjectURL(fichier);
  try {
    const im = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('Photo illisible : essayez une autre.')); i.src = url; });
    const r = Math.min(1, maxCote / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * r); cv.height = Math.round(im.naturalHeight * r);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', qualite));
  } finally { URL.revokeObjectURL(url); }
}

/* Vidéo de fond : fichier MP4 ou WebM (20 Mo au plus), ou lien */

      etat.textContent = 'Envoi de la vidéo…';

    el('header', { class: 'haut' }, el('div', { class: 'haut-in' },
      el('div', { class: 'haut-titre' }, el('b', { text: nom }), el('span', { text: 'Espace boutique' })),
      el('a', { class: 'btn', href: DEMO ? '#' : '/', target: DEMO ? null : '_blank', rel: 'noopener', text: 'Voir le site', onclick: DEMO ? (e) => { e.preventDefault(); plein.hidden = false; rendreApercu(); } : null }),
      el('button', { type: 'button', class: 'btn', text: 'Se déconnecter', onclick: async () => { if (modifie() && !confirm2()) return; await api.deconnexion(); ecranConnexion(); } }))),
    DEMO ? el('p', { class: 'bandeau', text: 'Démonstration : vos essais restent sur ce téléphone, rien n’est publié.' })
      : (E.maquette ? el('p', { class: 'bandeau', text: 'Le site est encore en mode proposition : les commandes ne sont pas envoyées.' }) : null),
    el('div', { class: 'cadre' }, editeur, colonne), barre, plein);
  dessinerEditeur(); majBarre(); rendreApercu();
  api.commandes().then((L) => { E.nouvelles = L.filter((c) => c.statut === 'nouvelle').length; majResumes(); }).catch(() => {});
}
let avertiDeco = false;
function confirm2() { if (avertiDeco) return true; avertiDeco = true; toast('Des modifications ne sont pas enregistrées. Touchez encore « Se déconnecter » pour les abandonner.'); return false; }

function normaliser(C) {
  C.boutique = C.boutique || {}; C.textes = C.textes || {}; C.commandes = C.commandes || {}; C.annonce = C.annonce || {};
  C.sections = Object.assign({ boutique: true, produits: true, offres: true, presse: true, questions: true }, C.sections || {});
  ['produits', 'offres', 'questions', 'presse'].forEach((k) => { if (!Array.isArray(C[k])) C[k] = []; });
  return C;
}
function appliquerTheme(C) {
  let st = document.getElementById('theme-boutique');
  if (!st) { st = el('style', { id: 'theme-boutique' }); document.head.append(st); }
  st.textContent = cssTheme(C, DEMO ? (f) => DEMO.polices[f] || '' : (f) => '/fonts/' + f);
  const meta = document.querySelector('meta[name=theme-color]'); if (meta && C.theme && C.theme.couleur) meta.setAttribute('content', C.theme.couleur);
  const icone = document.querySelector('link[rel=icon]'); if (icone && C.boutique && C.boutique.nom) icone.setAttribute('href', favicon(C));
}
async function demarrer() {
  try {
    const r = await api.charger();
    if (!r) { ecranConnexion(); return; }
    const brouillon = memo.lire('brouillon', null);
    E.C = normaliser(r.contenu); E.base = JSON.stringify(E.C); E.maquette = !!r.maquette;
    if (brouillon && !DEMO) { E.C = normaliser(brouillon); memo.ecrire('brouillon', null); toast('Vos modifications non enregistrées ont été récupérées.'); }
    ecranPrincipal();
  } catch (x) {
    racine.replaceChildren(el('main', { class: 'connexion' }, el('div', { class: 'erreur', text: 'Impossible de charger l’espace boutique : ' + x.message + ' Vérifiez la connexion internet et rechargez la page.' })));
  } finally {
    /* démonstration : on montre d'abord le site, une seule fois */
    if (DEMO && DEMO.siteDabord && !siteMontre) { siteMontre = true; vueSiteDemo(); }
  }
}

window.addEventListener('beforeunload', (e) => { if (E.C && modifie()) { e.preventDefault(); e.returnValue = ''; } });
demarrer();

</script>
