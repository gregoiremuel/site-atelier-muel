<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161616">
<title>Maison Orée : démonstration</title>
<link rel="icon" href="">
<style>
/* Espace boutique : mêmes couleurs et polices que le site (bleu de la devanture, blanc, Vollkorn + Source Sans 3). */
:root{
  --bleu:#46667f;--bleu-fonce:#2f4b61;--bleu-pale:#edf2f5;
  --encre:#1f2328;--gris:#5a6470;--trait:#d7dee4;--fond:#f6f8f9;--blanc:#fff;
  --paille:#efd58b;--ok:#2f6b45;--ok-pale:#e3f1e7;--alerte:#8a2c22;--alerte-pale:#fbecea;
  --titres:"Vollkorn",Georgia,serif;--texte:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --r:6px;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:400 1.0625rem/1.5 var(--texte)}
h1,h2,h3{font-family:var(--titres);font-weight:600;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--bleu-fonce)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:2px solid var(--bleu);background:var(--bleu);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}
.btn.sec{background:#fff;color:var(--bleu-fonce)}
.btn.sec:hover{background:var(--bleu-pale)}
.btn.discret{background:transparent;border-color:transparent;color:var(--bleu-fonce);padding:0 10px}
.btn.discret:hover{background:var(--bleu-pale)}
.btn.danger{background:#fff;border-color:#e2b8b2;color:var(--alerte)}
.btn.danger.confirmer{background:var(--alerte);border-color:var(--alerte);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.petit{min-height:36px;padding:0 12px;font-size:.9375rem}

/* Connexion */
.connexion{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.connexion form{width:100%;max-width:380px;background:#fff;border:1px solid var(--trait);border-radius:10px;padding:28px 24px;display:grid;gap:16px}
.connexion h1{font-size:1.625rem}
.connexion .sous{color:var(--gris);margin-top:-8px}
.mdp{display:flex;border:1px solid #b6c1ca;border-radius:var(--r);overflow:hidden;background:#fff}
.mdp input{flex:1;border:0;padding:12px;min-width:0}
.mdp input:focus{outline:none}
.mdp:focus-within{outline:2px solid var(--bleu);outline-offset:1px}
.mdp button{border:0;background:var(--bleu-pale);padding:0 12px;cursor:pointer;color:var(--bleu-fonce);font-weight:600;font-size:.9375rem}
.erreur{background:var(--alerte-pale);color:var(--alerte);border-radius:var(--r);padding:10px 12px}
.aide{color:var(--gris);font-size:.9375rem}

/* Barre du haut */
.haut{position:sticky;top:0;z-index:30;background:var(--bleu);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.haut-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.haut-titre{margin-right:auto;min-width:0}
.haut-titre b{display:block;font:600 1.25rem/1.15 var(--titres)}
.haut-titre span{font-size:.875rem;opacity:.85}
.haut .btn{border-color:rgba(255,255,255,.7);background:transparent;color:#fff;min-height:38px;padding:0 12px;font-size:.9375rem}
.haut .btn:hover{background:rgba(255,255,255,.14)}
.bandeau{background:var(--paille);color:var(--encre);text-align:center;font-size:.9375rem;padding:8px 16px}

/* Mise en page : éditeur + aperçu */
.cadre{max-width:1320px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:24px}
.editeur{display:grid;gap:12px;min-width:0;align-content:start}
.apercu-col{display:none}
@media (min-width:1080px){
  .cadre{grid-template-columns:minmax(0,1fr) 420px}
  .apercu-col{display:block;position:sticky;top:84px;height:calc(100svh - 104px)}
  .btn-apercu{display:none}
}
.apercu-col .tel-cadre{height:100%;border:1px solid var(--trait);border-radius:18px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.apercu-col .tel-cadre p{font-size:.8125rem;color:var(--gris);padding:8px 12px;border-bottom:1px solid var(--trait);background:var(--fond)}
.apercu-col iframe,.apercu-plein iframe{flex:1;width:100%;border:0;background:#fff}
.apercu-plein{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.apercu-plein .barre{display:flex;justify-content:space-between;align-items:center;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--trait)}

.intro-edit{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.intro-edit h1{font-size:1.5rem}

/* Panneaux */
details.pan{background:#fff;border:1px solid var(--trait);border-radius:10px}
details.pan>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:16px 18px}
details.pan>summary::-webkit-details-marker,details.item>summary::-webkit-details-marker{display:none}
details.pan>summary h2{font-size:1.3125rem}
details.pan>summary .resume{grid-column:1;color:var(--gris);font-size:.9375rem;min-width:0;overflow-wrap:anywhere}
details.pan>summary .chev{grid-row:1/span 2;grid-column:2}
.chev{width:30px;height:30px;border:1px solid var(--trait);border-radius:var(--r);display:grid;place-items:center}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.pan-corps{padding:0 18px 20px;display:grid;gap:16px;min-width:0}
.pastille{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8125rem;font-weight:600;background:var(--paille);color:var(--encre);margin-left:6px;vertical-align:2px}

/* Champs */
.champ{display:grid;gap:6px;min-width:0}
.champ>label,.champ>.lab{font-weight:600}
.champ .ex{font-weight:400;color:var(--gris);font-size:.9375rem}
.saisie{width:100%;min-height:46px;padding:10px 12px;border:1px solid #b6c1ca;border-radius:var(--r);background:#fff}
.saisie:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}
textarea.saisie{min-height:90px;resize:vertical;line-height:1.45}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;user-select:none}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .rail{width:46px;height:28px;border-radius:999px;background:#c5ced5;position:relative;transition:background .15s;flex:none}
.interrupteur .rail::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.interrupteur input:checked+.rail{background:var(--ok)}
.interrupteur input:checked+.rail::after{transform:translateX(18px)}
.interrupteur input:focus-visible+.rail{outline:2px solid var(--bleu);outline-offset:2px}

/* Photo */
.photo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.photo .vignette{width:96px;height:72px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;border:1px solid var(--trait)}
.photo .actions{display:flex;flex-wrap:wrap;gap:8px}
.photo input[type=file]{position:absolute;opacity:0;width:1px;height:1px}

/* Listes (fromages, plateaux…) */
.liste{display:grid;gap:8px}
details.item{border:1px solid var(--trait);border-radius:8px;background:#fff}
details.item[open]{border-color:var(--bleu)}
details.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px}
details.item>summary .mini{width:44px;height:44px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;flex:none}
details.item>summary .txt{flex:1;min-width:0}
details.item>summary::after{content:"";flex:none;width:8px;height:8px;margin-right:4px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.item[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.item>summary b{display:block;font:500 1.125rem/1.25 var(--titres);overflow-wrap:anywhere}
details.item>summary span.s{display:block;color:var(--gris);font-size:.9375rem;overflow-wrap:anywhere}
.item-corps{padding:4px 12px 14px;display:grid;gap:14px;border-top:1px solid var(--trait);padding-top:14px}
.item-outils{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.item-outils .ordre{display:flex;gap:6px}
.ajouter{justify-self:start}

/* Horaires */
.jours{display:grid;gap:0;border-top:1px solid var(--trait)}
.jour{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--trait)}
.jour .nomj{font-weight:600;padding-top:8px;text-transform:capitalize}
.plages{display:grid;gap:8px}
.plage{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.plage input{width:auto;min-width:118px;min-height:44px}
.plage span{color:var(--gris)}
.ferme{color:var(--gris);padding-top:8px}
@media (max-width:520px){.jour{grid-template-columns:minmax(0,1fr)}.jour .nomj{padding-top:0}}

/* Commandes reçues */
.cmds{display:grid;gap:10px}
.cmd{border:1px solid var(--trait);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.cmd.nouvelle{border-color:#d9b24a;background:#fffbef}
.cmd-tete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.cmd-tete b{font:600 1.125rem/1.25 var(--titres)}
.cmd dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.cmd dt{color:var(--gris)}
.cmd dd{margin:0;overflow-wrap:anywhere}
.statuts{display:flex;flex-wrap:wrap;gap:6px}
.statuts button{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:5px 12px;font-size:.875rem;cursor:pointer}
.statuts button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}
.etiquette{font-size:.8125rem;font-weight:600;border-radius:999px;padding:2px 10px}
.etiquette.nouvelle{background:var(--paille)}
.etiquette.confirmee{background:var(--bleu-pale);color:var(--bleu-fonce)}
.etiquette.retiree{background:var(--ok-pale);color:var(--ok)}
.etiquette.annulee{background:#eceef0;color:var(--gris)}
.vide{padding:16px;border:1px dashed var(--trait);border-radius:8px;color:var(--gris);text-align:center}

/* Barre d'enregistrement */
.barre-enr{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--trait);box-shadow:0 -4px 16px rgba(31,35,40,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barre-enr .in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.barre-enr .etat{margin-right:auto;font-weight:600}
.barre-enr .etat.modifie{color:#7a5a00}
.barre-enr .etat.ok{color:var(--ok)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--encre);color:#fff;border-radius:8px;padding:10px 16px;font-size:.9375rem;max-width:calc(100vw - 32px)}
@media (max-width:600px){.barre-enr .etat{flex-basis:100%;font-size:.875rem}.barre-enr .in .btn{flex:1 1 0;padding:4px 6px;min-width:0;white-space:normal;line-height:1.15;font-size:.9375rem;text-align:center}.haut-in .btn{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Maison : couleurs de collection, plusieurs photos */
.couleur{display:flex;gap:8px;align-items:center}
.couleur .saisie{max-width:140px}
.pastille-couleur{width:48px;height:44px;padding:2px;border:1px solid var(--trait);border-radius:var(--r);background:#fff;cursor:pointer}
.photos-liste{display:grid;gap:10px}
.photo-el{display:flex;gap:12px;align-items:center}
.photo-el .vignette{width:72px;height:90px;flex:none;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;border:1px solid var(--trait)}
.photo-el .actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.photos-liste input[type=file]{position:absolute;left:-9999px}
.grille{align-items:start}
.grille>.champ:has(.photos-liste),.grille>.champ:has(.photo),.grille>.champ:has(textarea){grid-column:1/-1}

/* Vidéo de fond */
.video-champ{display:grid;gap:12px}
.video-apercu video{width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000;display:block}
.video-champ .saisie{margin-top:8px}

</style>
</head>

<script>window.ESPACE_DEMO = { siteDabord: true, contenu: {"_schema":"maison v1","maison":{"nom":"Maison Orée","logo":"","logo_texte":"","ville":"Paris","adresse":"","code_postal":"75016","email":"","telephone":"","instagram":"","linkedin":"","pinterest":"","youtube":"","fabrication":"Site d’exemple","description_google":"Site d’exemple d’une joaillerie imaginaire, créé par Grégoire Muel pour montrer un catalogue avec panier et espace de modification."},"theme":{"fond":"#faf8f4","encre":"#161616","gris":"#5f5a54","trait":"#e3ded5"},"annonce":{"afficher":false,"texte":""},"accueil":{"photo":"https://images.unsplash.com/photo-1518457607834-6e8d80c183c5","video":"","fond_video":false,"titre":"Une joaillerie imaginaire","texte":"Site d’exemple : ouvrez l’espace maison pour ajouter une pièce, changer un prix ou une photo.","mission":"Une maison imaginaire, pour montrer un catalogue complet : collections, fiches de pièces, panier et demandes de commande reçues dans l’espace maison.","photo_atelier":"https://images.unsplash.com/photo-1542401886-65d6c61db217"},"collections":[{"id":"tropical","nom":"Rivage","couleur":"#2e6a4f","pale":"#e8f0ea","photo":"https://images.unsplash.com/photo-1503149779833-1de50ebe5f8a","texte":"Collection d’exemple : son nom, sa couleur et sa photo se changent dans l’espace maison.","visible":true},{"id":"desert","nom":"Sable","couleur":"#8f5a2e","pale":"#f4ebe0","photo":"https://images.unsplash.com/photo-1542401886-65d6c61db217","texte":"Collection d’exemple : son nom, sa couleur et sa photo se changent dans l’espace maison.","visible":true},{"id":"magma","nom":"Braise","couleur":"#a2322b","pale":"#f6e6e3","photo":"https://images.unsplash.com/photo-1518457607834-6e8d80c183c5","texte":"Collection d’exemple : son nom, sa couleur et sa photo se changent dans l’espace maison.","visible":true}],"types":[{"id":"bagues","nom":"Bagues"},{"id":"colliers","nom":"Colliers"},{"id":"bracelets","nom":"Bracelets"},{"id":"boucles-d-oreilles","nom":"Boucles d'oreilles"},{"id":"broches","nom":"Broches"},{"id":"masques","nom":"Masques"},{"id":"lunettes","nom":"Lunettes"},{"id":"porte-briquets","nom":"Porte-briquets"},{"id":"manches-de-couteaux","nom":"Manches de couteaux"}],"pieces":[{"id":"broche-phoenix","nom":"Broche Phénix","collection":"","type":"broches","prix":"2000","photos":["https://images.unsplash.com/photo-1560427450-00fa9481f01e","https://images.unsplash.com/photo-1560427450-00fa9481f01e"],"photo_portee":"https://images.unsplash.com/photo-1682963135833-ee78c62672b3","description":"","metal":"","pierres":"","poids":"","tailles":false,"gravure":false,"vendue":false,"visible":true,"exemple":true},{"id":"bague-tropical","nom":"Bague Rivage","collection":"tropical","type":"bagues","prix":"","photos":["https://images.unsplash.com/photo-1621329109234-d7657d2f3846","https://images.unsplash.com/photo-1579206593127-8ccc44dc661c"],"photo_portee":"https://images.unsplash.com/photo-1556376752-19770d78207f","description":"","metal":"","pierres":"","poids":"","tailles":true,"gravure":true,"vendue":false,"visible":true,"exemple":true},{"id":"collier-desert","nom":"Collier Sable","collection":"desert","type":"colliers","prix":"","photos":["https://images.unsplash.com/photo-1560427450-00fa9481f01e","https://images.unsplash.com/photo-1682963135833-ee78c62672b3"],"photo_portee":"https://images.unsplash.com/photo-1548357194-9e1aace4e94d","description":"","metal":"","pierres":"","poids":"","tailles":false,"gravure":false,"vendue":false,"visible":true,"exemple":true},{"id":"boucles-magma","nom":"Boucles d'oreilles Braise","collection":"magma","type":"boucles-d-oreilles","prix":"","photos":["https://images.unsplash.com/photo-1579206593127-8ccc44dc661c","https://images.unsplash.com/photo-1621329109234-d7657d2f3846"],"photo_portee":"https://images.unsplash.com/photo-1560427450-00fa9481f01e","description":"","metal":"","pierres":"","poids":"","tailles":false,"gravure":false,"vendue":false,"visible":true,"exemple":true},{"id":"bracelet-tropical","nom":"Bracelet Rivage","collection":"tropical","type":"bracelets","prix":"","photos":["https://images.unsplash.com/photo-1682963135833-ee78c62672b3","https://images.unsplash.com/photo-1548357194-9e1aace4e94d"],"photo_portee":"https://images.unsplash.com/photo-1621329109234-d7657d2f3846","description":"","metal":"","pierres":"","poids":"","tailles":false,"gravure":true,"vendue":false,"visible":true,"exemple":true},{"id":"bague-magma","nom":"Bague Braise","collection":"magma","type":"bagues","prix":"","photos":["https://images.unsplash.com/photo-1560427450-00fa9481f01e","https://images.unsplash.com/photo-1579206593127-8ccc44dc661c"],"photo_portee":"https://images.unsplash.com/photo-1682963135833-ee78c62672b3","description":"","metal":"","pierres":"","poids":"","tailles":true,"gravure":true,"vendue":false,"visible":true,"exemple":true}],"pages":{"atelier":{"afficher":false,"titre":"L'atelier","photos":[],"texte":""},"maison":{"afficher":false,"titre":"La maison","photos":[],"texte":""},"entretien":{"afficher":true,"titre":"Entretien","photos":[],"texte":"Quelques gestes simples gardent vos bijoux beaux longtemps.\n\n## Au quotidien\n- Mettez vos bijoux après le parfum, la crème et la laque.\n- Retirez-les pour le sport, la piscine, la mer et le ménage.\n- Rangez chaque pièce séparément, dans sa pochette ou son écrin, pour éviter les rayures.\n\n## Le nettoyage\n- Or et argent : eau tiède, un peu de savon doux, une brosse très souple, puis un chiffon doux et sec.\n- Perles et pierres fragiles (opale, émeraude, turquoise) : un chiffon doux à peine humide, jamais de trempage.\n- Pas d'ultrasons ni de produit chimique sans l'avis d'un joaillier.\n\n## La révision\nFaites vérifier griffes et sertis par un joaillier une fois par an, surtout pour les bagues portées tous les jours."},"tailles":{"afficher":true,"titre":"Guide des tailles","photos":[],"texte":"La taille d'une bague correspond au tour de doigt en millimètres : une taille 52 fait 52 mm de tour.\n\n## Mesurer votre doigt\n- Entourez la base du doigt avec une bande de papier, plutôt en fin de journée.\n- Marquez le point de rencontre, puis mesurez la longueur en millimètres : c'est votre taille.\n\n## Avec une bague que vous portez déjà\nMesurez son diamètre intérieur et lisez la taille dans le tableau.\n\nEn cas de doute entre deux tailles, prenez la plus grande et indiquez-le dans votre demande."},"commande":{"afficher":true,"titre":"Commande et livraison","photos":[],"texte":"## Commander\nAjoutez les pièces qui vous plaisent au panier, avec la taille et la gravure si besoin, puis envoyez votre demande. Rien n'est payé en ligne.\n\n## La suite\nLa maison vous répond sous {delai} pour confirmer la disponibilité, le délai de fabrication, le prix, le paiement et la livraison.\n\n## Livraison\nEn France et à l'international. Le mode d'envoi et son prix vous sont indiqués avant toute commande."},"conditions":{"afficher":true,"titre":"Conditions de vente","photos":[],"texte":"## Objet\nCes conditions s'appliquent aux ventes de {maison} conclues à distance, après une demande envoyée depuis ce site.\n\n## Commande\nLa demande envoyée depuis le panier n'engage ni le client ni la maison. La vente est conclue quand la maison confirme par écrit la pièce, le prix, le délai, le paiement et la livraison, et que le client accepte.\n\n## Prix\nLes prix sont indiqués en euros, toutes taxes comprises. Les frais de livraison sont précisés avant la confirmation.\n\n## Paiement et livraison\nLes modalités de paiement, le délai et le mode de livraison sont précisés dans la confirmation de commande.\n\n## Droit de rétractation\nPour un achat à distance, le client dispose de 14 jours à compter de la réception pour se rétracter, sans avoir à se justifier. Ce droit ne s'applique pas aux pièces fabriquées selon ses demandes ou nettement personnalisées, par exemple gravées (article L221-28 du Code de la consommation).\n\n## Garanties\nLes pièces bénéficient de la garantie légale de conformité et de la garantie des vices cachés.\n\n## Médiation\nEn cas de litige, le client peut recourir gratuitement au médiateur de la consommation : {mediateur}."}},"commandes":{"actif":true,"delai_reponse":"48 heures","cle_web3forms":"","email":"","confirmation":"Merci, votre demande est partie. La maison vous répond sous {delai} pour confirmer chaque détail."},"mentions":{"raison_sociale":"","forme":"","siret":"","adresse":"","directeur_publication":"","email":"","mediateur":""},"credits_photos":"Site d’exemple : photos d’illustration (Unsplash) de Bart Zimny, Wolfgang Hasselmann, Marc Szeglat, Franco Antonio Giovanella, Edz Norton, Emily Karakis, Ilze Lucero, lilartsy, J D.","reglages":{"url":""}}, polices: {"bodoni-moda-latin-400-normal.woff2":"data:font/woff2;base64,d09GMgABAAAAADjAABAAAAAAeQwAADheAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGoI4G6Z4HIVmBmA/U1RBVF4AhRQRCAqBoHyBiGELg3YAATYCJAOHWgQgBYVeB4ZVDAcb3mlFB2LYOAAYoWyikYGQeSAC0x2LojZKThmz/y8HnMoYeWFXFS6JS0gZu9txRZu5avs8UZfMfTM+xvvr4mp7npgoB6o7Mb9BqQmA/Y/QE13FgOH8VoxNXEUYcAkWDDhG4yBiHqGxT3J5iN8ffGfmzn3vCws5wUiAEqS0eUtgc7XSOn3d4/k5vff/T4hjQfwnmASCWDAJtE3AVygE0UKCBJM61q7CKO3oRk2QmuioKHhhY1QM6nXwa2a3rw1BIACPxhgcRmDJ+RPenLv8Dg9z659BeWKN2OixsTdkbCyKsUjWxMZG9ALYBiNKQGIjWjgREAwUbEzA069i1hfjiqvyyqsugP95694yr7efyjitPFi5RpbnXr9cUUkq+5/LdgcvdZOtP1uu9G5RGIPGM1gUh7r0zpjoLKuEWwjGwjIHGCTdIq9yu32+CBPi2o0o8djroaLbSLLp8nGBP8dxQhj82PfLmt0/fe/CDGHe5VXk7A+bv5AY+SdcGN7+ywmVk0LtLjEIh0OYEKJCkctjHEYhNEI4CiMM/7c0RXlv9+pe+l06q+4o5fGOSqnMOGU0f/a+Z2bnpNNaPq3alSrJTTqXHu2e5bcry60jh5WOSlVaKTyAhQXQMBIYAPPCcAcYBpDA8//7fav3zWCmoRHyEAol7hl/6MHfQ0csmkfEGh7VIon70YdfRJOIp5E2i9XJVNEQknps+MNXLQ9s1G4n1KWJQlUiybq5vm4dlp6hSvpFyi06oY4hhqiPc6mbeimN2J+96X+MzRb4EWVSJaBn/765gMkEloHYATVUc/gTssGnD4PUaAQCAWW+odQ7uYJhoEJ1xRVlqv12blwd6zOBtv9+BiaETRXCpQMxZAwh8SCmTCG2bCH2nCBuPCHeRJBgIZAwYRAxMWSOaEiiJMg8KRAZGSRXLiRfAUROAVGqgFSrhiywEHLTbch99yFPPIG89x4yaBBu2AjchEk4BAELIBSDQSPy0f9Ri4SqhR/7PSsWHK4uyZoP/BvSlHLgIgDjlwDNuVyYdtBu1/8pkYPDDlbhb242gD6I7Q4SBjRh90aIVZ/Es5ULA6E/lgZVaJeCFQ1Y/Jqy8uY  var(--texte)}\nimg{display:block;max-width:100%}\na{color:inherit}\nh1,h2,h3{margin:0;font-family:var(--titres);font-weight:400;line-height:1.12;color:var(--accent,var(--encre))}\nh1{font-size:clamp(2rem,4vw,3rem)}\nh2{font-size:clamp(1.5rem,2.5vw,1.9375rem)}\np{margin:0}\nul{margin:0;padding:0}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}\n.skip{position:absolute;left:-9999px;top:0}\n.skip:focus{left:12px;top:12px;z-index:100;background:#fff;padding:10px 14px}\n:focus-visible{outline:2px solid var(--encre);outline-offset:3px}\n[hidden]{display:none!important}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border:1px solid var(--encre);background:var(--encre);color:#fff;font:500 1rem/1 var(--texte);letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:background-color .2s,color .2s}\n.btn:hover{background:#fff;color:var(--encre)}\n.btn:disabled{opacity:.5;cursor:default}\n.btn-contour{background:transparent;color:var(--encre)}\n.btn-contour:hover{background:var(--encre);color:#fff}\n.lien{display:inline-block;font-weight:500;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}\n.lien+.lien{margin-left:24px}\n.petit-lien{font-size:.9375rem;color:var(--gris)}\n.note{font-size:.9375rem;color:var(--gris)}\n.vide{color:var(--gris)}\n.sur{font:600 .875rem/1.4 var(--texte);color:var(--accent,var(--gris));margin-bottom:10px}\n.sur a{text-decoration:none}\n\n.maquette{background:#ece8e1;color:#4a4540;font-size:.8125rem;line-height:1.4;padding:8px var(--gut);text-align:center}\n.annonce{background:var(--encre);color:#fff;text-align:center;padding:10px var(--gut);font-size:.9375rem}\n\n/* En-tête : menu à gauche, nom centré, contact et panier à droite */\n.tete{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--tete);padding:0 calc(var(--gut) - 10px);background:var(--fond);border-bottom:1px solid var(--trait)}\n.marque{font:400 clamp(1.35rem,3vw,1.75rem)/1 var(--titres);text-decoration:none;white-space:nowrap;letter-spacing:.01em}\n.marque em{font-style:italic}\n.marque img{height:40px;width:auto}\n.tete-droite{display:flex;justify-content:flex-end;gap:2px}\n.ico{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;color:var(--encre);cursor:pointer;padding:0}\n.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}\n.compte{position:absolute;top:5px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--encre);color:#fff;font:600 .6875rem/17px var(--texte);text-align:center}\n\n/* Menu en volet */\n.volet{position:fixed;inset:0;z-index:60;background:rgba(22,22,22,.35)}\n.volet-in{position:absolute;top:0;bottom:0;left:0;width:min(400px,88vw);background:var(--fond);overflow-y:auto;padding:12px 28px calc(28px + env(safe-area-inset-bottom,0px))}\n.ico-fermer{margin:0 0 12px -10px}\n.volet-tit{font:600 .8125rem/1.4 var(--texte);color:var(--gris);margin:22px 0 8px}\n.volet ul{list-style:none}\n.volet li a{display:block;padding:7px 0;font:400 1.25rem/1.25 var(--titres);text-decoration:none}\n.volet li a:hover{color:var(--accent,var(--encre));text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}\nhtml.menu-ouvert{overflow:hidden}\n\n/* Accueil */\n.hero{position:relative;isolation:isolate;min-height:min(86svh,900px);display:flex;align-items:flex-end;color:#fff;background:#2a2622}\n.hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}\n.hero::after{content:\"\";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}\n.hero-txt{width:100%;padding-top:120px;padding-bottom:clamp(36px,6vw,72px)}\n.hero h1{color:#fff;max-width:17ch;font-size:clamp(2.25rem,4.6vw,3.625rem);letter-spacing:-.005em}\n.hero p{max-width:46ch;margin-top:16px;font-size:1.0625rem;color:rgba(255,255,255,.92)}\n.hero .lien{margin-top:22px;color:#fff}\n.colls{scroll-margin-top:var(--tete)}\n.colls ul{list-style:none;display:grid;gap:3px}\n.colls li a{position:relative;display:block;aspect-ratio:3/2;overflow:hidden;background:var(--accent);text-decoration:none}\n.coll-img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}\n.colls li a:hover .coll-img{transform:scale(1.04)}\n.coll-nom{position:absolute;left:0;bottom:0;background:var(--accent);color:#fff;font:400 1.3125rem/1 var(--titres);padding:13px 20px}\n.sec{padding:clamp(56px,8vw,104px) 0}\n.sec-haut{padding-top:clamp(32px,5vw,56px)}\n.sec-tete{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:28px}\n.sec h2{margin-bottom:24px}\n.sec-tete h2{margin:0}\n.bande{display:grid;background:var(--doux)}\n.bande-img{width:100%;aspect-ratio:4/3;object-fit:cover}\n.bande-txt{padding:clamp(40px,7vw,96px) var(--gut);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px}\n.bande-txt p{font-size:1.0625rem;max-width:52ch}\n\n/* Grille de pièces : la vue portée apparaît au survol */\n.grille{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 14px}\n.carte a{display:block;text-decoration:none}\n.carte-img{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:var(--doux)}\n.carte-img img{width:100%;height:100%;object-fit:cover}\n.carte-img .p2{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}\n@media (hover:hover){.carte a:hover .p2{opacity:1}}\n.carte-nom{display:block;margin-top:12px;font:400 1.0625rem/1.3 var(--titres)}\n.carte-prix{display:block;margin-top:2px;color:var(--gris);font-size:.9375rem}\n.filtres{display:flex;flex-wrap:wrap;gap:6px 22px;margin:18px 0 32px}\n.filtres a{text-decoration:none;color:var(--gris);padding:6px 0;border-bottom:1px solid transparent}\n.filtres a:hover{color:var(--encre)}\n.filtres a[aria-current]{color:var(--accent,var(--encre));border-bottom-color:currentColor}\n\n/* Collection */\n.coll-tete{display:grid;background:var(--pale,var(--doux))}\n.coll-tete-txt{padding:clamp(40px,7vw,96px) var(--gut);display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:620px}\n.coll-tete-txt h1{font-size:clamp(2.25rem,4.4vw,3.5rem)}\n.coll-tete-txt p:last-child{font-size:1.0625rem;max-width:52ch}\n.coll-tete-img{width:100%;aspect-ratio:4/3;object-fit:cover}\n\n/* Pièce */\n.fil{padding:20px 0;font-size:.9375rem;color:var(--gris)}\n.fil a{text-decoration:none}\n.fil a:hover{text-decoration:underline}\n.piece-grille{display:grid;gap:32px;padding-bottom:24px}\n.galerie{min-width:0}\n.galerie-piste{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--doux)}\n.galerie-piste::-webkit-scrollbar{display:none}\n.galerie-vue{position:relative;flex:0 0 100%;margin:0;scroll-snap-align:start;aspect-ratio:4/5}\n.galerie-img{width:100%;height:100%;object-fit:cover}\n.galerie-vue figcaption{position:absolute;left:12px;bottom:12px;background:rgba(250,248,244,.92);padding:3px 10px;font-size:.8125rem}\n.vide-photo{display:grid;place-items:center;color:var(--gris)}\n.galerie-nav{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:8px}\n.galerie-compte{font-size:.9375rem;color:var(--gris);min-width:48px;text-align:center}\n.galerie-vignettes{display:none;gap:8px;margin-top:10px}\n.galerie-vignettes button{padding:0;border:1px solid transparent;background:none;cursor:pointer;width:72px;aspect-ratio:4/5}\n.galerie-vignettes button[aria-current]{border-color:var(--encre)}\n.vignette{width:100%;height:100%;object-fit:cover}\n.piece-txt h1{font-size:clamp(1.75rem,3vw,2.5rem)}\n.piece-prix{font-size:1.125rem;margin-top:12px}\n.piece-desc{margin-top:20px;max-width:56ch}\n.piece-desc p+p{margin-top:12px}\n.piece-form{display:grid;gap:16px;margin-top:28px}\n.champ{display:grid;gap:6px}\n. <script type="module">
/* Polices de la maison (fichiers dans public/fonts, licence SIL OFL) :
   titres et nom de la maison en Bodoni Moda (didone de joaillerie), texte en Hanken Grotesk. */
const POLICES = {
  maison: {
    titres: '"Bodoni Moda","Didot","Bodoni 72",Georgia,serif',
    texte: '"Hanken Grotesk","Helvetica Neue",Arial,sans-serif',
    fichiers: [
      ['Bodoni Moda', 400, 'bodoni-moda-latin-400-normal.woff2', 'normal'],
      ['Bodoni Moda', 400, 'bodoni-moda-latin-400-italic.woff2', 'italic'],
      ['Bodoni Moda', 500, 'bodoni-moda-latin-500-normal.woff2', 'normal'],
      ['Hanken Grotesk', 400, 'hanken-grotesk-latin-400-normal.woff2', 'normal'],
      ['Hanken Grotesk', 500, 'hanken-grotesk-latin-500-normal.woff2', 'normal'],
      ['Hanken Grotesk', 600, 'hanken-grotesk-latin-600-normal.woff2', 'normal'],
    ],
  },
};

function cssPolices(url) {
  const P = POLICES.maison;
  return P.fichiers.map(([fam, w, f, st]) => `@font-face{font-family:"${fam}";font-weight:${w};font-style:${st};font-display:swap;src:url(${url(f)}) format("woff2")}`).join('\n')
    + `\n:root{--titres:${P.titres};--texte:${P.texte}}`;
}

/*
  Moteur de rendu de la maison : toutes les pages du site à partir du contenu (un seul objet JSON).
  Utilisé par le serveur (src/worker.js), par l'aperçu de l'espace maison et par outils/apercu.mjs.
*/

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
const slug = (s) => String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const hex = (c, d) => (/^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : d);
const prixNombre = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(/[\s\u202f\u00a0]/g, '').replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; };

const prixTexte = (v) => { const n = prixNombre(v); return n == null ? 'Prix sur demande' : euros(n); };
const TAILLES = Array.from({ length: 23 }, (_, i) => 44 + i); // tailles françaises de bague = tour de doigt en mm

const PAGES = { atelier: '/atelier', maison: '/maison', entretien: '/entretien', tailles: '/guide-des-tailles', commande: '/commande-et-livraison', conditions: '/conditions-de-vente' };

/* Données utiles, nettoyées */
function donnees(C) {
  const collections = (C.collections || []).filter((c) => c && c.id && c.nom && c.visible !== false);
  const types = (C.types || []).filter((t) => t && t.id && t.nom);
  const pieces = (C.pieces || []).filter((x) => x && x.id && x.nom && x.visible !== false)
    .map((x) => ({ ...x, photos: (Array.isArray(x.photos) ? x.photos : []).filter(Boolean) }));
  const coll = (id) => collections.find((c) => c.id === id) || null;
  const type = (id) => types.find((t) => t.id === id) || null;
  const pages = C.pages || {};
  const pageVisible = (k) => !!(pages[k] && pages[k].afficher !== false && (pages[k].texte || k === 'tailles'));
  return { collections, types, pieces, coll, type, pages, pageVisible };
}

/* Lignes d'une demande de commande, prix recalculés à partir du contenu (serveur et navigateur) */
function lignesPanier(C, articles) {
  const { pieces } = donnees(C);
  const out = [];
  (Array.isArray(articles) ? articles : []).slice(0, 20).forEach((a) => {
    const x = pieces.find((p) => p.id === (a && a.id));
    if (!x || x.vendue) return;
    const qte = Math.min(5, Math.max(1, Math.round(+a.qte || 1)));
    const taille = x.tailles && TAILLES.includes(+a.taille) ? +a.taille : null;
    const gravure = x.gravure ? String(a.gravure || '').slice(0, 30).trim() : '';
    out.push({ id: x.id, nom: x.nom, prix: prixNombre(x.prix), qte, taille, gravure, photo: x.photos[0] || '', tailles: !!x.tailles });
  });
  return out;
}

function src(p, largeur) {
  if (!p) return '';
  p = String(p).trim();
  if (/^https:\/\/images\.unsplash\.com\//.test(p)) return p.split('?')[0] + `?auto=format&fit=crop&w=${largeur}&q=70`;
  if (/^(https:\/\/|data:image\/|\/photos\/|\/assets\/)/i.test(p)) return p;
  return '';
}
/* Vidéo de fond (accueil) : fichier envoyé depuis l'espace de modification, lien https .mp4/.webm, ou fichier du site */
const videoSrc = (v) => { v = String(v || '').trim(); return /^(https:\/\/\S+\.(mp4|webm)(\?\S*)?|\/videos\/[a-z0-9-]+|\/assets\/\S+\.(mp4|webm)|data:video\/(mp4|webm);base64,\S+)$/i.test(v) ? v : ''; };
const ICO_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>';
function videoFond(v, poster, cls) {
  const s = videoSrc(v);
  if (!s) return '';
  const type = /^data:video\/webm|\.webm(\?|$)/i.test(s) ? 'video/webm' : 'video/mp4';
  return `<video class="${cls}" autoplay muted loop playsinline preload="auto"${poster ? ` poster="${esc(poster)}"` : ''} aria-hidden="true" data-video-fond><source src="${esc(s)}" type="${type}"></video><button class="video-pause" type="button" data-video-pause aria-label="Mettre la vidéo en pause" aria-pressed="false">${ICO_PAUSE}</button>`;
}
function img(p, largeur, cls, prio, alt) {
  const s = src(p, largeur);
  return s ? `<img class="${cls}" src="${esc(s)}" alt="${esc(alt || '')}" ${prio ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async">` : '';
}

/* Texte enrichi très simple : paragraphes, « ## titre », « - liste », jetons {delai} {maison} {mediateur} */
function texteRiche(s, jetons) {
  const t = String(s || '').replace(/\{(\w+)\}/g, (m, k) => (k in jetons ? jetons[k] : m));
  return t.split(/\n\s*\n/).map((bloc) => {
    let html = '', liste = [], para = [];
    const finL = () => { if (liste.length) { html += '<ul>' + liste.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'; liste = []; } };
    const finP = () => { if (para.length) { html += '<p>' + para.map(esc).join('<br>') + '</p>'; para = []; } };
    bloc.split('\n').map((l) => l.trim()).filter(Boolean).forEach((l) => {
      if (l.startsWith('## ')) { finP(); finL(); html += '<h2>' + esc(l.slice(3)) + '</h2>'; } else if (l.startsWith('- ')) { finP(); liste.push(l.slice(2)); } else { finL(); para.push(l); }
    });
    finP(); finL();
    return html;
  }).join('\n');
}
const jetons = (C) => ({ delai: (C.commandes || {}).delai_reponse || '48 heures', maison: (C.maison || {}).nom || 'la maison', mediateur: (C.mentions || {}).mediateur || 'à compléter' });

/* Icônes simples (trait) */
const ico = {
  menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>',
  fermer: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>',
  tel: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h3l1.5 4-2 1.3a12 12 0 0 0 6.1 6.1l1.3-2 4 1.5v3a1.8 1.8 0 0 1-1.9 1.8A16.6 16.6 0 0 1 4.8 5.4a1.8 1.8 0 0 1 1.8-1.9z"/></svg>',
  sac: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12.5H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
  gauche: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  droite: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  lieu: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  metal: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5l3-8h11l3 8z"/><path d="M6.5 9.5l2-3h7l2 3"/></svg>',
  pierre: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h11l3.5 5-9 10.5-9-10.5z"/><path d="M3 9.5h18M9 4.5l3 5 3-5M12 20l-3-10.5M12 20l3-10.5"/></svg>',
  poids: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9h10l2 11H5z"/><circle cx="12" cy="6.5" r="2.5"/></svg>',
  gravure: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M14 7l3 3"/></svg>',
  bague: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14.5" r="6"/><path d="M9.5 6.5L12 4l2.5 2.5L12 8.5z"/></svg>',
};

const favicon = (C) => src((C.maison || {}).logo, 64) || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="#161616"/></svg>');

/* o = { maquette, urlPolice, css | cssHref, js | jsHref, lienAdmin, apiCommande, apercu, panierInitial, calme (aperçu de l'espace maison : sans animations) } */
function document_(C, o, page) {
  const M = C.maison || {}, T = C.theme || {}, D = donnees(C), K = C.commandes || {};
  const nom = M.nom || 'Maison';
  const theme = `${cssPolices(o.urlPolice || ((f) => '/fonts/' + f))}\n:root{--fond:${hex(T.fond, '#faf8f4')};--encre:${hex(T.encre, '#161616')};--gris:${hex(T.gris, '#5f5a54')};--trait:${hex(T.trait, '#e3ded5')}}`;
  const style = o.css != null ? `<style>\n${o.css}\n${theme}\n</style>` : `<link rel="stylesheet" href="${o.cssHref || '/assets/site.css'}">\n<style>${theme}</style>`;
  const accent = page.accent ? ` style="--accent:${hex(page.accent.couleur, '#161616')};--pale:${hex(page.accent.pale, '#f1eee8')}"` : '';
  const motsNom = nom.split(' ');
  const marque = src(M.logo_texte, 600)
    ? `<img src="${esc(src(M.logo_texte, 600))}" alt="${esc(nom)}">`
    : (motsNom.length > 1 ? `<em>${esc(motsNom[0])}</em> ${esc(motsNom.slice(1).join(' '))}` : esc(nom));
  const telHref = M.telephone ? 'tel:' + String(M.telephone).replace(/[^\d+]/g, '').replace(/^0/, '+33') : '/commande-et-livraison#contact';

  const pagesInfo = [['atelier', 'L’atelier'], ['maison', 'La maison'], ['entretien', 'Entretien'], ['tailles', 'Guide des tailles'], ['commande', 'Commande et livraison']]
    .filter(([k]) => D.pageVisible(k)).map(([k, t]) => `<li><a href="${PAGES[k]}">${esc((D.pages[k] && D.pages[k].titre) || t)}</a></li>`).join('');
  const typesAvecPieces = D.types.filter((t) => D.pieces.some((x) => x.type === t.id));
  const volet = `<div class="volet" id="menu" hidden>
  <div class="volet-in">
    <button class="ico ico-fermer" type="button" data-fermer aria-label="Fermer le menu">${ico.fermer}</button>
    ${D.collections.length ? `<p class="volet-tit">Collections</p><ul class="volet-coll">${D.collections.map((c) => `<li><a href="/collections/${esc(c.id)}" style="--accent:${hex(c.couleur, '#161616')}">${esc(c.nom)}</a></li>`).join('')}</ul>` : ''}
    <p class="volet-tit">Bijoux</p><ul><li><a href="/bijoux">Toutes les pièces</a></li>${typesAvecPieces.map((t) => `<li><a href="/bijoux/${esc(t.id)}">${esc(t.nom)}</a></li>`).join('')}</ul>
    ${pagesInfo ? `<p class="volet-tit">La maison</p><ul>${pagesInfo}</ul>` : ''}
  </div>
</div>`;

  const reseaux = [['instagram', 'Instagram'], ['linkedin', 'LinkedIn'], ['pinterest', 'Pinterest'], ['youtube', 'YouTube']].filter(([k]) => /^https:\/\//.test(M[k] || ''));
  const pied = `<footer class="pied">
  <div class="wrap">
    <a class="pied-marque" href="/">${src(M.logo, 120) ? `<img src="${esc(src(M.logo, 120))}" alt="" width="56" height="26">` : ''}<span>${esc(nom)}</span></a>
    <div class="pied-cols">
      ${D.collections.length ? `<div><h2>Collections</h2><ul>${D.collections.map((c) => `<li><a href="/collections/${esc(c.id)}">${esc(c.nom)}</a></li>`).join('')}<li><a href="/bijoux">Toutes les pièces</a></li></ul></div>` : ''}
      <div><h2>Informations</h2><ul>${pagesInfo}${D.pageVisible('conditions') ? `<li><a href="${PAGES.conditions}">${esc(D.pages.conditions.titre || 'Conditions de vente')}</a></li>` : ''}</ul></div>
      <div id="contact-pied"><h2>Contact</h2><ul>
        ${M.email ? `<li><a href="mailto:${esc(M.email)}">${esc(M.email)}</a></li>` : ''}
        ${M.telephone ? `<li><a href="${telHref}">${esc(M.telephone)}</a></li>` : ''}
        ${M.ville ? `<li>${esc(M.ville)}</li>` : ''}
        ${reseaux.map(([k, t]) => `<li><a href="${esc(M[k])}" target="_blank" rel="noopener">${t}</a></li>`).join('')}
      </ul></div>
    </div>
    <div class="legal">
      <a href="/mentions-legales">Mentions légales</a>
      <a href="/confidentialite">Confidentialité</a>
      ${o.lienAdmin ? `<a href="${o.lienAdmin}">Espace maison</a>` : ''}
      <span>© ${new Date().getFullYear()} ${esc(nom)}</span>
      ${C.credits_photos ? `<span>${esc(C.credits_photos)}</span>` : ''}
    </div>
  </div>
</footer>`;

  const MAISON = {
    nom, api: o.apiCommande || '', maquette: !!o.maquette, apercu: !!o.apercu, cle: K.cle_web3forms || '', email: K.email || M.email || '',
    actif: K.actif !== false, delai: K.delai_reponse || '48 heures',
    confirmation: String(K.confirmation || 'Merci, votre demande est partie.').replace(/\{delai\}/g, K.delai_reponse || '48 heures'),
    pieces: D.pieces.map((x) => ({ id: x.id, nom: x.nom, prix: prixNombre(x.prix), photo: src(x.photos[0], 300), tailles: !!x.tailles, gravure: !!x.gravure, vendue: !!x.vendue })),
    panier: o.panierInitial || null,
  };
  const donneesJs = `var MAISON=${JSON.stringify(MAISON).replace(/</g, '\\u003c')};`;
  const scripts = o.js != null ? `<script>\n${donneesJs}\n${o.js}\n<\/script>` : `<script>${donneesJs}<\/script>\n<script src="${o.jsHref || '/assets/site.js'}" defer><\/script>`;
  const titre = page.titre ? `${page.titre}, ${nom}` : nom;
  const desc = page.description || M.description_google || '';

  return `<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${esc(titre)}</title>
<meta name="description" content="${esc(desc)}">
${o.maquette ? '<meta name="robots" content="noindex">' : ''}
<meta property="og:title" content="${esc(titre)}">
<meta property="og:description" content="${esc(desc)}">
<meta property="og:type" content="website">
${page.image ? `<meta property="og:image" content="${esc(src(page.image, 1200))}">` : ''}
<meta name="theme-color" content="${hex(T.fond, '#faf8f4')}">
<link rel="icon" href="${esc(favicon(C))}">
${style}
</head>
<body class="${page.classe || ''}${o.calme ? ' calme' : ''}"${accent}>
<a class="skip" href="#contenu">Aller au contenu</a>
${o.maquette ? `<div class="maquette" role="note">Site d’exemple : commerce imaginaire, créé par Grégoire Muel pour montrer l’espace de modification. Rien n’est publié, vos essais restent dans ce navigateur.</div>` : ''}
${C.annonce && C.annonce.afficher && C.annonce.texte ? `<div class="annonce" role="status">${esc(C.annonce.texte)}</div>` : ''}
<header class="tete">
  <button class="ico" type="button" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu">${ico.menu}</button>
  <a class="marque" href="/" aria-label="${esc(nom)}, accueil">${marque}</a>
  <div class="tete-droite">
    <a class="ico" href="${telHref}" aria-label="${M.telephone ? 'Appeler la maison' : 'Contact'}">${ico.tel}</a>
    <a class="ico panier-lien" href="/panier" aria-label="Panier">${ico.sac}<span class="compte" data-compte hidden></span></a>
  </div>
</header>
${volet}
<main id="contenu">
${page.corps}
</main>
${pied}
${page.jsonld ? `<script type="application/ld+json">${JSON.stringify(page.jsonld).replace(/</g, '\\u003c')}<\/script>` : ''}
${scripts}
</body>
</html>
`;
}

/* ---------- Morceaux ---------- */
const carte = (D, x) => `<li class="carte"><a href="/piece/${esc(x.id)}">
      <span class="carte-img${x.photo_portee ? ' a-portee' : ''}">${img(x.photos[0], 900, 'p1', false, '')}${x.photo_portee ? img(x.photo_portee, 900, 'p2', false, '') : ''}</span>
      <span class="carte-nom">${esc(x.nom)}</span>
      <span class="carte-prix">${x.vendue ? 'Vendue' : esc(prixTexte(x.prix))}</span>
    </a></li>`;
const grille = (D, liste, vide) => (liste.length ? `<ul class="grille">\n    ${liste.map((x) => carte(D, x)).join('\n    ')}\n  </ul>` : `<p class="vide">${esc(vide)}</p>`);
const filtres = (D, liste, actif, base) => {
  const ts = D.types.filter((t) => liste.some((x) => x.type === t.id));
  if (ts.length < 2) return '';
  return `<nav class="filtres" aria-label="Filtrer par type"><a href="${base}"${!actif ? ' aria-current="page"' : ''}>Tout</a>${ts.map((t) => `<a href="${base === '/bijoux' ? '/bijoux/' + esc(t.id) : base + '?type=' + esc(t.id)}"${actif === t.id ? ' aria-current="page"' : ''}>${esc(t.nom)}</a>`).join('')}</nav>`;
};

/* ---------- Pages ---------- */
function accueil(C, D) {
  const A = C.accueil || {}, M = C.maison || {};
  const video = A.fond_video !== false ? videoSrc(A.video) : '';
  const choix = D.pieces.slice(0, 8);
  return {
    classe: 'p-accueil', image: A.photo,
    jsonld: { '@context': 'https://schema.org', '@type': 'Organization', name: M.nom, description: M.description_google || '', ...((C.reglages || {}).url ? { url: C.reglages.url } : {}), sameAs: ['instagram', 'linkedin', 'pinterest', 'youtube'].map((k) => M[k]).filter((u) => /^https:\/\//.test(u || '')) },
    corps: `
  <section class="hero">
    ${video ? videoFond(video, src(A.photo, 2000), 'hero-media') : img(A.photo, 2200, 'hero-media', true, '')}
    <div class="hero-txt wrap">
      <h1>${esc(A.titre || M.nom)}</h1>
      ${A.texte ? `<p>${esc(A.texte)}</p>` : ''}
      ${D.collections.length ? '<a class="lien" href="#collections">Voir les collections</a>' : '<a class="lien" href="/bijoux">Voir les pièces</a>'}
    </div>
  </section>
  ${D.collections.length ? `
  <section class="colls" id="collections" aria-label="Collections">
    <ul>
      ${D.collections.map((c) => `<li style="--accent:${hex(c.couleur, '#161616')}"><a href="/collections/${esc(c.id)}">${img(c.photo, 1200, 'coll-img', false, '')}<span class="coll-nom">${esc(c.nom)}</span></a></li>`).join('\n      ')}
    </ul>
  </section>` : ''}
  ${choix.length ? `
  <section class="sec" aria-labelledby="t-pieces">
    <div class="wrap">
      <div class="sec-tete"><h2 id="t-pieces">Les pièces</h2><a class="lien" href="/bijoux">Toutes les pièces</a></div>
      ${grille(D, choix, '')}
    </div>
  </section>` : ''}
  ${A.mission || D.pageVisible('atelier') ? `
  <section class="bande">
    ${img(A.photo_atelier, 1400, 'bande-img', false, '')}
    <div class="bande-txt">
      <h2>${esc((D.pages.atelier && D.pages.atelier.titre) || 'L’atelier')}</h2>
      ${A.mission ? `<p>${esc(A.mission)}</p>` : ''}
      ${D.pageVisible('atelier') ? `<a class="lien" href="${PAGES.atelier}">Voir l’atelier</a>` : ''}
    </div>
  </section>` : ''}`,
  };
}

function pageListe(C, D, typeId) {
  const t = typeId ? D.type(typeId) : null;
  if (typeId && !t) return null;
  const liste = t ? D.pieces.filter((x) => x.type === t.id) : D.pieces;
  return {
    classe: 'p-liste', titre: t ? t.nom : 'Toutes les pièces',
    corps: `
  <section class="sec sec-haut">
    <div class="wrap">
      <h1>${esc(t ? t.nom : 'Toutes les pièces')}</h1>
      ${filtres(D, D.pieces, typeId, '/bijoux')}
      ${grille(D, liste, 'Aucune pièce en ligne pour le moment.')}
    </div>
  </section>`,
  };
}

function pageCollection(C, D, id, typeId) {
  const c = D.coll(id);
  if (!c) return null;
  const toutes = D.pieces.filter((x) => x.collection === c.id);
  const liste = typeId ? toutes.filter((x) => x.type === typeId) : toutes;
  return {
    classe: 'p-collection', titre: c.nom, description: c.texte, image: c.photo, accent: c,
    corps: `
  <section class="coll-tete">
    <div class="coll-tete-txt">
      <p class="sur">Collection</p>
      <h1>${esc(c.nom)}</h1>
      ${c.texte ? `<p>${esc(c.texte)}</p>` : ''}
    </div>
    ${img(c.photo, 1400, 'coll-tete-img', true, '')}
  </section>
  <section class="sec">
    <div class="wrap">
      ${filtres(D, toutes, typeId, '/collections/' + c.id)}
      ${grille(D, liste, 'Aucune pièce en ligne pour le moment dans cette collection.')}
    </div>
  </section>`,
  };
}

function pagePiece(C, D, id) {
  const x = D.pieces.find((p) => p.id === id);
  if (!x) return null;
  const c = D.coll(x.collection), t = D.type(x.type), M = C.maison || {};
  const images = [...x.photos, ...(x.photo_portee ? [x.photo_portee] : [])];
  const carac = [
    M.fabrication ? [ico.lieu, 'Fabrication', M.fabrication] : null,
    x.metal ? [ico.metal, 'Métal', x.metal] : null,
    x.pierres ? [ico.pierre, 'Pierres', x.pierres] : null,
    x.poids ? [ico.poids, 'Poids', x.poids] : null,
    x.gravure ? [ico.gravure, 'Gravure', 'Possible, à préciser dans la demande'] : null,
    x.tailles ? [ico.bague, 'Tailles', `${TAILLES[0]} à ${TAILLES[TAILLES.length - 1]}`] : null,
  ].filter(Boolean);
  const autres = D.pieces.filter((p) => p.id !== x.id && ((c && p.collection === c.id) || (!c && t && p.type === t.id))).slice(0, 4);
  const prix = prixNombre(x.prix);
  return {
    classe: 'p-piece', titre: x.nom, description: x.description || `${x.nom}${c ? ', collection ' + c.nom : ''}. ${M.nom || ''}`, image: images[0], accent: c,
    jsonld: { '@context': 'https://schema.org', '@type': 'Product', name: x.nom, description: x.description || undefined, image: images.map((u) => src(u, 1200)).filter(Boolean), brand: { '@type': 'Brand', name: M.nom }, ...(prix ? { offers: { '@type': 'Offer', price: prix, priceCurrency: 'EUR', availability: x.vendue ? 'https://schema.org/SoldOut' : 'https://schema.org/InStock' } } : {}) },
    corps: `
  <section class="piece wrap">
    <nav class="fil" aria-label="Fil d’Ariane"><a href="/bijoux">Bijoux</a>${c ? ` <span aria-hidden="true">/</span> <a href="/collections/${esc(c.id)}">${esc(c.nom)}</a>` : ''}${t ? ` <span aria-hidden="true">/</span> <a href="/bijoux/${esc(t.id)}">${esc(t.nom)}</a>` : ''}</nav>
    <div class="piece-grille">
      <div class="galerie" data-galerie>
        <div class="galerie-piste" tabindex="0" aria-label="Photos de la pièce">
          ${images.length ? images.map((u, i) => `<figure class="galerie-vue">${img(u, 1600, 'galerie-img', i === 0, i === images.length - 1 && x.photo_portee ? x.nom + ', portée' : x.nom)}${i === images.length - 1 && x.photo_portee ? '<figcaption>Portée</figcaption>' : ''}</figure>`).join('') : '<figure class="galerie-vue vide-photo"><span>Photo à venir</span></figure>'}
        </div>
        ${images.length > 1 ? `<div class="galerie-nav">
          <button class="ico" type="button" data-prec aria-label="Photo précédente">${ico.gauche}</button>
          <span class="galerie-compte" aria-live="polite"><span data-num>1</span> / ${images.length}</span>
          <button class="ico" type="button" data-suiv aria-label="Photo suivante">${ico.droite}</button>
        </div>
        <div class="galerie-vignettes">${images.map((u, i) => `<button type="button" data-vue="${i}" aria-label="Photo ${i + 1}"${i === 0 ? ' aria-current="true"' : ''}>${img(u, 200, 'vignette', false, '')}</button>`).join('')}</div>` : ''}
      </div>
      <div class="piece-txt">
        ${c ? `<p class="sur"><a href="/collections/${esc(c.id)}">${esc(c.nom)}</a></p>` : ''}
        <h1>${esc(x.nom)}</h1>
        <p class="piece-prix">${x.vendue ? 'Pièce vendue' : esc(prixTexte(x.prix))}</p>
        ${x.description ? `<div class="piece-desc">${texteRiche(x.description, jetons(C))}</div>` : ''}
        ${x.vendue ? '' : `<form class="piece-form" data-piece="${esc(x.id)}" novalidate>
          ${x.tailles ? `<div class="champ"><label for="taille">Taille</label><select id="taille" name="taille" class="saisie"><option value="">Choisir</option>${TAILLES.map((n) => `<option value="${n}">${n}</option>`).join('')}</select>${D.pageVisible('tailles') ? `<a class="petit-lien" href="${PAGES.tailles}">Guide des tailles</a>` : ''}</div>` : ''}
          ${x.gravure ? `<div class="champ"><label class="case"><input type="checkbox" name="graver"> Ajouter une gravure</label><input class="saisie" name="gravure" maxlength="30" placeholder="Texte à graver, 30 signes au plus" hidden></div>` : ''}
          <p class="piece-erreur" role="alert" hidden></p>
          <button class="btn" type="button" data-ajouter>Ajouter au panier</button>
          <p class="piece-ok" role="status" hidden>Ajoutée au panier. <a href="/panier">Voir le panier</a></p>
          <p class="note">Rien n’est payé en ligne : la maison vous répond sous ${esc((C.commandes || {}).delai_reponse || '48 heures')} pour confirmer la pièce, le prix et la livraison.</p>
        </form>`}
        ${carac.length ? `<ul class="carac">${carac.map(([i, l, v]) => `<li>${i}<span><b>${esc(l)}</b>${esc(v)}</span></li>`).join('')}</ul>` : ''}
        <ul class="liens-piece">
          ${D.pageVisible('entretien') ? `<li><a href="${PAGES.entretien}">Entretien</a></li>` : ''}
          ${D.pageVisible('commande') ? `<li><a href="${PAGES.commande}">Commande et livraison</a></li>` : ''}
        </ul>
      </div>
    </div>
  </section>
  ${autres.length ? `
  <section class="sec">
    <div class="wrap">
      <h2>${c ? 'Dans la même collection' : 'Dans le même esprit'}</h2>
      ${grille(D, autres, '')}
    </div>
  </section>` : ''}`,
  };
}

function pagePanier(C) {
  const K = C.commandes || {};
  return {
    classe: 'p-panier', titre: 'Panier',
    corps: `
  <section class="sec sec-haut">
    <div class="wrap panier">
      <h1>Panier</h1>
      <div class="panier-grille">
        <div>
          <ul class="panier-liste" data-panier aria-live="polite"><li class="vide">Votre panier est vide.</li></ul>
          <p class="panier-total" data-total hidden></p>
          <noscript><p>Le panier a besoin de JavaScript.</p></noscript>
        </div>
        ${K.actif === false ? `<div class="demande"><p>Les demandes en ligne sont fermées pour le moment. Écrivez à la maison : voir <a href="${PAGES.commande}#contact">Contact</a>.</p></div>` : `<form class="demande" id="demande" novalidate hidden>
          <h2>Envoyer la demande</h2>
          <p class="note">Rien n’est payé en ligne. La maison vous répond sous ${esc(K.delai_reponse || '48 heures')} pour confirmer la disponibilité, le délai, le prix, le paiement et la livraison.</p>
          <div class="champ"><label for="d-nom">Nom</label><input class="saisie" id="d-nom" name="nom" autocomplete="name" required></div>
          <div class="champ"><label for="d-mail">E-mail</label><input class="saisie" id="d-mail" name="email" type="email" autocomplete="email" required></div>
          <div class="champ"><label for="d-tel">Téléphone</label><input class="saisie" id="d-tel" name="telephone" type="tel" autocomplete="tel" inputmode="tel" required></div>
          <div class="champ"><label for="d-pays">Pays de livraison</label><input class="saisie" id="d-pays" name="pays" autocomplete="country-name" value="France"></div>
          <div class="champ"><label for="d-msg">Message <span class="fac">(facultatif)</span></label><textarea class="saisie" id="d-msg" name="message" rows="3"></textarea></div>
          <input type="checkbox" name="botcheck" class="piege" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="demande-erreur" role="alert" hidden></p>
          <button class="btn" type="button" data-envoyer>Envoyer la demande</button>
          <p class="note">Vos coordonnées servent uniquement à traiter cette demande. <a href="/confidentialite">Confidentialité</a></p>
        </form>
        <div class="demande-ok" tabindex="-1" hidden></div>`}
      </div>
    </div>
  </section>`,
  };
}

function pageInfo(C, D, k) {
  const P = D.pages[k];
  if (!D.pageVisible(k)) return null;
  const M = C.maison || {};
  const photos = (P.photos || []).filter(Boolean);
  let extra = '';
  if (k === 'tailles') extra = `<table class="tailles"><caption>Correspondance des tailles</caption><thead><tr><th scope="col">Taille</th><th scope="col">Tour de doigt</th><th scope="col">Diamètre intérieur</th></tr></thead><tbody>${TAILLES.map((n) => `<tr><td>${n}</td><td>${n} mm</td><td>${(n / Math.PI).toFixed(1).replace('.', ',')} mm</td></tr>`).join('')}</tbody></table>`;
  if (k === 'commande') extra = `<div class="contact" id="contact"><h2>Contact</h2>${M.email || M.telephone ? `<ul>${M.email ? `<li><a href="mailto:${esc(M.email)}">${esc(M.email)}</a></li>` : ''}${M.telephone ? `<li><a href="tel:${esc(String(M.telephone).replace(/[^\d+]/g, '').replace(/^0/, '+33'))}">${esc(M.telephone)}</a></li>` : ''}${M.adresse ? `<li>${esc(M.adresse)}, ${esc(M.code_postal || '')} ${esc((M.ville || '').replace(/ \d+e$/, ''))}</li>` : ''}</ul>` : `<p>Écrivez à la maison en envoyant une demande depuis le <a href="/panier">panier</a>, même sans pièce : précisez votre question dans le message.</p>`}</div>`;
  return {
    classe: 'p-info p-' + k, titre: P.titre,
    corps: `
  <section class="sec sec-haut">
    <div class="wrap info${photos.length ? ' avec-photos' : ''}">
      <div class="info-txt">
        <h1>${esc(P.titre)}</h1>
        ${texteRiche(P.texte, jetons(C))}

function rendrePage(C, chemin, o = {}) {
  const D = donnees(C);
  const [p0, requete = ''] = String(chemin || '/').split('?');
  const p = decodeURI(p0).replace(/\/+$/, '') || '/';
  const typeQ = (new URLSearchParams(requete).get('type') || '').slice(0, 60);
  let page = null, m;
  if (p === '/') page = accueil(C, D);
  else if (p === '/bijoux') page = pageListe(C, D, '');
  else if ((m = p.match(/^\/bijoux\/([a-z0-9-]+)$/))) page = pageListe(C, D, m[1]);
  else if ((m = p.match(/^\/collections\/([a-z0-9-]+)$/))) page = pageCollection(C, D, m[1], D.type(typeQ) ? typeQ : '');
  else if ((m = p.match(/^\/piece\/([a-z0-9-]+)$/))) page = pagePiece(C, D, m[1]);
  else if (p === '/panier') page = pagePanier(C);
  else if (p === '/mentions-legales') page = pageMentions(C);
  else if (p === '/confidentialite') page = pageConfidentialite(C);
  else { const k = Object.keys(PAGES).find((x) => PAGES[x] === p); if (k) page = pageInfo(C, D, k); }
  const statut = page ? 200 : 404;
  return { statut, html: document_(C, o, page || page404()) };
}

const empreinte = (t) => { let h = 5381; for (let i = 0; i < t.length; i += 7) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36) + t.length.toString(36); };

async function reduire(fichier, maxCote, qualite) {
  const url = URL.createObjectURL(fichier);
  try {
    const im = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('Photo illisible : essayez une autre.')); i.src = url; });
    const r = Math.min(1, maxCote / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.naturalWidth * r); cv.height = Math.round(im.naturalHeight * r);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', qualite));
  } finally { URL.revokeObjectURL(url); }
}

/* Contraste WCAG, pour prévenir quand une couleur de collection est trop claire */
function contraste(a, b) {
  const l = (h) => { const c = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };

}

        el('div', { class: 'grille' }, [{ k: 'mentions.raison_sociale', l: 'Raison sociale' }, { k: 'mentions.forme', l: 'Forme et capital', ph: 'Ex. : SAS au capital de 1 000 €' }, { k: 'mentions.siret', l: 'SIRET', mode: 'numeric' }, { k: 'mentions.adresse', l: 'Adresse du siège' }, { k: 'mentions.directeur_publication', l: 'Directeur de la publication' }, { k: 'mentions.email', l: 'E-mail de contact', type: 'email' }, { k: 'mentions.mediateur', l: 'Médiateur de la consommation', ph: 'Nom et site du médiateur' }].map((d) => champ(E.C, d))),
        champ(E.C, { k: 'credits_photos', l: 'Crédit des photos', ex: 'à vider quand les photos d’essai sont remplacées', t: 'zone' }),
      ],
    },
  ];
  return L;
}
let PANNEAUX = [];

/* ---------- Démonstration en un seul fichier : le site d'abord, puis l'espace maison ---------- */
const optsDemo = (extra) => ({ maquette: true, urlPolice: (f) => DEMO.polices[f] || '', css: DEMO.css, js: DEMO.js, apiCommande: '', apercu: true, ...extra });
let pageDemo = '/', panierDemo = [];
function vueSiteDemo() {
  let v = document.getElementById('demo-site');
  if (!v) {
    v = el('div', { id: 'demo-site', class: 'apercu-plein' },
      el('div', { class: 'barre' }, el('b', { text: 'Le site' }),
        el('button', { type: 'button', class: 'btn petit', text: 'Essayer l’espace maison', onclick: () => { v.hidden = true; document.body.style.overflow = ''; } })),
      el('iframe', { title: 'Le site' }));
    document.body.append(v);
  }
  /* le site tel qu'il est « en ligne » dans la démonstration : la dernière version enregistrée */
  v.querySelector('iframe').srcdoc = rendrePage(memo.lire('contenu', copie(DEMO.contenu)), pageDemo, optsDemo({ panierInitial: panierDemo })).html;
  v.hidden = false; document.body.style.overflow = 'hidden';
}
/* Les pages affichées dans un cadre (aperçu, démonstration) demandent à changer de page ou gardent leur panier */
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (!m.maison) return;
  const demo = document.getElementById('demo-site');
  const dansDemo = demo && e.source === demo.querySelector('iframe').contentWindow;
  if (m.maison === 'panier') { if (dansDemo) panierDemo = m.panier || []; else E.panierApercu = m.panier || []; return; }
  if (m.maison === 'aller' && typeof m.chemin === 'string') {
    if (dansDemo) { pageDemo = m.chemin; vueSiteDemo(); demo.querySelector('iframe').addEventListener('load', function f() { this.removeEventListener('load', f); try { this.contentWindow.scrollTo(0, 0); } catch (x) { /* rien */ } }); }
    else if (E.C) { E.page = m.chemin; rendreApercu(true); }
  }
});
let siteMontre = false;

/* ---------- Aperçu en direct ---------- */
let cadres = [];
function rendreApercu(enHaut) {
  assurerIds(E.C);
  const o = DEMO
    ? optsDemo({ panierInitial: E.panierApercu || [], calme: true })
    : { maquette: E.maquette, cssHref: '/assets/site.css', jsHref: '/assets/site.js', apiCommande: '', apercu: true, panierInitial: E.panierApercu || [], calme: true };
  const page = rendrePage(E.C, E.page || '/', o).html;
  cadres.forEach((f) => {
    let y = 0; try { y = enHaut ? 0 : f.contentWindow.scrollY; } catch (e) { /* rien */ }
    f.onload = () => { try { f.contentWindow.scrollTo(0, y); } catch (e) { /* rien */ } };
    f.srcdoc = page;
  });
}
let minuteur;
function changement() {
  majBarre(); majResumes();
  clearTimeout(minuteur); minuteur = setTimeout(rendreApercu, 450);
}
function majResumes() { PANNEAUX.forEach((p) => { const r = document.getElementById('res-' + p.id); if (r) r.textContent = p.resume(); }); }

/* ---------- Barre d'enregistrement ---------- */
let barre, etatBarre, bEnr, bAnn;
function majBarre() {
  const m = modifie();
  etatBarre.textContent = m ? 'Modifications non enregistrées' : 'Tout est enregistré';
  etatBarre.className = 'etat ' + (m ? 'modifie' : 'ok');
  bEnr.disabled = !m; bAnn.textContent = m ? 'Annuler' : 'Revenir en arrière'; bAnn.title = m ? 'Annuler les modifications non enregistrées' : 'Rétablir la version enregistrée juste avant';
}
async function enregistrer() {
  bEnr.disabled = true; bEnr.textContent = 'Enregistrement…';
  try {
    assurerIds(E.C);
    await api.enregistrer(E.C);
    E.base = JSON.stringify(E.C);
    toast(DEMO ? (memo.persiste ? 'Enregistré (démonstration : dans ce navigateur seulement).' : stockageOk ? 'Enregistré pour cette visite seulement : la mémoire du navigateur est pleine. Retirez des photos pour que ça reste.' : 'Enregistré pour cette visite seulement : cet aperçu ne garde rien après fermeture. Ouvrez le fichier dans un navigateur pour garder vos essais.') : 'Enregistré. Le site est à jour d’ici une minute.');
  } catch (x) {
    if (x.session) { toast('Session expirée : reconnectez-vous, vos modifications sont gardées.'); memo.ecrire('brouillon', E.C); ecranConnexion(x.message); return; }
    toast(x.message);
  }
  bEnr.textContent = 'Enregistrer'; majBarre();
}
async function annuler() {
  if (modifie()) { E.C = JSON.parse(E.base); dessinerEditeur(); rendreApercu(); toast('Modifications annulées.'); return; }
  if (!bAnn.classList.contains('confirmer')) { bAnn.classList.add('confirmer'); bAnn.textContent = 'Confirmer'; setTimeout(() => { bAnn.classList.remove('confirmer'); majBarre(); }, 4000); return; }
  bAnn.classList.remove('confirmer');
  try { E.C = await api.annuler(); E.base = JSON.stringify(E.C); dessinerEditeur(); rendreApercu(); toast('Version précédente rétablie.'); } catch (x) { toast(x.message); }
  majBarre();
}

/* ---------- Écran principal ---------- */
let editeur;
function dessinerEditeur() {
  editeur.replaceChildren(
    el('section', { class: 'intro-edit' },
      el('h1', { text: 'Bonjour' }),
      el('p', { class: 'aide', text: 'Touchez une rubrique pour la modifier, puis « Enregistrer » en bas de l’écran. L’aperçu montre le résultat avant d’enregistrer.' })),
    ...PANNEAUX.map((p) => {
      const d = el('details', { class: 'pan', id: 'pan-' + p.id, open: E.ouverts.has(p.id) },
        el('summary', {}, el('h2', { text: p.titre }), el('span', { class: 'resume', id: 'res-' + p.id, text: p.resume() }), el('span', { class: 'chev', 'aria-hidden': 'true' })));
      let rempli = false;
      const remplir = () => { if (rempli) return; rempli = true; d.append(el('div', { class: 'pan-corps' }, p.corps())); };
      if (d.open) remplir();
      d.addEventListener('toggle', () => { if (d.open) { remplir(); E.ouverts.add(p.id); if (p.page) montrer(p.page); } else E.ouverts.delete(p.id); });
      return d;
    }));
}

function ecranPrincipal() {
  racine.replaceChildren();
  const nom = E.C.maison.nom || 'Votre maison';
  document.title = nom + ' : espace maison';
  PANNEAUX = panneaux();
  appliquerTheme(E.C);
  const plein = el('div', { class: 'apercu-plein', hidden: true },
    el('div', { class: 'barre' }, el('b', { text: 'Aperçu' }), el('button', { type: 'button', class: 'btn sec petit', text: 'Fermer l’aperçu', onclick: () => { plein.hidden = true; document.body.style.overflow = ''; } })),
    el('iframe', { title: 'Aperçu du site', sandbox: 'allow-scripts allow-same-origin allow-popups' }));
  editeur = el('div', { class: 'editeur' });
  const colonne = el('aside', { class: 'apercu-col', 'aria-label': 'Aperçu du site' },
    el('div', { class: 'tel-cadre' }, el('p', { text: 'Aperçu, tel que sur un téléphone' }), el('iframe', { title: 'Aperçu du site', sandbox: 'allow-scripts allow-same-origin allow-popups' })));
  cadres = [colonne.querySelector('iframe'), plein.querySelector('iframe')];

  etatBarre = el('span', { class: 'etat' });
  bEnr = el('button', { type: 'button', class: 'btn', text: 'Enregistrer', onclick: enregistrer });
  bAnn = el('button', { type: 'button', class: 'btn danger', onclick: annuler });
  barre = el('div', { class: 'barre-enr' }, el('div', { class: 'in' }, etatBarre,
    el('button', { type: 'button', class: 'btn sec btn-apercu', text: 'Aperçu', onclick: () => { plein.hidden = false; document.body.style.overflow = 'hidden'; rendreApercu(); } }),
    bAnn, bEnr));

  racine.append(
    el('header', { class: 'haut' }, el('div', { class: 'haut-in' },
      el('div', { class: 'haut-titre' }, el('b', { text: nom }), el('span', { text: 'Espace maison' })),
      el('a', { class: 'btn', href: DEMO ? '#' : '/', target: DEMO ? null : '_blank', rel: 'noopener', text: 'Voir le site', onclick: DEMO ? (e) => { e.preventDefault(); plein.hidden = false; rendreApercu(); } : null }),
      el('button', { type: 'button', class: 'btn', text: 'Se déconnecter', onclick: async () => { if (modifie() && !confirm2()) return; await api.deconnexion(); ecranConnexion(); } }))),
    DEMO ? el('p', { class: 'bandeau', text: 'Démonstration : vos essais restent sur ce téléphone, rien n’est publié.' })
      : (E.maquette ? el('p', { class: 'bandeau', text: 'Le site est encore en mode proposition : les demandes ne sont pas envoyées.' }) : null),
    el('div', { class: 'cadre' }, editeur, colonne), barre, plein);
  dessinerEditeur(); majBarre(); rendreApercu();
  api.commandes().then((L) => { E.nouvelles = L.filter((c) => c.statut === 'nouvelle').length; majResumes(); }).catch(() => {});
}
let avertiDeco = false;
function confirm2() { if (avertiDeco) return true; avertiDeco = true; toast('Des modifications ne sont pas enregistrées. Touchez encore « Se déconnecter » pour les abandonner.'); return false; }

function normaliser(C) {
  ['maison', 'annonce', 'accueil', 'pages', 'commandes', 'mentions', 'theme'].forEach((k) => { if (!C[k] || typeof C[k] !== 'object') C[k] = {}; });
  ['collections', 'types', 'pieces'].forEach((k) => { if (!Array.isArray(C[k])) C[k] = []; });
  Object.keys(PAGES).forEach((k) => { C.pages[k] = Object.assign({ afficher: false, titre: k, texte: '', photos: [] }, C.pages[k] || {}); });
  C.pieces.forEach((x) => { if (!Array.isArray(x.photos)) x.photos = x.photos ? [x.photos] : []; });
  return C;
}
function appliquerTheme(C) {
  let st = document.getElementById('theme-boutique');
  if (!st) { st = el('style', { id: 'theme-boutique' }); document.head.append(st); }
  st.textContent = cssPolices(DEMO ? (f) => DEMO.polices[f] || '' : (f) => '/fonts/' + f) + '\n:root{--bleu:#161616;--bleu-fonce:#000000;--bleu-pale:#f1ede6;--paille:#ece3cf}';
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', '#161616');
  const icone = document.querySelector('link[rel=icon]'); if (icone && C && (C.maison || C.logo)) icone.setAttribute('href', favicon(C.maison ? C : { maison: { logo: C.logo } }));
}
async function demarrer() {
  try {
    const r = await api.charger();
    if (!r) { ecranConnexion(); return; }
    const brouillon = memo.lire('brouillon', null);
    E.C = normaliser(r.contenu); E.base = JSON.stringify(E.C); E.maquette = !!r.maquette;
    if (brouillon && !DEMO) { E.C = normaliser(brouillon); memo.ecrire('brouillon', null); toast('Vos modifications non enregistrées ont été récupérées.'); }
    ecranPrincipal();
  } catch (x) {
    racine.replaceChildren(el('main', { class: 'connexion' }, el('div', { class: 'erreur', text: 'Impossible de charger l’espace boutique : ' + x.message + ' Vérifiez la connexion internet et rechargez la page.' })));
  } finally {
    /* démonstration : on montre d'abord le site, une seule fois */
    if (DEMO && DEMO.siteDabord && !siteMontre) { siteMontre = true; vueSiteDemo(); }
  }
}

window.addEventListener('beforeunload', (e) => { if (E.C && modifie()) { e.preventDefault(); e.returnValue = ''; } });
demarrer();

</script>
