<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7a1f2b">
<title>La Cuillère Haute : démonstration</title>
<style>
/* Espace boutique : mêmes couleurs et polices que le site (bleu de la devanture, blanc, Vollkorn + Source Sans 3). */
:root{
  --bleu:#46667f;--bleu-fonce:#2f4b61;--bleu-pale:#edf2f5;
  --encre:#1f2328;--gris:#5a6470;--trait:#d7dee4;--fond:#f6f8f9;--blanc:#fff;
  --paille:#efd58b;--ok:#2f6b45;--ok-pale:#e3f1e7;--alerte:#8a2c22;--alerte-pale:#fbecea;
  --titres:"Vollkorn",Georgia,serif;--texte:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --r:6px;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:400 1.0625rem/1.5 var(--texte)}
h1,h2,h3{font-family:var(--titres);font-weight:600;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--bleu-fonce)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:2px solid var(--bleu);background:var(--bleu);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}
.btn.sec{background:#fff;color:var(--bleu-fonce)}
.btn.sec:hover{background:var(--bleu-pale)}
.btn.discret{background:transparent;border-color:transparent;color:var(--bleu-fonce);padding:0 10px}
.btn.discret:hover{background:var(--bleu-pale)}
.btn.danger{background:#fff;border-color:#e2b8b2;color:var(--alerte)}
.btn.danger.confirmer{background:var(--alerte);border-color:var(--alerte);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.petit{min-height:36px;padding:0 12px;font-size:.9375rem}

/* Connexion */
.connexion{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px}
.connexion form{width:100%;max-width:380px;background:#fff;border:1px solid var(--trait);border-radius:10px;padding:28px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.connexion .btn{white-space:normal;text-align:center}
.connexion h1{font-size:1.625rem}
.connexion .sous{color:var(--gris);margin-top:-8px}
.mdp{display:flex;border:1px solid #b6c1ca;border-radius:var(--r);overflow:hidden;background:#fff}
.mdp input{flex:1;border:0;padding:12px;min-width:0}
.mdp input:focus{outline:none}
.mdp:focus-within{outline:2px solid var(--bleu);outline-offset:1px}
.mdp button{border:0;background:var(--bleu-pale);padding:0 12px;cursor:pointer;color:var(--bleu-fonce);font-weight:600;font-size:.9375rem}
.erreur{background:var(--alerte-pale);color:var(--alerte);border-radius:var(--r);padding:10px 12px}
.aide{color:var(--gris);font-size:.9375rem}

/* Barre du haut */
.haut{position:sticky;top:0;z-index:30;background:var(--bleu);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.haut-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.haut-titre{margin-right:auto;min-width:0;overflow:hidden}
.haut-titre b{display:block;font:600 1.25rem/1.15 var(--titres);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.haut-titre span{display:block;font-size:.875rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.haut .btn{border-color:rgba(255,255,255,.7);background:transparent;color:#fff;min-height:38px;padding:0 12px;font-size:.9375rem}
.haut .btn:hover{background:rgba(255,255,255,.14)}
.bandeau{background:var(--paille);color:var(--encre);text-align:center;font-size:.9375rem;padding:8px 16px}

/* Mise en page : éditeur + aperçu */
.cadre{max-width:1320px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:24px}
.editeur{display:grid;gap:12px;min-width:0;align-content:start}
.apercu-col{display:none}
@media (min-width:1080px){
  .cadre{grid-template-columns:minmax(0,1fr) 420px}
  .apercu-col{display:block;position:sticky;top:84px;height:calc(100svh - 104px)}
  .btn-apercu{display:none}
}
.apercu-col .tel-cadre{height:100%;border:1px solid var(--trait);border-radius:18px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.apercu-col .tel-cadre p{font-size:.8125rem;color:var(--gris);padding:8px 12px;border-bottom:1px solid var(--trait);background:var(--fond)}
.apercu-col iframe,.apercu-plein iframe{flex:1;width:100%;border:0;background:#fff}
.apercu-plein{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.apercu-plein .barre{display:flex;justify-content:space-between;align-items:center;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--trait)}

.intro-edit{background:#fff;border:1px solid var(--trait);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.intro-edit h1{font-size:1.5rem}

/* Panneaux */
details.pan{background:#fff;border:1px solid var(--trait);border-radius:10px}
details.pan>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:16px 18px}
details.pan>summary::-webkit-details-marker,details.item>summary::-webkit-details-marker{display:none}
details.pan>summary h2{font-size:1.3125rem}
details.pan>summary .resume{grid-column:1;color:var(--gris);font-size:.9375rem;min-width:0;overflow-wrap:anywhere}
details.pan>summary .chev{grid-row:1/span 2;grid-column:2}
.chev{width:30px;height:30px;border:1px solid var(--trait);border-radius:var(--r);display:grid;place-items:center}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.pan-corps{padding:0 18px 20px;display:grid;gap:16px;min-width:0}
.pastille{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8125rem;font-weight:600;background:var(--paille);color:var(--encre);margin-left:6px;vertical-align:2px}

/* Champs */
.champ{display:grid;gap:6px;min-width:0}
.champ>label,.champ>.lab{font-weight:600}
.champ .ex{font-weight:400;color:var(--gris);font-size:.9375rem}
.saisie{width:100%;min-height:46px;padding:10px 12px;border:1px solid #b6c1ca;border-radius:var(--r);background:#fff}
.saisie:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}
textarea.saisie{min-height:90px;resize:vertical;line-height:1.45}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;user-select:none}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .rail{width:46px;height:28px;border-radius:999px;background:#c5ced5;position:relative;transition:background .15s;flex:none}
.interrupteur .rail::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.interrupteur input:checked+.rail{background:var(--ok)}
.interrupteur input:checked+.rail::after{transform:translateX(18px)}
.interrupteur input:focus-visible+.rail{outline:2px solid var(--bleu);outline-offset:2px}

/* Photo */
.photo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.photo .vignette{width:96px;height:72px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;border:1px solid var(--trait)}
.photo .actions{display:flex;flex-wrap:wrap;gap:8px}
.photo input[type=file]{position:absolute;opacity:0;width:1px;height:1px}

/* Listes (fromages, plateaux…) */
.liste{display:grid;gap:8px}
details.item{border:1px solid var(--trait);border-radius:8px;background:#fff}
details.item[open]{border-color:var(--bleu)}
details.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px}
details.item>summary .mini{width:44px;height:44px;border-radius:var(--r);background:var(--bleu-pale) center/cover no-repeat;flex:none}
details.item>summary .txt{flex:1;min-width:0}
details.item>summary::after{content:"";flex:none;width:8px;height:8px;margin-right:4px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.item[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.item>summary b{display:block;font:500 1.125rem/1.25 var(--titres);overflow-wrap:anywhere}
details.item>summary span.s{display:block;color:var(--gris);font-size:.9375rem;overflow-wrap:anywhere}
.item-corps{padding:4px 12px 14px;display:grid;gap:14px;border-top:1px solid var(--trait);padding-top:14px}
.item-outils{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.item-outils .ordre{display:flex;gap:6px}
.ajouter{justify-self:start}

/* Horaires */
.jours{display:grid;gap:0;border-top:1px solid var(--trait)}
.jour{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--trait)}
.jour .nomj{font-weight:600;padding-top:8px;text-transform:capitalize}
.plages{display:grid;gap:8px}
.plage{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.plage input{width:auto;min-width:118px;min-height:44px}
.plage span{color:var(--gris)}
.ferme{color:var(--gris);padding-top:8px}
@media (max-width:520px){.jour{grid-template-columns:minmax(0,1fr)}.jour .nomj{padding-top:0}}

/* Commandes reçues */
.cmds{display:grid;gap:10px}
.cmd{border:1px solid var(--trait);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.cmd.nouvelle{border-color:#d9b24a;background:#fffbef}
.cmd-tete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.cmd-tete b{font:600 1.125rem/1.25 var(--titres)}
.cmd dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.cmd dt{color:var(--gris)}
.cmd dd{margin:0;overflow-wrap:anywhere}
.statuts{display:flex;flex-wrap:wrap;gap:6px}
.statuts button{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:5px 12px;font-size:.875rem;cursor:pointer}
.statuts button[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff;font-weight:600}
.etiquette{font-size:.8125rem;font-weight:600;border-radius:999px;padding:2px 10px}
.etiquette.nouvelle{background:var(--paille)}
.etiquette.confirmee{background:var(--bleu-pale);color:var(--bleu-fonce)}
.etiquette.retiree{background:var(--ok-pale);color:var(--ok)}
.etiquette.annulee{background:#eceef0;color:var(--gris)}
.vide{padding:16px;border:1px dashed var(--trait);border-radius:8px;color:var(--gris);text-align:center}

/* Barre d'enregistrement */
.barre-enr{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--trait);box-shadow:0 -4px 16px rgba(31,35,40,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barre-enr .in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.barre-enr .etat{margin-right:auto;font-weight:600}
.barre-enr .etat.modifie{color:#7a5a00}
.barre-enr .etat.ok{color:var(--ok)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--encre);color:#fff;border-radius:8px;padding:10px 16px;font-size:.9375rem;max-width:calc(100vw - 32px)}
@media (max-width:600px){.barre-enr .etat{flex-basis:100%;font-size:.875rem}.barre-enr .in .btn{flex:1 1 0;padding:4px 6px;min-width:0;white-space:normal;line-height:1.15;font-size:.9375rem;text-align:center}.haut-in .btn{padding:0 8px;font-size:.8125rem;min-height:36px}.haut-titre b{font-size:1.0625rem;white-space:normal;line-height:1.1}.haut-titre span{font-size:.8125rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Vidéo de fond */
.video-champ{display:grid;gap:12px}
.video-apercu video{width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000;display:block}
.video-champ .saisie{margin-top:8px}
.bandeau button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
.apercu-plein .barre-titre{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.apercu-plein .barre-titre a{font-size:.9375rem;color:inherit}
.apercu-plein .barre{flex-wrap:wrap;gap:8px 16px}
/* Champ de fichier (vidéo de fond) : jamais plus large que l'écran */
.champ input[type=file]{max-width:100%}
.champ{min-width:0}

</style>
<style>.apercu-plein .barre{background:#2a1a0f;color:#ece6d6;border-bottom:0}
.apercu-plein .barre a:not(.btn){color:#ece6d6}
</style></head>

-visible{outline-color:#fff}\r\n\r\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:2px solid var(--bleu);border-radius:var(--r);background:var(--bleu);color:#fff;font:600 1.0625rem/1 var(--texte);text-decoration:none;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap}\r\n.btn:hover{background:var(--bleu-fonce);border-color:var(--bleu-fonce)}\r\n.btn-contour{background:transparent;color:var(--bleu-fonce)}\r\n.btn-contour:hover{background:var(--bleu-pale);color:var(--bleu-fonce)}\r\n.btn-blanc{background:#fff;border-color:#fff;color:var(--bleu-fonce)}\r\n.btn-blanc:hover{background:var(--bleu-pale);border-color:var(--bleu-pale)}\r\n.btn-clair{background:transparent;border-color:rgba(255,255,255,.85);color:#fff}\r\n.btn-clair:hover{background:rgba(255,255,255,.14);border-color:#fff}\r\n\r\n.maquette{background:#eef0f2;color:#444c55;font-size:.875rem;line-height:1.4;padding:8px var(--gut);text-align:center}\r\n.annonce{background:var(--paille);color:var(--sur-accent,var(--encre));text-align:center;padding:11px var(--gut);font-weight:600;font-size:1rem}\r\n\r\n/* En-tête posé sur la photo d'accueil */\r\n.top{position:absolute;top:0;left:0;right:0;z-index:3;color:#fff}\r\n.top .wrap{display:flex;align-items:center;gap:28px;min-height:84px}\r\n.nom{font:600 1.375rem/1.1 var(--titres);color:#fff;text-decoration:none;margin-right:auto;padding:12px 0}\r\n.nav{display:flex;gap:26px}\r\n.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:1rem;padding:6px 0;border-bottom:2px solid transparent}\r\n.nav a:hover{border-bottom-color:rgba(255,255,255,.7)}\r\n.top .tel{color:#fff;font-weight:600;text-decoration:none;border:2px solid rgba(255,255,255,.75);border-radius:var(--r);padding:9px 14px;white-space:nowrap}\r\n.top .tel:hover{background:rgba(255,255,255,.12)}\r\n.menu-btn{display:none;background:transparent;border:2px solid rgba(255,255,255,.75);border-radius:var(--r);color:#fff;font:600 1rem/1 var(--texte);padding:10px 14px;cursor:pointer}\r\n\r\n/* Accueil */\r\n.hero{position:relative;z-index:2;isolation:isolate;min-height:min(86svh,860px);display:flex;align-items:flex-end;color:#fff;background:var(--bleu-fonce)}\r\n.hero:not(:has(>img,>video)){min-height:0}\r\n.hero>img,.hero>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}\r\n.hero::after{content:\"\";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,26,32,.55) 0%,rgba(20,26,32,0) 26%,rgba(20,26,32,0) 42%,rgba(20,26,32,.76) 100%)}\r\n.hero-body{width:100%;padding-top:140px;padding-bottom:clamp(36px,6vw,72px)}\r\n.hero h1{color:#fff;font-size:clamp(2rem,4.2vw,3.25rem);max-width:18ch;line-height:1.1}\r\n.hero-body>p{max-width:52ch;margin:16px 0 0;font-size:1.0625rem;color:rgba(255,255,255,.93)}\r\n.hero .statut{margin-top:16px;font-weight:600}\r\n.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}\r\n[data-statut][hidden]{display:none}\r\n\r\n/* Sections */\r\n.sec{padding:clamp(64px,9vw,112px) 0}\r\n.alt{background:var(--bleu-pale)}\r\n.sec h2{font-size:clamp(1.625rem,2.7vw,2.125rem)}\r\n.sec .intro{max-width:56ch;margin-top:14px;color:var(--gris)}\r\n\r\n.about{display:grid;gap:40px}\r\n.about .ph-main{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);background:var(--bleu-pale)}\r\n.about .txt h2{margin-bottom:22px}\r\n.about .txt p{max-width:50ch;margin-bottom:1em}\r\n.about .ph-small{width:60%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);margin:32px 0 0 auto;background:var(--bleu-pale)}\r\n\r\n.ctr{display:grid;gap:44px}\r\n.sans-photo{max-width:860px}\r\n.ctr .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);background:var(--trait)}\r\n.famille{margin-top:28px}\r\n.famille+.famille{margin-top:8px}\r\nsummary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px}\r\nsummary::-webkit-details-marker{display:none r) minmax(0,.75fr);gap:72px;align-items:start}\r\n  .ctr .ph{position:sticky;top:28px;margin-top:6px}\r\n  .about.sans-photo,.ctr.sans-photo{grid-template-columns:minmax(0,1fr)}\r\n  .plateaux .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:end}\r\n  .presse-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px}\r\n  .visit{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px}\r\n  .foot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}\r\n}\r\n@media (max-width:960px){\r\n  .nav,.top .tel{display:none}\r\n  .menu-btn{display:inline-flex}\r\n}\r\n@media (max-width:720px){\r\n  body{font-size:1rem;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}\r\n  .top .wrap{min-height:72px}\r\n  .nom{font-size:1.25rem}\r\n  .hero{min-height:min(84svh,760px)}\r\n  .hero-body{padding-top:120px}\r\n  .hero .actions .btn{flex:1 1 140px}\r\n  .about .ph-small{width:72%}\r\n  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--trait);transition:transform .25s ease}\r\n  html.js .bar:not(.on){transform:translateY(110%)}\r\n}\r\n/* Commande de plateaux */\r\n.cmd{display:grid;gap:36px}\r\n.cmd-etapes{margin:22px 0 0;padding-left:1.3em;display:grid;gap:8px;max-width:44ch}\r\n.cmd-etapes li::marker{font-family:var(--titres);font-weight:600;color:var(--bleu)}\r\n.cmd-intro .hnote{max-width:44ch}\r\n.hnote a{white-space:nowrap}\r\n.cmd-form,.cmd-ok{background:#fff;border:1px solid var(--trait);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:grid;gap:18px}\r\n.cmd-form[hidden],.cmd-ok[hidden]{display:none}\r\n.cmd-form fieldset{border:0;margin:0;padding:0;min-width:0}\r\n.cmd-form legend{font-weight:600;padding:0;margin-bottom:10px}\r\n.choix-liste{display:grid;gap:10px}\r\n.choix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s,background-color .15s}\r\n.choix:hover{border-color:var(--bleu)}\r\n.choix input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--bleu)}\r\n.choix:has(input:checked){border-color:var(--bleu);background:var(--bleu-pale);box-shadow:inset 0 0 0 1px var(--bleu)}\r\n.choix-txt{display:grid;gap:3px;min-width:0}\r\n.choix-txt b{font:500 1.125rem/1.3 var(--titres)}\r\n.choix-txt span{color:var(--gris);font-size:1rem;line-height:1.45}\r\n.choix-txt em{font-style:normal;font-weight:600;font-size:.9375rem;color:var(--bleu-fonce)}\r\n.cmd-ligne{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}\r\n.champ-bloc{display:grid;gap:6px;min-width:0}\r\n.champ-bloc>label{font-weight:600;font-size:1rem}\r\n.fac{font-weight:400;color:var(--gris)}\r\n.saisie{width:100%;min-height:48px;padding:10px 12px;border:1px solid #b6c1ca;border-radius:var(--r);background:#fff;font:inherit;color:var(--encre)}\r\n.saisie:focus{outline:2px solid var(--bleu);outline-offset:1px;border-color:var(--bleu)}\r\n.saisie:disabled{background:var(--bleu-pale);color:var(--gris)}\r\ntextarea.saisie{min-height:96px;resize:vertical;line-height:1.45}\r\n.stepper{display:inline-flex;border:1px solid #b6c1ca;border-radius:var(--r);overflow:hidden;width:max-content}\r\n.stepper button{width:48px;min-height:48px;border:0;background:var(--bleu-pale);color:var(--bleu-fonce);font:600 1.375rem/1 var(--texte);cursor:pointer}\r\n.stepper button:hover{background:#dde7ee}\r\n.stepper input{width:64px;border:0;border-inline:1px solid #b6c1ca;text-align:center;font:600 1.125rem var(--texte);color:var(--encre);-moz-appearance:textfield;appearance:textfield}\r\n.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}\r\n.estimation{font-weight:600;color:var(--bleu-fonce);align-self:center}\r\n.estimation[hidden]{display:none}\r\n.cmd-info{color:var(--gris);font-size:1rem;margin-top:-8px}\r\n.cmd-erreur{background:#fbecea;color:#8a2c22;border-radius:var(--r);padding:12px 14px}\r\n.cmd-erreur[hidden]{display:none}\r\n.cmd-erreur a{color:inherit;font-weight:600}\r\n.cmd-envoyer{width:100%;min-height:54px;font-size:1.125rem}\r\n.cmd-envoyer:disabled{opacity:.7;cursor:progress}\r\n.cmd-rgpd{font-size:.875rem;color:var(--gris);margin-top:-6px}\r\n.piege{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}\r\n.cmd-ok{border-color:var(--bleu)}\r\n.cmd-ok h3{font-size:1.375rem}\r\n.cmd-ok p{color:var(--gris)}\r\n.recap{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:0;padding:14px 0;border-block:1px solid var(--trait)}\r\n.recap dt{color:var(--gris)}\r\n.recap dd{margin:0;min-width:0;overflow-wrap:anywhere}\r\n@media (min-width:900px){.cmd{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px;align-items:start}.cmd-intro{position:sticky;top:28px}}\r\n@media (max-width:480px){.recap{grid-template-columns:minmax(0,1fr)}.recap dd{margin-bottom:6px}}\r\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}\r\n\r\n/* ---------- Variantes de mise en page (contenu.theme : accueil, titres, angles, offres_fond) ---------- */\r\n.angles-droits{--r:0px}\r\n.titres-filet .sec h2::before{content:\"\";display:block;width:44px;height:3px;background:var(--bleu);margin-bottom:18px}\r\n.titres-filet .plateaux h2::before{background:rgba(255,255,255,.85)}\r\n\r\n/* Accueil « partage » : texte sur la couleur de la boutique, photo à côté */\r\n.hero.hero-partage{display:block;min-height:0;background:var(--bleu-fonce)}\r\n.hero.hero-partage::after,.hero.hero-sobre::after{display:none}\r\n.hero-partage .top,.hero-sobre .top{position:static}\r\n.hero-grille{display:grid;gap:32px;padding-bottom:clamp(40px,6vw,80px)}\r\n.hero-partage .hero-body{padding:clamp(8px,3vw,32px) 0 0}\r\n.hero-photo{position:relative}\r\n.hero-photo img,.hero-photo video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:var(--bleu)}\r\n\r\n/* Accueil « sobre » : fond clair, sans grande photo */\r\n.hero.hero-sobre{display:block;min-height:0;background:var(--bleu-pale);color:var(--encre);border-bottom:1px solid var(--trait)}\r\n.hero-sobre .nom,.hero-sobre .nav a{color:var(--bleu-fonce)}\r\n.hero-sobre .nav a:hover{border-bottom-color:var(--bleu)}\r\n.hero-sobre .top .tel,.hero-sobre .menu-btn{border-color:var(--bleu);color:var(--bleu-fonce)}\r\n.hero-sobre .top .tel:hover{background:#fff}\r\n.hero-sobre h1{color:var(--encre)}\r\n.hero-sobre .hero-body{padding-top:clamp(28px,6vw,72px)}\r\n.hero-sobre .hero-body>p{color:var(--encre)}\r\n.hero-sobre .statut{color:var(--bleu-fonce)}\r\n\r\n/* Offres sur fond clair, photo dans la colonne */\r\n.offres-clair .grid{display:grid;gap:40px}\r\n.offres-clair .pl li{border-bottom-color:var(--trait)}\r\n.offres-clair .pl li:first-child{border-top-color:var(--trait)}\r\n.offres-clair .pl span:last-child{color:var(--gris)}\r\n.offres-clair .ph-offre{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);margin-top:32px;background:var(--trait)}\r\n\r\n@media (min-width:900px){\r\n  .hero-grille{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:64px;align-items:center}\r\n  .hero-grille.sans-photo{grid-template-columns:minmax(0,1fr)}\r\n  .hero-photo img,.hero-photo video{aspect-ratio:4/5;max-height:620px}\r\n  .offres-clair .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:start}\r\n}\r\n@media (max-width:720px){\r\n  .hero-partage .hero-body,.hero-sobre .hero-body{padding-top:20px}\r\n}\r\n\r\n/* Vidéo de fond : bouton pause (obligatoire pour l'accessibilité d'une image qui bouge) */\r\n.video-pause{position:absolute;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.28);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}\r\n.video-pause:hover{background:rgba(0,0,0,.45)}\r\n.video-pause svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\r\n\r\n/* Mouvement discret (rien si le visiteur demande moins d'animations, ni dans l'aperçu de l'espace boutique) */\r\n.anime .rev{opacity:0;transform:translateY(16px);transition-property:opacity,transform;transition-duration:1s;transition-timing-function:cubic-bezier(.2,.65,.2,1)}\r\n.anime .rev.vu{opacity:1;transform:none}\r\n.anime .hero-body > *,.anime .hero-photo{animation:monte 1s cubic-bezier(.2,.65,.2,1) both}\r\n.anime .hero-body > :nth-child(2){animation-delay:.1s}\r\n.anime .hero-body > :nth-child(n+3){animation-delay:.2s}\r\n.anime .hero-photo{animation-name:fondu;animation-duration:1.4s}\r\n@keyframes monte{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\r\n@keyframes fondu{from{opacity:0}to{opacity:1}}\r\n.sheet:not([hidden]){animation:fondu .3s ease both}\r\n@media (prefers-reduced-motion:reduce){.anime .rev{opacity:1;transform:none}.hero-body>*,.hero-photo,.sheet{animation:none!important}}\r\n\r\n/* ---------- Gabarits (theme.gabarit) : atelier, depannage, carte, marche ----------\r\n   Chaque gabarit a sa propre structure (voir rendu.js) ; ici sa mise en page.\r\n   Les couleurs viennent toujours du thème : --bleu (couleur), --bleu-fonce, --bleu-pale, --paille (accent). */\r\n.illus{position:absolute;left:10px;bottom:10px;z-index:2;background:rgba(255,255,255,.94);color:#1f2328;font:600 .875rem/1 var(--texte);padding:6px 9px;border-radius:2px}\r\n.g-atelier figure,.g-depannage figure,.g-carte figure,.g-marche figure{position:relative;margin:0}\r\n.g-tete .wrap{display:flex;align-items:center;gap:24px}\r\n.g-nom{font:600 1.375rem/1.1 var(--titres);color:inherit;text-decoration:none;margin-right:auto;padding:10px 0}\r\n.g-nav{display:none;gap:26px}\r\n.g-nav a{color:inherit;text-decoration:none;font-weight:600;padding:6px 0;border-bottom:2px solid transparent}\r\n.g-nav a:hover{border-bottom-color:currentColor}\r\n.g-cta{display:none;align-items:center;justify-content:center;min-height:44px;padding:0 20px;text-decoration:none;font-weight:600;white-space:nowrap}\r\n.g-tete .menu-btn{color:inherit;border-color:currentColor}\r\n@media (min-width:961px){.g-nav{display:flex}.g-cta{display:inline-flex}}\r\n.a-hero,.d-hero,.c-hero,.m-hero{display:block;min-height:0;isolation:auto;color:var(--encre);background:none}\r\n.a-hero::after,.d-hero::after,.c-hero::after,.m-hero::after{display:none}\r\n.hero .statut{font-weight:600}\r\n.g-horaires-grille{display:grid;gap:40px}\r\n.g-horaires-i{display:grid;gap:22px;align-content:start}\r\n.g-horaires-i h3{font:600 1rem/1.3 var(--texte);margin-bottom:4px;color:var(--gris)}\r\n.g-horaires-i .gros{font:500 1.3125rem/1.3 var(--titres);color:var(--encre);text-decoration:none}\r\n.g-horaires .hours{margin-top:22px}\r\n.g-horaires .statut{margin-top:14px;font-weight:600}\r\n@media (min-width:900px){.g-horaires-grille{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px}}\r\n\r\n/* ===== Atelier : artisan (index numéroté, tiroirs, photo qui déborde) ===== */\r\n.g-atelier{background:var(--bleu-pale);--r:0px}\r\n.g-atelier h1,.g-atelier h2,.g-atelier h3{font-weight:700}\r\n.a-tete{border-bottom:3px solid var(--encre)}\r\n.a-tete .wrap{min-height:76px}\r\n.a-tete .g-nom{font:700 1.5rem/1 var(--titres);color:var(--bleu-fonce)}\r\n.a-tete .g-nav a{color:var(--encre)}\r\n.a-tete .g-cta{background:var(--bleu-fonce);color:#fff}\r\n.a-tete .g-cta:hover{background:var(--encre)}\r\n.a-tete .menu-btn{color:var(--bleu-fonce)}\r\n.a-hero-grille{display:grid;gap:32px;padding-top:clamp(28px,6vw,72px);padding-bottom:clamp(36px,6vw,72px)}\r\n.a-genre{display:inline-block;font:600 1rem/1.2 var(--texte);color:var(--bleu-fonce);border-top:3px solid var(--bleu-fonce);padding-top:10px;margin-bottom:22px}\r\n.a-hero h1{color:var(--encre);font:700 clamp(2.5rem,7vw,5.25rem)/.98 var(--titres);letter-spacing:-.01em;max-width:11ch}\r\n.a-hero-txt>p:not(.a-genre):not(.statut){max-width:44ch;margin-top:22px;font-size:1.1875rem}\r\n.a-hero .statut{margin-top:18px;color:var(--bleu-fonce)}\r\n.a-hero-fig img{width:100%;aspect-ratio:4/5;max-height:640px;object-fit:cover;background:var(--trait)}\r\n.a-hero-grille.sans-photo{max-width:860px}\r\n.g-atelier .actions .btn-contour{color:var(--bleu-fonce);border-color:var(--bleu-fonce)}\r\n.g-atelier .actions .btn-contour:hover{background:#fff}\r\n.g-atelier main>.sec:first-child{padding-top:clamp(64px,9vw,112px)}\r\n@media (min-width:900px){\r\n  .a-hero-grille{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:end;padding-bottom:0}\r\n  .a-hero-txt{padding-bottom:clamp(48px,6vw,80px)}\r\n  .a-hero-fig{position:relative;z-index:2;margin-bottom:-96px}\r\n  .g-atelier main>.sec:first-child{padding-top:calc(clamp(64px,9vw,112px) + 96px)}\r\n}\r\n.g-atelier #boutique .about{display:grid;gap:36px}\r\n.g-atelier #boutique .txt{order:-1}\r\n.g-atelier #boutique .txt p{font-size:1.25rem;line-height:1.6;max-width:36ch}\r\n.g-atelier #boutique .ph-main{aspect-ratio:3/4}\r\n.g-atelier #boutique h2{font:700 clamp(2rem,4vw,3rem)/1.05 var(--titres)}\r\n.g-atelier #boutique h2::before{content:\"\";display:block;width:56px;height:6px;background:var(--bleu);margin-bottom:20px}\r\n.a-index{background:#fff}\r\n.a-index-tete{display:grid;gap:24px;margin-bottom:36px;align-content:start}\r\n.a-index h2,.a-travaux h2{font-size:clamp(2rem,4.2vw,3rem);line-height:1.05}\r\n.a-index-fig img{width:100%;aspect-ratio:3/2;object-fit:cover}\r\n.a-index-liste{list-style:none;margin:0;padding:0;border-top:4px solid var(--encre)}\r\n.a-index-liste li{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:2px 14px;padding:22px 0;border-bottom:1px solid var(--trait); om:18%;white-space:nowrap}\r\n.m-carre .illus{bottom:12px}\r\n@media (max-width:480px){.m-rond .illus,.m-carre .illus{font-size:.875rem;padding:5px 7px;white-space:normal;text-align:center;width:max-content;max-width:90%}}\r\n@media (min-width:900px){.m-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}}\r\n.g-marche .sec h2{font-size:clamp(1.875rem,4vw,2.75rem)}\r\n.m-tete-sec{max-width:56ch;margin-bottom:36px}\r\n.m-saisons{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}\r\n.m-saison{border-radius:28px;padding:28px 26px}\r\n.m-saison h3{font:600 1.5rem/1.2 var(--titres);margin-bottom:12px}\r\n.m-saison ul{list-style:none;margin:0;padding:0}\r\n.m-saison li{display:grid;gap:0;padding:10px 0;border-top:1px dashed currentColor}\r\n.m-saison b{font-weight:600;font-size:1.0625rem}\r\n.m-saison span{font-size:1rem;opacity:.92}\r\n.m-saison-0{background:var(--bleu-pale);color:var(--bleu-fonce)}\r\n.m-saison-1{background:color-mix(in srgb,var(--paille) 38%,#fff);color:var(--encre)}\r\n.m-saison-2{background:color-mix(in srgb,var(--bleu) 16%,#fff);color:var(--bleu-fonce)}\r\n.m-saison-3{background:var(--bleu-fonce);color:#fff}\r\n.m-saison-3 :focus-visible{outline-color:#fff}\r\n.m-bouquets{background:var(--bleu-pale)}\r\n.m-bouquets-liste{list-style:none;margin:0;padding:0;display:grid;gap:16px}\r\n.m-bouquets-liste li{display:grid;gap:10px;align-content:start;border-radius:32px;padding:32px 30px 36px;min-height:200px}\r\n.m-bouquets-liste b{font:600 1.625rem/1.15 var(--titres)}\r\n.m-bouquets-liste em{font-style:normal;font-weight:700}\r\n.m-b0{background:var(--bleu);color:#fff}\r\n.m-b1{background:color-mix(in srgb,var(--paille) 55%,#fff);color:var(--encre)}\r\n.m-b2{background:#fff;color:var(--encre);border:2px solid var(--bleu)}\r\n.m-bouquets .actions .btn{background:var(--bleu-fonce);border-color:var(--bleu-fonce);color:#fff}\r\n.m-bouquets .actions .btn-contour{background:transparent;color:var(--bleu-fonce)}\r\n@media (min-width:900px){.m-bouquets-liste{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.m-b1{margin-top:40px}.m-b2{margin-top:80px}}\r\n.g-marche #boutique .ph-main{border-radius:200px 200px 28px 28px;aspect-ratio:3/4}\r\n.g-marche #boutique .ph-small{border-radius:50%;aspect-ratio:1;width:46%}\r\n.g-marche #demande{background:#fff}\r\n.g-marche #questions{background:var(--bleu-pale)}\r\n.g-marche .g-horaires-grille{background:var(--bleu-pale);border-radius:36px;padding:clamp(24px,4vw,56px)}\r\n.g-marche .carte-box{background:#fff}\r\n.g-marche .foot{background:var(--bleu-fonce);border-radius:40px 40px 0 0;margin-top:-1px}\r\n.g-marche .foot :focus-visible{outline-color:#fff}\r\n@media (prefers-reduced-motion:reduce){.g-marche *,.g-atelier *,.g-depannage *,.g-carte *{scroll-behavior:auto}}\r\n\r\n/* Retouches des gabarits */\r\n.g-nav a{white-space:nowrap}\r\n.d-voies-liste .d-lettre{color:#fff}\r\n.g-depannage .g-horaires .hours .today dt::after,.g-carte .g-horaires .hours .today dt::after{color:inherit}\r\n.g-depannage #boutique .about.sans-photo{display:grid;gap:20px;max-width:var(--wrap);margin:0 auto}\r\n.m-saison h3{color:inherit}\r\n@media (min-width:900px){\r\n  .g-depannage #boutique .about.sans-photo{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:72px;align-items:start}\r\n  .g-carte .c-familles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-count:auto;column-gap:88px;row-gap:12px}\r\n  .g-carte .c-famille:last-child:nth-child(odd){grid-column:1 / -1;width:calc(50% - 44px);margin-inline:auto}\r\n}\r\n.g-carte .g-horaires-grille{grid-template-columns:minmax(0,1fr)}\r\n/* Anneau de focus : sombre sur les boîtes claires posées dans une partie sombre, et sur la barre d'urgence jaune */\r\n.g-depannage .g-horaires .carte-box :focus-visible,.g-carte .g-horaires .carte-box :focus-visible{outline-color:var(--bleu-fonce)}\r\n.d-urgence :focus-visible{outline-color:var(--encre)}\r\n\r\n/* ===== Révision : en-têtes à grande photo (atelier, dépannage, marché), comme un site réel ===== */\r\n.g-atelier main>.sec:first-child{padding-top:clamp(48px,6vw,80px)}\r\n/* Atelier : photo pleine largeur, titre en bas à gauche */\r\n.a-scene{position:relative;display:grid;align-items:end;min-height:min(76svh,700px);background:var(--bleu-fonce);color:#fff;isolation:isolate}\r\n.g-atelier .a-hero-fig{position:absolute;inset:0;margin:0;z-index:-2}\r\n.a-hero-fig img{width:100%;height:100%;object-fit:cover;aspect-ratio:auto;max-height:none;object-position:50% 35%}\r\n.a-scene::after{content:\"\";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(24,15,8,.86) 0%,rgba(24,15,8,.5) 42%,rgba(24,15,8,.12) 100%)}\r\n.a-hero-fig .illus{left:auto;right:12px;bottom:12px}\r\n.a-scene .a-hero-txt{padding-top:clamp(72px,12vw,150px);padding-bottom:clamp(36px,6vw,72px)}\r\n.a-scene .a-genre{color:#fff;border-top-color:var(--accent,#e9cd8a)}\r\n.a-scene h1{color:#fff;max-width:14ch}\r\n.a-scene .a-hero-txt>p:not(.a-genre):not(.statut){color:rgba(255,255,255,.92);max-width:52ch}\r\n.a-scene .statut{color:#fff}\r\n.a-scene .actions .btn{background:#fff;border-color:#fff;color:var(--bleu-fonce)}\r\n.a-scene .actions .btn:hover{background:var(--accent,#e9cd8a);border-color:var(--accent,#e9cd8a)}\r\n.g-atelier .a-scene .actions .btn-contour{background:transparent;border-color:#fff;color:#fff}\r\n.g-atelier .a-scene .actions .btn-contour:hover{background:rgba(255,255,255,.16)}\r\n.a-scene :focus-visible{outline-color:#fff}\r\n.a-scene.sans-photo{min-height:0;background:var(--bleu-pale);color:var(--encre)}\r\n.a-scene.sans-photo::after{display:none}\r\n.a-scene.sans-photo .a-hero-txt{padding-top:clamp(40px,6vw,80px)}\r\n.a-scene.sans-photo h1,.a-scene.sans-photo .a-genre,.a-scene.sans-photo .statut{color:var(--bleu-fonce)}\r\n.a-scene.sans-photo .a-hero-txt>p:not(.a-genre):not(.statut){color:var(--encre)}\r\n.a-scene.sans-photo .actions .btn{background:var(--bleu-fonce);border-color:var(--bleu-fonce);color:#fff}\r\n/* Dépannage : texte à gauche, photo qui touche le bord droit ; un appel, un devis */\r\n.d-scene{display:grid;grid-template-columns:minmax(0,1fr);background:var(--bleu-fonce)}\r\n.d-hero-txt{padding:clamp(32px,6vw,64px) var(--gut) clamp(36px,6vw,72px)}\r\n.d-hero-fig{margin:0;position:relative;min-height:260px;aspect-ratio:16/10}\r\n.d-hero-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;aspect-ratio:auto;max-height:none;object-position:50% 40%}\r\n.d-hero-fig .illus{left:auto;right:12px;bottom:12px}\r\n.d-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}\r\n.d-actions .btn{min-height:56px;padding:0 26px;font-size:1.125rem;font-weight:700;border-radius:0}\r\n.d-appel{background:var(--paille);border-color:var(--paille);color:var(--sur-accent,var(--encre))}\r\n.d-appel:hover{background:#fff;border-color:#fff}\r\n.d-devis{background:transparent;border:2px solid #fff;color:#fff}\r\n.d-devis:hover{background:rgba(255,255,255,.14)}\r\n.d-scene.sans-photo .d-hero-txt{max-width:860px;margin:0 auto;width:100%}\r\n@media (min-width:900px){\r\n  .d-scene{grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:clamp(460px,70svh,640px)}\r\n  .d-hero-txt{padding-left:max(var(--gut),calc((100vw - var(--wrap)) / 2 + var(--gut)));padding-right:clamp(32px,5vw,72px);align-self:center}\r\n  .d-hero-fig{aspect-ratio:auto;min-height:100%}\r\n  .d-scene.sans-photo{grid-template-columns:minmax(0,1fr)}\r\n}\r\n/* Marché : barre simple, une photo large, titre et texte côte à côte */\r\n.g-marche{--r:6px}\r\n.m-tete{padding:0;border-bottom:1px solid var(--trait)}\r\n.m-barre{display:flex;align-items:center;gap:22px;min-height:76px}\r\n.m-barre .g-nom{font:600 1.5rem/1 var(--titres);color:var(--bleu-fonce);margin-right:auto}\r\n.m-barre .g-nav a{color:var(--encre)}\r\n.m-barre .g-cta{background:var(--bleu);color:#fff;border-radius:0;padding:0 22px}\r\n.m-barre .g-cta:hover{background:var(--bleu-fonce)}\r\n.m-barre .menu-btn{border-radius:0;color:var(--bleu-fonce);border-color:var(--bleu-fonce)}\r\n.m-photo{margin:0;position:relative}\r\n.m-photo img{display:block;width:100%;aspect-ratio:16/9;max-height:min(66svh,620px);object-fit:cover;object-position:50% 55%}\r\n.m-photo .illus{left:auto;right:16px;bottom:16px}\r\n.m-hero .m-grille{display:grid;gap:20px;padding-top:clamp(28px,5vw,56px);padding-bottom:clamp(40px,6vw,80px);align-items:start}\r\n.m-hero .m-grille h1{font:600 clamp(2.25rem,5.4vw,4rem)/1.04 var(--titres);color:var(--bleu-fonce);max-width:14ch;letter-spacing:-.01em}\r\n.m-hero .m-txt>p{max-width:46ch;margin-top:0;font-size:1.1875rem}\r\n@media (min-width:900px){.m-hero .m-grille{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:end}}\r\n.g-marche .btn{border-radius:0}\r\n.g-marche .m-saison,.g-marche .m-bouquets-liste li{border-radius:0}\r\n.g-marche .m-saison li{border-top-style:solid;border-top-color:color-mix(in srgb,currentColor 28%,transparent)}\r\n.g-marche .m-bouquets-liste li{min-height:0}\r\n@media (min-width:900px){.g-marche .m-b1,.g-marche .m-b2{margin-top:0}}\r\n.g-marche #boutique .ph-main{border-radius:0;aspect-ratio:4/5}\r\n.g-marche #boutique .ph-small{border-radius:0;aspect-ratio:4/3;width:46%}\r\n.g-marche .g-horaires-grille{border-radius:0}\r\n.g-marche .foot{border-radius:0}\r\n@media (min-width:961px){.m-barre .g-nav{display:flex}}\r\n/* Photos de la boutique : deux images alignées, sans décalage ni collage */\r\n.g-atelier #boutique .ph-main,.g-marche #boutique .ph-main{aspect-ratio:3/2}\r\n.g-atelier #boutique .ph-small,.g-marche #boutique .ph-small{width:100%;aspect-ratio:3/2;margin:14px 0 0}\r\n\r\n/* Logo : une marque (symbole) devant le nom */\r\n.g-nom,.nom{display:inline-flex;align-items:center;gap:12px}\r\n.g-logo{display:block;width:44px;height:44px;flex:none}\r\n.foot .g-logo{width:40px;height:40px}\r\n\r\n/* ===== Identité des démonstrations : à plat, sans cartes colorées, un seul accent ===== */\r\n/* Dépannage : bandeau d'appel et bouton dans l'accent, tuiles et voies en simples lignes */\r\n.d-urgence :focus-visible{outline-color:currentColor}\r\n.d-appel:hover{background:#fff;border-color:#fff;color:var(--encre)}\r\n.d-tuiles{gap:0 28px}\r\n.d-tuiles li{border:0;border-top:2px solid var(--encre);background:none;padding:20px 0 24px}\r\n.d-tuiles b{font-weight:600}\r\n.d-voies,.g-depannage #questions{background:#fff}\r\n.d-voies-liste{gap:0}\r\n.d-voies-liste li{background:none;border:0;border-top:1px solid var(--trait);padding:22px 0;grid-template-columns:3rem minmax(0,1fr);gap:0 14px}\r\n.d-voies-liste li:last-child{border-bottom:1px solid var(--trait)}\r\n.d-lettre{display:block;width:auto;height:auto;background:none;color:var(--bleu);font:600 1.75rem/1.1 var(--titres)}\r\n.d-voies-liste b{font-weight:600}\r\n/* Atelier : une section claire, des filets, pas de tuiles dorées */\r\n.g-atelier #boutique h2::before{display:none}\r\n.a-travaux{background:var(--bleu-pale);color:var(--encre)}\r\n.a-travaux h2{color:var(--encre)}\r\n.a-travaux .intro{color:var(--gris)}\r\n.a-tiroirs{gap:0 28px}\r\n.a-tiroirs li{border-top:2px solid var(--encre);background:none;padding:20px 0 26px}\r\n.a-tiroirs b{font-weight:600}\r\n.a-tiroirs span{color:var(--gris)}\r\n.a-tiroirs em{color:var(--bleu-fonce)}\r\n.a-travaux .actions .btn{background:var(--bleu-fonce);border-color:var(--bleu-fonce);color:#fff}\r\n.a-travaux .actions .btn:hover{background:var(--encre)}\r\n.a-travaux .actions .btn-contour{background:transparent;color:var(--bleu-fonce);border-color:var(--bleu-fonce)}\r\n.a-travaux .actions .btn-contour:hover{background:#fff}\r\n.a-travaux :focus-visible{outline-color:var(--bleu-fonce)}\r\n@media (min-width:900px){.a-tiroirs li:nth-child(2),.a-tiroirs li:nth-child(3){margin-top:0}}\r\n.a-index-liste{border-top-width:2px}\r\n.g-atelier .g-horaires-grille{border-top-width:2px}\r\n/* Marché : des lignes au lieu des cartes pastel */\r\n.g-marche .m-saisons{gap:0 28px}\r\n.g-marche .m-saison,.g-marche .m-saison-0,.g-marche .m-saison-1,.g-marche .m-saison-2,.g-marche .m-saison-3{background:none;color:var(--encre);border-top:2px solid var(--bleu-fonce);padding:18px 0 8px}\r\n.g-marche .m-saison h3{color:var(--bleu-fonce);font-weight:600}\r\n.g-marche .m-bouquets-liste li,.g-marche .m-b0,.g-marche .m-b1,.g-marche .m-b2{background:none;color:var(--encre);border:0;border-top:2px solid var(--bleu-fonce);padding:20px 0 24px;gap:8px}\r\n.g-marche .m-bouquets-liste b{font-weight:600}\r\n.g-marche .m-saison-3 :focus-visible{outline-color:var(--bleu-fonce)}\r\n.g-marche .m-bouquets-liste{gap:0 28px}\r\n.g-marche .m-tete-sec h2,.g-marche .sec h2{font-weight:500}\r\n.g-nom{white-space:nowrap}\r\n.d-hero h1{font-size:clamp(2.375rem,5.2vw,4.25rem);line-height:1;max-width:13ch;letter-spacing:-.015em}\r\n.d-voies-liste .d-lettre{color:var(--bleu)}\r\n.g-marche .sec h2,.g-marche .m-tete-sec h2{font-size:clamp(2.125rem,4.6vw,3.125rem)}\r\n.g-marche .m-saison h3,.g-marche .m-bouquets-liste b{font-size:1.75rem}\r\n.g-marche .m-hero .m-grille h1,.m-hero .m-grille h1{font-size:clamp(2.75rem,6.4vw,4.75rem)}\r\n.d-urgence p{font-size:1.0625rem}\r\n.d-urgence a{white-space:nowrap;font-size:1.25rem}\r\n.d-tete .g-nom{font-size:1.25rem}\r\n@media (max-width:480px){.g-nom{font-size:1.25rem;gap:10px}.g-logo{width:38px;height:38px}.m-hero .m-grille h1{font-size:2.125rem}.d-hero h1{font-size:2.375rem}}\r\n@media (max-width:600px){.m-photo img{aspect-ratio:2/1}.m-hero .m-grille{padding-top:22px;gap:12px}.m-hero .m-grille h1{line-height:1.02}}\r\n/* Photos de la boutique : colonne de droite pleine, deuxième photo plus petite sous le texte */\r\n.g-atelier #boutique .ph-main,.g-marche #boutique .ph-main{aspect-ratio:4/5}\r\n.g-atelier #boutique .ph-small,.g-marche #boutique .ph-small{width:72%;aspect-ratio:3/2;margin:28px 0 0}\r\n/* Dépannage : une photo moins saturée */\r\n.d-hero-fig img,.d-bandeau img{filter:saturate(.7) contrast(1.03)}\r\n/* Marché : saisons en lignes (titre à gauche, fleurs à droite) */\r\n@media (min-width:760px){\r\n  .g-marche .m-saisons{display:block}\r\n  .g-marche .m-saison{display:grid;grid-template-columns:minmax(180px,1fr) 3fr;gap:8px 40px;align-items:baseline;padding:22px 0}\r\n  .g-marche .m-saison h3{margin:0}\r\n  .g-marche .m-saison ul{display:flex;flex-wrap:wrap;gap:8px 36px}\r\n  .g-marche .m-saison li{display:grid;gap:2px;border:0;padding:0}\r\n  .g-marche .m-saison:last-child{border-bottom:1px solid var(--bleu-fonce)}\r\n}\r\n/* Mobile : la photo d'en-tête ne dépasse jamais l'écran (constaté sur la démonstration plombier à 390 px) */\r\n.d-hero-fig{max-width:100%;min-width:0;overflow:hidden}\r\n.d-hero-fig img{max-width:100%}\r\n/* Plan : en attente, un bandeau compact aux couleurs du site (et non un grand cadre vide) ; il prend sa hauteur une fois chargé */\r\n.carte-box:not(.carte-ouverte){height:auto;min-height:0;padding:22px 24px;place-items:start;text-align:left;background:var(--bleu-pale)!important;border-color:transparent!important}\r\n.carte-attente{display:flex;align-items:center;gap:18px;flex-wrap:wrap}\r\n.carte-attente p{margin-top:8px}\r\n.carte-pin{flex:none;width:40px;height:40px;fill:none;stroke:var(--bleu);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\r\n.carte-box.carte-ouverte{padding:0}\r\n/* Très petits écrans (320 px) : le nom du commerce se replie au lieu de pousser le bouton Menu hors de l'écran */\r\n.wrap:has(> .menu-btn) > .g-nom{min-width:0;flex:0 1 auto}\r\n@media (max-width:380px){\r\n  .wrap:has(> .menu-btn){gap:12px}\r\n  .g-nom{overflow-wrap:anywhere}\r\n  .btn{white-space:normal;text-align:center}\r\n}\r\n\r\n/* =====================================================================\r\n   Quatre identités complètes (29/10/2026) : les parties communes (présentation, demande, questions, horaires, pied de page)\r\n   prennent la forme du métier. Atelier = carnet d'atelier (règle graduée, bois). Marché = jardin (arches, pastels, pied clair).\r\n   Dépannage = fiche technique (quadrillage de plan, cadres épais). Carte = carte de restaurant (centré, doubles filets, losanges).\r\n   ===================================================================== */\r\n\r\n/* ---------- Atelier : carnet d'atelier ---------- */\r\nbody.g-atelier{--regle:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 60px) 0 0/100% 14px no-repeat,repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 12px) 0 0/100% 7px no-repeat;--kraft:#eadfcb}\r\nbody.g-atelier .sec > .wrap > h2,body.g-atelier .cmd-intro h2,body.g-atelier .about .txt h2{position:relative;padding-bottom:26px}\r\nbody.g-atelier .sec > .wrap > h2::after,body.g-atelier .cmd-intro h2::after,body.g-atelier .about .txt h2::after{content:\"\";position:absolute;left:0;bottom:0;width:min(100%,360px);height:14px;color:var(--bleu);background:var(--regle)}\r\nbody.g-atelier #demande{background:var(--kraft)}\r\nbody.g-atelier .cmd-form{border:1px solid var(--encre);border-radius:0;background:#fffdf8}\r\nbody.g-atelier .saisie{border:0;border-bottom:1.5px solid var(--encre);border-radius:0;background:transparent;padding-left:2px}\r\nbody.g-atelier .choix{border-radius:0;border-color:rgba(35,26,18,.35);background:transparent}\r\nbody.g-atelier .choix:has(input:checked){background:var(--kraft);box-shadow:none;border-color:var(--encre)}\r\nbody.g-atelier #questions .wrap{display:grid;gap:28px}\r\nbody.g-atelier .faq{counter-reset:q;margin-top:0;max-width:none}\r\nbody.g-atelier .faq summary{counter-increment:q;display:grid;grid-template-columns:3.2em 1fr;font-style:italic}\r\nbody.g-atelier .faq summary::before{content:\"N° \" counter(q);font-style:normal;font-size:.875rem;color:var(--bleu);padding-top:.25em}\r\nbody.g-atelier .faq .rep{padding-left:3.2em}\r\n@media (min-width:900px){body.g-atelier #questions .wrap{grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:72px;align-items:start}}\r\nbody.g-atelier .g-horaires{background:var(--bleu-fonce);color:#f3ead9}\r\nbody.g-atelier .g-horaires-grille{border-top:0;padding-top:28px;position:relative}\r\nbody.g-atelier .g-horaires-grille::before{content:\"\";position:absolute;left:0;right:0;top:0;height:14px;color:#c9a774;background:var(--regle)}\r\nbody.g-atelier .g-horaires h2,body.g-atelier .g-horaires .gros,body.g-atelier .g-horaires .statut{color:#fff}\r\nbody.g-atelier .g-horaires-i h3{color:#d9c7a7}\r\nbody.g-atelier .g-horaires .hours div{border-color:rgba(243,234,217,.22)}\r\nbody.g-atelier .g-horaires .hours dt::after{color:#d9c7a7}\r\nbody.g-atelier .g-horaires .btn{background:var(--paille);border-color:var(--paille);color:var(--sur-accent,#231a12)}\r\nbody.g-atelier .g-horaires .carte-box:not(.carte-ouverte){background:rgba(243,234,217,.1)!important}\r\nbody.g-atelier .g-horaires .carte-box p{color:#e6dccb}\r\nbody.g-atelier .g-horaires .carte-pin{stroke:#e3c694}\r\nbody.g-atelier .g-horaires .btn-contour{background:transparent;color:#fff;border-color:#fff}\r\nbody.g-atelier .g-horaires :focus-visible{outline-color:#fff}\r\nbody.g-atelier .foot{background:#16100a;position:relative;padding-top:80px}\r\nbody.g-atelier .foot::before{content:\"\";position:absolute;left:0;right:0;top:0;height:14px;color:#8a5a2b;background:var(--regle)}\r\n\r\n/* ---------- Marché (fleuriste) : jardin ---------- */\r\nbody.g-marche{--rose:color-mix(in srgb,var(--paille) 22%,#fff);--sauge:var(--bleu-pale)}\r\nbody.g-marche .sec > .wrap > h2,body.g-marche .cmd-intro h2,body.g-marche .about .txt h2{display:flex;align-items:center;gap:14px}\r\nbody.g-marche .sec > .wrap > h2::before,body.g-marche .cmd-intro h2::before,body.g-marche .about .txt h2::before{content:\"\";flex:none;width:14px;height:14px;border-radius:50%;background:var(--paille)}\r\nbody.g-marche #demande{background:var(--sauge)}\r\nbody.g-marche .cmd-form{border:0;border-radius:32px;padding:clamp(22px,4vw,40px)}\r\nbody.g-marche .saisie{border-radius:999px;border-color:#cfd9d2;padding-left:18px}\r\nbody.g-marche textarea.saisie{border-radius:22px}\r\nbody.g-marche .choix{border-radius:22px;border-color:#d7e1da}\r\nbody.g-marche .choix:has(input:checked){background:var(--rose);border-color:var(--paille);box-shadow:none}\r\nbody.g-marche .cmd-envoyer,body.g-marche .btn{border-radius:999px}\r\nbody.g-marche #boutique .ph-main{border-radius:999px 999px 28px 28px}\r\nbody.g-marche #boutique .ph-small{border-radius:50%;aspect-ratio:1;width:48%}\r\nbody.g-marche #questions{background:var(--rose)}\r\nbody.g-marche #questions .wrap{max-width:820px;text-align:center}\r\nbody.g-marche #questions h2{justify-content:center}\r\nbody.g-marche .faq{margin:28px auto 0;display:grid;gap:12px;text-align:left}\r\nbody.g-marche .faq details,body.g-marche .faq details:first-child{border:0;background:#fff;border-radius:28px;padding:0 24px}\r\nbody.g-marche .g-horaires{background:#fff}\r\nbody.g-marche .g-horaires-grille{background:none;padding:0;border-radius:0;gap:20px}\r\nbody.g-marche .g-horaires-h{background:var(--rose);border-radius:200px 200px 32px 32px;padding:clamp(56px,7vw,88px) clamp(24px,4vw,48px) clamp(24px,4vw,40px);text-align:center}\r\nbody.g-marche .g-horaires-h h2{justify-content:center}\r\nbody.g-marche .g-horaires-i{background:var(--sauge);border-radius:32px;padding:clamp(24px,4vw,40px)}\r\nbody.g-marche .g-horaires .hours{text-align:left}\r\nbody.g-marche .g-horaires .carte-box:not(.carte-ouverte){background:#fff!important;border-radius:24px}\r\nbody.g-marche .foot{background:var(--sauge);color:var(--encre);border-radius:48px 48px 0 0}\r\nbody.g-marche .foot h3,body.g-marche .foot a,body.g-marche .foot .nom{color:var(--bleu-fonce)}\r\nbody.g-marche .foot .legal,body.g-marche .foot .legal *{color:#3f4a44}\r\nbody.g-marche .foot :focus-visible{outline-color:var(--bleu-fonce)}\r\n\r\n/* ---------- Dépannage (plombier) : fiche technique ---------- */\r\nbody.g-depannage{--plan:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/28px 28px}\r\nbody.g-depannage .sec > .wrap > h2,body.g-depannage .cmd-intro h2,body.g-depannage .about .txt h2{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:-.01em}\r\nbody.g-depannage .sec > .wrap > h2::before,body.g-depannage .cmd-intro h2::before,body.g-depannage .about .txt h2::before{content:\"\";flex:none;width:12px;height:12px;background:var(--paille)}\r\nbody.g-depannage #demande{background:var(--plan),var(--bleu-fonce);color:#fff}\r\nbody.g-depannage #demande .cmd-intro h2,body.g-depannage #demande .cmd-intro,body.g-depannage #demande .cmd-intro p,body.g-depannage #demande .cmd-intro li,body.g-depannage #demande .cmd-intro a{color:#fff}\r\nbody.g-depannage #demande .cmd-etapes li::marker{color:var(--paille)}\r\nbody.g-depannage #demande :focus-visible{outline-color:#fff}\r\nbody.g-depannage #demande .cmd-form :focus-visible{outline-color:var(--bleu-fonce)}\r\nbody.g-depannage .cmd-form{border:0;border-top:8px solid var(--paille);border-radius:0;color:var(--encre)}\r\nbody.g-depannage .saisie{border:2px solid #11294d;border-radius:0}\r\nbody.g-depannage .choix{border:2px solid #c6cfdc;border-radius:0}\r\nbody.g-depannage .choix:has(input:checked){border-color:var(--bleu-fonce);background:#eef2f8;box-shadow:none}\r\nbody.g-depannage #boutique .ph-main{box-shadow:18px 18px 0 var(--bleu);border-radius:0}\r\nbody.g-depannage #boutique .ph-small{border:6px solid #fff;outline:2px solid var(--bleu-fonce);border-radius:0}\r\nbody.g-depannage .faq{max-width:none;display:grid;gap:14px;counter-reset:q}\r\nbody.g-depannage .faq details,body.g-depannage .faq details:first-child{border:2px solid var(--bleu-fonce);padding:0 20px}\r\nbody.g-depannage .faq summary{font-family:var(--texte);font-weight:700;counter-increment:q;display:flex;gap:14px;align-items:baseline}\r\nbody.g-depannage .faq summary::before{content:counter(q);flex:none;display:inline-grid;place-items:center;width:30px;height:30px;background:var(--paille);color:#fff;font-size:.9375rem}\r\n@media (min-width:900px){body.g-depannage .faq{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}\r\nbody.g-depannage .g-horaires{background:var(--plan),var(--bleu-fonce)}\r\nbody.g-depannage .g-horaires .hours div{padding:12px 14px}\r\nbody.g-depannage .g-horaires .hours div:nth-child(odd){background:rgba(255,255,255,.06)}\r\nbody.g-depannage .g-horaires .hours .today{background:var(--paille)!important;color:#fff}\r\nbody.g-depannage .g-horaires .hours .today dt::after{color:#fff}\r\nbody.g-depannage .foot{background:#0b1a31;border-top:10px solid var(--paille)}\r\n\r\n/* ---------- Carte (restaurant) : carte de restaurant ---------- */\r\nbody.g-carte{--creme:#f7f1e6}\r\nbody.g-carte .sec > .wrap > h2,body.g-carte .cmd-intro h2,body.g-carte .about .txt h2{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center}\r\nbody.g-carte .sec > .wrap > h2::before,body.g-carte .sec > .wrap > h2::after,body.g-carte .cmd-intro h2::before,body.g-carte .cmd-intro h2::after,body.g-carte .about .txt h2::before,body.g-carte .about .txt h2::after{content:\"◆\";flex:none;font-size:.5em;color:var(--bleu)}\r\nbody.g-carte #demande{background:var(--creme)}\r\nbody.g-carte .cmd{grid-template-columns:minmax(0,1fr)!important;max-width:760px;margin-inline:auto;text-align:center}\r\nbody.g-carte .cmd-intro{position:static}\r\nbody.g-carte .cmd-etapes{margin-inline:auto;text-align:left}\r\nbody.g-carte .cmd-form{text-align:left;border:4px double var(--bleu);border-radius:0;background:#fffdf9}\r\nbody.g-carte .saisie{border:0;border-bottom:1px solid var(--bleu);border-radius:0;background:transparent}\r\nbody.g-carte .choix{border-radius:0;border-color:rgba(122,31,43,.3);text-align:left}\r\nbody.g-carte .choix:has(input:checked){background:var(--creme);box-shadow:none;border-color:var(--bleu)}\r\nbody.g-carte #boutique .about{grid-template-columns:minmax(0,1fr)!important;max-width:820px;margin-inline:auto;text-align:center;justify-items:center}\r\nbody.g-carte #boutique .about .txt p{margin-inline:auto}\r\nbody.g-carte #boutique .ph-main{aspect-ratio:16/9;outline:4px double var(--bleu);outline-offset:8px;border-radius:0}\r\nbody.g-carte #boutique .ph-small{display:none}\r\nbody.g-carte #questions{background:var(--creme)}\r\nbody.g-carte #questions .wrap{max-width:720px;text-align:center}\r\nbody.g-carte .faq{margin-inline:auto;text-align:left}\r\nbody.g-carte .faq details,body.g-carte .faq details:first-child{border:0;padding:6px 0}\r\nbody.g-carte .faq details + details::before{content:\"◆\";display:block;text-align:center;font-size:.625rem;color:var(--bleu);padding:6px 0}\r\nbody.g-carte .faq summary{text-align:center;font-style:italic}\r\nbody.g-carte .g-horaires-grille{outline:3px double rgba(255,255,255,.55);outline-offset:-14px;padding:clamp(36px,5vw,56px) clamp(24px,4vw,48px)}\r\nbody.g-carte .foot{background:var(--bleu-fonce);text-align:center;border-top:6px double var(--paille)}\r\nbody.g-carte .foot-grid{justify-items:center}\r\n/* Atelier : la règle graduée remplace le petit trait au-dessus des titres ; questions sur une ligne ; notes lisibles sur le bois */\r\nbody.g-atelier .sec h2::before,body.g-atelier #boutique h2::before{display:none}\r\nbody.g-atelier .faq summary{grid-template-columns:3.2em minmax(0,1fr) auto;align-items:baseline}\r\nbody.g-atelier .g-horaires .hnote{color:#d9c7a7}\r\n/* Repère des titres de plusieurs lignes : aligné sur la première ligne */\r\nbody.g-depannage .sec > .wrap > h2,body.g-depannage .cmd-intro h2,body.g-depannage .about .txt h2,body.g-marche .sec > .wrap > h2,body.g-marche .cmd-intro h2,body.g-marche .about .txt h2{align-items:flex-start}\r\nbody.g-depannage .sec > .wrap > h2::before,body.g-depannage .cmd-intro h2::before,body.g-depannage .about .txt h2::before,body.g-marche .sec > .wrap > h2::before,body.g-marche .cmd-intro h2::before,body.g-marche .about .txt h2::before{margin-top:.42em}\r\n\r\n/* Menus : chaque gabarit a son bouton, à sa place (le mot « Menu » est gardé pour la carte du restaurant) */\r\n.a-tete .menu-btn,.m-barre .menu-btn,.m-pilule .menu-btn,.d-tete .menu-btn{position:relative;width:48px;height:48px;padding:0;font-size:0;line-height:0}\r\n.a-tete .menu-btn{order:-1;margin-right:6px}\r\n.a-tete .menu-btn::before{content:\"\";position:absolute;left:11px;right:11px;top:15px;height:2px;background:currentColor;box-shadow:0 8px 0 currentColor,0 16px 0 currentColor}\r\n.m-barre .menu-btn,.m-pilule .menu-btn{border-radius:50%}\r\n.m-barre .menu-btn::before,.m-pilule .menu-btn::before{content:\"\";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:-10px 0 currentColor,10px 0 currentColor;transform:translate(-50%,-50%)}\r\n.d-tete .menu-btn{background:#fff;color:var(--bleu-fonce);border-color:#fff;border-radius:0}\r\n.d-tete .menu-btn::before{content:\"\";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 -10px currentColor,0 10px currentColor;transform:translate(-50%,-50%)}\r\n.c-barre .menu-btn{border:0;border-bottom:2px solid currentColor;border-radius:0;padding:8px 0;min-height:44px}\r\n\n/* =====================================================================\n   La Cuillère Haute : le lieu porte tout (direction Taste « place-carries-it », 16/11/2026).\n   La salle en plein écran ; le texte se pose en bas comme un générique. Ensuite, des paragraphes\n   courts dans une colonne étroite, entre des photos montrées en grand.\n   Fond tabac, texte couleur os, un seul vert olive pour l'action, une seule bande ocre (les formules).\n   Angles droits, aucun filet, aucun losange, aucune ombre. Young Serif + Figtree.\n   ===================================================================== */\nbody.g-carte{\n  --fond:#3b2416;--surface:#47301f;--surface2:#2a1a0f;--encre:#ece6d6;--gris:#c9b9a2;\n  --olive:#5b6a1f;--olive-fonce:#46521a;--ocre:#c79a3e;--ocre-encre:#2b170a;\n  --bleu:var(--olive);--bleu-fonce:var(--surface2);\n  background:var(--fond);color:var(--encre);\n}\nbody.g-carte ::selection{background:var(--ocre);color:var(--ocre-encre)}\nbody.g-carte :focus-visible{outline:2px solid var(--ocre);outline-offset:3px}\nbody.g-carte h1,body.g-carte h2,body.g-carte h3{font-family:var(--titres);color:var(--encre);font-weight:400;font-style:normal}\nbody.g-carte .sec h2,body.g-carte .cmd-intro h2{font-size:clamp(2rem,3.2vw,2.75rem);line-height:1.05;letter-spacing:-.01em}\nbody.g-carte h2::before,body.g-carte h2::after,body.g-carte .c-carte-tete::before,body.g-carte .c-carte-tete::after{content:none!important}\nbody.g-carte .sec .intro,body.g-carte .hnote,body.g-carte p{color:var(--gris)}\nbody.g-carte .sec{text-align:left}\nbody.g-carte .illus{background:var(--surface2);color:var(--encre);border:0;border-radius:0}\n\n/* ---------- Boutons ---------- */\nbody.g-carte .btn,body.g-carte .g-cta,body.g-carte .cmd-envoyer{border-radius:0;border:0;background:var(--olive);color:var(--encre);font-weight:700;min-height:48px;padding:0 26px}\nbody.g-carte .btn:hover,body.g-carte .g-cta:hover,body.g-carte .cmd-envoyer:hover{background:var(--olive-fonce)}\nbody.g-carte .btn:active,body.g-carte .g-cta:active,body.g-carte .cmd-envoyer:active{transform:scale(.97)}\nbody.g-carte .actions .btn-contour{background:none;border:0;color:var(--encre);padding:0 6px;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;text-decoration-color:var(--ocre)}\nbody.g-carte .actions .btn-contour:hover{background:none;color:#fff}\n@media (prefers-reduced-motion:no-preference){body.g-carte .btn,body.g-carte .g-cta,body.g-carte .cmd-envoyer,body.g-carte .c-nav a{transition:background-color .2s ease,color .2s ease,text-decoration-color .2s ease,transform .12s ease}}\n\n/* ---------- Premier écran : la salle en plein écran ---------- */\nbody.g-carte .c-hero{position:relative;min-height:100svh;display:flex;flex-direction:column;background:var(--surface2);overflow:hidden;border:0;text-align:left}\nbody.g-carte .c-hero::before,body.g-carte .c-hero::after{content:none}\nbody.g-carte .c-bandeau{position:absolute;inset:0;margin:0;width:auto;height:auto;max-width:none;border:0;border-radius:0;clip-path:none;z-index:0}\nbody.g-carte .c-bandeau::before,body.g-carte .c-bandeau::after{content:none}\nbody.g-carte .c-bandeau img{width:100%;height:100%;object-fit:cover;border:0;border-radius:0;aspect-ratio:auto;max-height:none}\n/* voile neutre, seulement sous le texte (en haut pour la barre, en bas pour le générique) */\nbody.g-carte .c-hero .c-tete,body.g-carte .c-hero .c-intro{position:relative;z-index:1}\nbody.g-carte .c-hero .c-tete{background:rgba(20,12,7,.55);border:0;box-shadow:none}\nbody.g-carte .c-tete .c-barre{text-align:left}\nbody.g-carte .c-tete .g-nom{color:var(--encre);font-family:var(--titres)}\nbody.g-carte .c-tete .c-tel{color:var(--encre)}\nbody.g-carte .c-nav{border:0;box-shadow:none}\nbody.g-carte .c-nav a{color:var(--encre);font-weight:600;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:6px;text-decoration-thickness:2px}\nbody.g-carte .c-nav a:hover{text-decoration-color:var(--ocre)}\nbody.g-carte .menu-btn{border-radius:0;border:1.5px solid var(--encre);color:var(--encre);background:none}\nbody.g-carte .c-bandeau .illus{position:absolute;right:12px;left:auto;bottom:auto;top:calc(100% - 44px);z-index:3}\nbody.g-carte .c-hero .c-intro{margin-top:auto;margin-left:0;margin-right:0;max-width:none;width:100%;text-align:left;padding-top:48px;padding-bottom:56px;background:rgba(20,12,7,.62)}\nbody.g-carte .c-intro .c-genre{display:none}\nbody.g-carte .c-intro h1{font-size:clamp(2.25rem,5vw,3.75rem);line-height:1.04;letter-spacing:-.015em;max-width:18ch;margin:0;color:var(--encre);text-align:left}\nbody.g-carte .c-intro h1::before,body.g-carte .c-intro h1::after{content:none}\nbody.g-carte .c-intro > p{max-width:46ch;margin:18px 0 0;color:#e2d8c6;text-align:left}\nbody.g-carte .c-intro .statut{color:var(--ocre);font-weight:700}\nbody.g-carte .c-intro .actions{justify-content:flex-start;align-items:center;gap:18px;margin-top:26px}\n\n/* ---------- La carte : trois familles côte à côte, sans pointillés ---------- */\nbody.g-carte .c-carte{background:var(--fond)}\nbody.g-carte .c-carte-tete{text-align:left;max-width:46ch;margin:0 0 36px}\nbody.g-carte .c-carte-tete h2{justify-content:flex-start}\nbody.g-carte .c-familles{display:grid;gap:4px;grid-template-columns:minmax(0,1fr);border:0;outline:0;padding:0;background:none;box-shadow:none;max-width:none}\nbody.g-carte .c-familles::before,body.g-carte .c-familles::after{content:none}\nbody.g-carte .c-familles > *{background:var(--surface);padding:28px 26px;margin:0;border:0}\nbody.g-carte .c-familles h3{font-size:1.625rem;text-align:left;margin:0 0 14px;color:var(--ocre)}\nbody.g-carte .c-familles h3::before,body.g-carte .c-familles h3::after{content:none}\nbody.g-carte .c-familles ul{display:grid;gap:16px;padding:0;margin:0;list-style:none}\nbody.g-carte .c-familles li{display:grid;gap:2px;text-align:left;border:0;padding:0;margin:0}\nbody.g-carte .c-familles li::before,body.g-carte .c-familles li::after,body.g-carte .c-nom::after{content:none;display:none}\nbody.g-carte .c-nom{font:400 1.1875rem/1.3 var(--titres);color:var(--encre);background:none}\nbody.g-carte .c-desc{color:var(--gris);font-style:normal;font-size:1rem}\n\n/* ---------- Formules : la seule bande ocre ---------- */\nbody.g-carte .c-formules{background:var(--ocre);color:var(--ocre-encre)}\nbody.g-carte .c-formules h2,body.g-carte .c-formules h3,body.g-carte .c-formules b{color:var(--ocre-encre)}\nbody.g-carte .c-formules p,body.g-carte .c-formules .intro,body.g-carte .c-formules span{color:#4a2d14}\nbody.g-carte .c-formules-liste{display:grid;gap:4px;grid-template-columns:minmax(0,1fr);padding:0;margin:0;list-style:none;border:0}\nbody.g-carte .c-formules-liste li{display:grid;gap:6px;padding:24px 26px;background:#d4ab55;border:0;border-radius:0;text-align:left;margin:0}\nbody.g-carte .c-formules-liste li::before,body.g-carte .c-formules-liste li::after{content:none}\nbody.g-carte .c-formules-liste b{font:400 1.75rem/1.1 var(--titres)}\nbody.g-carte .c-formules .actions{justify-content:flex-start;align-items:center;gap:18px;margin-top:28px}\nbody.g-carte .c-formules .actions .btn:not(.btn-contour){background:var(--ocre-encre);color:var(--encre)}\nbody.g-carte .c-formules .actions .btn:not(.btn-contour):hover{background:#000}\nbody.g-carte .c-formules .actions .btn-contour{color:var(--ocre-encre);text-decoration-color:var(--ocre-encre)}\nbody.g-carte .c-formules :focus-visible{outline-color:var(--ocre-encre)}\n\n/* ---------- Réserver ---------- */\nbody.g-carte #demande{background:var(--fond)}\nbody.g-carte .cmd-intro,body.g-carte .cmd-intro *{text-align:left}\nbody.g-carte .cmd-etapes{text-align:left}\nbody.g-carte .cmd-etapes li::marker{color:var(--ocre);font-weight:700}\nbody.g-carte .cmd-form,body.g-carte .cmd-ok{background:var(--surface);border:0;outline:0;border-radius:0;box-shadow:none;padding:clamp(24px,4vw,40px)}\nbody.g-carte .cmd-form label,body.g-carte .champ-bloc label,body.g-carte legend{color:var(--encre)}\nbody.g-carte .saisie{border:1.5px solid #8c7660;border-radius:0;background:var(--surface2);color:var(--encre);padding-left:14px}\nbody.g-carte .saisie::placeholder{color:#a8977f}\nbody.g-carte .saisie:focus{outline:2px solid var(--ocre);outline-offset:1px;border-color:var(--encre)}\nbody.g-carte .choix{border:1.5px solid #6e5843;border-radius:0;background:var(--surface2);color:var(--encre);box-shadow:none}\nbody.g-carte .choix:has(input:checked){background:#56401f;border-color:var(--ocre)}\nbody.g-carte .choix input{accent-color:var(--ocre)}\nbody.g-carte .choix-txt b{color:var(--encre)}\nbody.g-carte .choix-txt em,body.g-carte .choix-txt span{font-style:normal;color:var(--gris)}\nbody.g-carte .cmd-info,body.g-carte .champ-bloc small{color:var(--gris)}\n\n/* ---------- Le restaurant : une photo en grand, une colonne étroite ---------- */\nbody.g-carte #boutique{background:var(--surface2)}\nbody.g-carte #boutique .about{gap:32px;align-items:center;text-align:left}\nbody.g-carte #boutique .about > div:first-child::before,body.g-carte #boutique .about > div:first-child::after{content:none}\nbody.g-carte #boutique .ph-main,body.g-carte #boutique .ph-small{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border:0;outline:0;border-radius:0;box-shadow:none;transform:none;margin:0}\nbody.g-carte #boutique .ph-small{width:min(60%,300px);margin-top:20px}\nbody.g-carte #boutique .txt h2{justify-content:flex-start}\n\n/* ---------- Questions ---------- */\nbody.g-carte #questions{background:var(--fond)}\nbody.g-carte #questions .wrap{display:grid;gap:12px;text-align:left}\nbody.g-carte #questions h2{text-align:left;justify-content:flex-start}\nbody.g-carte .faq{display:grid;gap:4px;margin:16px 0 0;max-width:none}\nbody.g-carte .faq details,body.g-carte .faq details:first-child,body.g-carte .faq details:last-child{background:var(--surface);border:0;border-radius:0;padding:0 20px;margin:0}\nbody.g-carte .faq summary{display:flex;justify-content:space-between;align-items:center;gap:20px;list-style:none;cursor:pointer;font:600 1.0625rem/1.35 var(--texte);font-style:normal;color:var(--encre);padding:20px 0;text-align:left}\nbody.g-carte .faq summary::before{content:none}\nbody.g-carte .faq summary::-webkit-details-marker{display:none}\nbody.g-carte .faq summary::after{content:\"+\";flex:none;width:auto;height:auto;margin:0;border:0;background:none;transform:none;font:500 1.5rem/1 var(--texte);color:var(--ocre)}\nbody.g-carte .faq details[open] summary::after{content:\"\\2212\"}\nbody.g-carte .faq .rep,body.g-carte .faq .rep p{color:var(--gris);text-align:left}\n\n/* ---------- Horaires ---------- */\nbody.g-carte .g-horaires{background:var(--surface2);text-align:left}\nbody.g-carte .g-horaires-grille{text-align:left}\nbody.g-carte .g-horaires-h{background:var(--surface);border:0;outline:0;border-radius:0;box-shadow:none;padding:clamp(24px,4vw,40px);text-align:left}\nbody.g-carte .g-horaires-h h2{justify-content:flex-start}\nbody.g-carte .g-horaires .hours div{border-color:#5c4330}\nbody.g-carte .g-horaires .hours .today{color:var(--ocre);font-weight:700}\nbody.g-carte .g-horaires-i{background:none;border:0;text-align:left}\nbody.g-carte .g-horaires-i h3{font:700 .9375rem/1.3 var(--texte);color:var(--gris)}\nbody.g-carte .g-horaires .gros{color:var(--encre)}\nbody.g-carte .g-horaires .carte-box:not(.carte-ouverte){background:var(--surface)!important;border:0!important;border-radius:0}\nbody.g-carte .g-horaires .carte-box p{color:var(--gris)}\n\n/* ---------- Pied ---------- */\nbody.g-carte .foot{background:#1f130b;color:var(--gris);border:0;text-align:left}\nbody.g-carte .foot::before,body.g-carte .foot::after{content:none}\nbody.g-carte .foot h3,body.g-carte .foot a,body.g-carte .foot .nom{color:var(--encre)}\nbody.g-carte .foot .legal,body.g-carte .foot .legal *{color:#b3a38c}\n\n/* ---------- Corrections après captures (règles du gabarit carte plus fortes) ---------- */\nbody.g-carte .c-hero .wrap.c-intro{display:block}\nbody.g-carte .c-carte .c-familles{display:grid}\nbody.g-carte .c-carte .c-familles h3{border:0;padding-bottom:0}\nbody.g-carte .cmd-intro a,body.g-carte .sec p a{color:var(--encre);text-decoration-color:var(--ocre)}\nbody.g-carte .cmd-intro{max-width:52ch}\nbody.g-carte .cmd-etapes{margin-left:0;padding-left:1.4em}\n\n/* ---------- Ordinateur ---------- */\n@media (min-width:900px){\n  body.g-carte .c-tete .c-barre{min-height:72px}\n  body.g-carte .c-familles{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:4px;row-gap:4px;column-count:auto}\n  body.g-carte .c-familles > .c-famille:last-child:nth-child(odd){grid-column:auto;width:auto;margin-inline:0}\n  body.g-carte .c-formules-liste{grid-template-columns:repeat(3,minmax(0,1fr))}\n  body.g-carte .cmd{grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:clamp(40px,6vw,96px);text-align:left}\n  body.g-carte #boutique .about{grid-template-columns:minmax(0,6fr) minmax(0,5fr);column-gap:clamp(48px,7vw,112px)}\n  body.g-carte #questions .wrap{grid-template-columns:minmax(0,4fr) minmax(0,8fr);column-gap:64px;align-items:start}\n  body.g-carte .faq{margin-top:0}\n  body.g-carte .sec{padding-top:clamp(88px,9vw,136px);padding-bottom:clamp(88px,9vw,136px)}\n}\n\n/* ---------- Mouvement : la salle recule quand on entre, les photos s'ouvrent en grand ---------- */\nbody.g-carte .rev,.anime body.g-carte .rev{opacity:1;transform:none;transition:none}\n@supports (animation-timeline:view()){\n  @media (prefers-reduced-motion:no-preference){\n    body.g-carte .c-bandeau img{animation:cuillere-salle linear both;animation-timeline:view();animation-range:exit 0% exit 100%}\n    body.g-carte .c-intro{animation:cuillere-generique linear both;animation-timeline:view();animation-range:exit 0% exit 60%}\n    body.g-carte #boutique .ph-main{animation:cuillere-ouvre linear both;animation-timeline:view();animation-range:entry 0% cover 45%}\n    body.g-carte .c-familles > *,body.g-carte .c-formules-liste li{animation:cuillere-monte linear both;animation-timeline:view();animation-range:entry 0% entry 90%}\n    body.g-carte .c-familles > :nth-child(2),body.g-carte .c-formules-liste li:nth-child(2){animation-range:entry 10% entry 100%}\n    body.g-carte .c-familles > :nth-child(3),body.g-carte .c-formules-liste li:nth-child(3){animation-range:entry 20% cover 30%}\n  }\n}\n@keyframes cuillere-salle{to{transform:scale(1.12) translateY(6%)}}\n@keyframes cuillere-generique{to{transform:translateY(-12%)}}\n@keyframes cuillere-ouvre{from{clip-path:inset(14% 18% 14% 18%)}to{clip-path:inset(0)}}\n@keyframes cuillere-monte{from{transform:translateY(40px)}to{transform:none}}\n@media (prefers-reduced-motion:reduce){body.g-carte *{transition:none!important;animation:none!important}}\n", js: "/* Statut ouvert/fermé (heure de /* CSS des polices : url(f) donne l'adresse d'un fichier ("/fonts/x.woff2" ou "data:…"). */
function cssPolices(nom, url) {
  const P = POLICES[nom] || POLICES.classique;
  const faces = P.fichiers.map(([f, w, fichier]) => `@font-face{font-family:"${f}";font-style:normal;font-weight:${w};font-display:swap;src:url(${url(fichier)}) format("woff2")}`).join('\n');
  return `${faces}\n:root{--titres:${P.titres};--texte:${P.texte}}`;
}

/*
  Moteur de rendu, identique pour toutes les boutiques.
  Tout ce qui est propre à une boutique vient du contenu : textes, listes, horaires,
  vocabulaire du métier (contenu.metier), couleurs et polices (contenu.theme), parties affichées (contenu.sections).
  Utilisé par le serveur (src/worker.js), l'espace boutique (aperçu en direct) et outils/apercu.mjs.
*/

const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const SEMAINE = [1, 2, 3, 4, 5, 6, 0];
const EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paras = (s) => String(s || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean)
  .map((p) => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('\n');
const telHref = (t) => 'tel:' + String(t || '').replace(/[^\d+]/g, '').replace(/^0/, '+33');
const cap = (s) => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
const fmt = (m) => Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '');
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const enMinutes = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const prixNombre = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.').replace(/[^\d.]/g, '')); return isFinite(n) && n > 0 ? n : null; };
const couleur = (c, d) => (/^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : d);

/* Vocabulaire du métier, avec des valeurs par défaut neutres */
function voc(C) {
  const M = C.metier || {}, P = M.produits || {}, O = M.offres || {}, D = M.demande || {};

  const gp = genre(P), go = genre(O);

    typeSchema: M.type_schema || 'Store',
    titrePage: M.titre_page || 'commerce de quartier',
    navBoutique: M.nav_boutique || 'La boutique',
    produits: {
      nav: P.nav || cap(pp), rubrique: P.rubrique || cap(pp) + ' du moment', singulier: ps, pluriel: pp,
      ajouter: `Ajouter ${gp.un} ${ps}`, nouveau: `${gp.nouveau} ${ps}`, e: gp.e,
      famille: P.famille || '', familles: Array.isArray(P.familles) ? P.familles.filter((f) => Array.isArray(f) && f[0]) : [],
      autres: P.autres || 'Autres ' + pp, origine: P.origine || 'Origine',
      exPrecision: P.exemple_precision || '', exPrix: P.exemple_prix || '',
    },
    offres: {
      nav: O.nav || cap(op), rubrique: O.rubrique || cap(op), singulier: os, pluriel: op, e: go.e,
      ajouter: `Ajouter ${go.un} ${os}`, nouveau: `${go.nouveau} ${os}`, bouton: O.bouton || 'Faire une demande',
    },
    demande: {
      type, rubrique: D.rubrique || 'Demandes reçues',
      quantite: type === 'retrait' ? (D.quantite || '') : '', unite: D.unite || '', parUnite: D.par_unite || '',
      date: D.date || (type === 'devis' ? 'Date souhaitée' : 'Jour du retrait'),
      precisions: D.precisions || (type === 'devis' ? 'Décrivez votre demande' : 'Précisions'),
      exemple: D.exemple || '', lien: D.lien || '', lienTexte: D.lien_texte || 'Réserver en ligne',
      nav: D.nav || (type === 'devis' ? 'Demander un devis' : 'Commander'),
      /* Vocabulaire facultatif : qui répond (« la boutique », « l’atelier », « le restaurant »), phrase du jour, mot du sujet de l'e-mail */
      qui: D.qui || 'la boutique', a: /^(le|les) /i.test(D.qui || '') ? 'a' + (/^les /i.test(D.qui) ? 'ux ' : 'u ') + D.qui.replace(/^(le|les) /i, '') : 'à ' + (D.qui || 'la boutique'),
      sansPrix: typeof D.sans_prix === 'string' ? D.sans_prix : undefined, etapeJour: D.etape_jour || 'Indiquez le jour et l’heure du retrait', jourPhrase: D.jour_phrase || 'Retrait le', sujet: D.sujet || (type === 'devis' ? 'Demande de devis' : 'Commande'),
    },
